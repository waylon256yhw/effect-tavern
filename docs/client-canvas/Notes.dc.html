<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Phone · Record sheet</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#525252}a:hover{color:#151515}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #fcfcfb; color: #151515; font-family: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.45;">

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8, 10, 9, 0.34);"></div>

  <section role="dialog" aria-label="Record of turn 2" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; display: flex; flex-direction: column; background: #ffffff; border-radius: 16px 16px 0 0; box-shadow: 0 0 0 1px rgba(20, 20, 20, 0.1), 0 8px 24px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);">

    <div style="flex: none; position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 22px 12px 10px 20px;">
      <span aria-hidden="true" style="position: absolute; top: 8px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: rgba(20, 20, 20, 0.2);"></span>
      <div style="flex: 1 1 auto; min-width: 0;">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600;">Turn 2</h2>
        <p style="margin: 2px 0 0; font-size: 12px; color: #8a8a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">问他是否认识一个叫李玉的人</p>
      </div>
      <a href="Main.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-top: -8px; border-radius: 8px; display: grid; place-items: center; color: #525252; text-decoration: none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 10px;">

      <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #525252;"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"></path></svg>
          <span style="flex: 0 1 auto; min-width: 0; max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #525252;">持剑者·警惕</span>
          <span style="flex: 1 1 auto;"></span>
          <span style="font-size: 12px; color: #8a8a8a;">高</span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #8a8a8a;"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="font-size: 15px; font-weight: 600;">戒备</span>
        </div>
        <div role="img" aria-label="警惕: step 4 of 4, up one this turn" style="display: flex; gap: 2px;">
          <span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #8a8a8a;"></span>
          <span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #8a8a8a;"></span>
          <span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #8a8a8a;"></span>
          <span style="flex: 1 1 0; height: 6px; border-radius: 3px; background: #151515;"></span>
        </div>
        <div aria-hidden="true" style="display: flex; font-size: 11px; color: #8a8a8a;">
          <span style="flex: 1 1 0;">低</span><span style="flex: 1 1 0;">中</span><span style="flex: 1 1 0;">高</span><span style="flex: 1 1 0; color: #151515; font-weight: 600;">戒备</span>
        </div>
      </div>

      <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #525252;"><rect x="4.5" y="4.5" width="15" height="15" rx="3"></rect><circle cx="9" cy="9" r="1.1" fill="currentColor"></circle><circle cx="15" cy="15" r="1.1" fill="currentColor"></circle><circle cx="12" cy="12" r="1.1" fill="currentColor"></circle></svg>
          <span style="flex: 0 1 auto; min-width: 0; max-width: 8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #525252;">察觉</span>
          <span style="flex: 1 1 auto;"></span>
          <span style="display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: 999px; background: #1f7a3f; color: #ffffff; font-size: 12px; font-weight: 600; white-space: nowrap;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Success</span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span style="font-size: 28px; font-weight: 600; line-height: 1;">17</span>
          <span style="font-size: 12px; color: #8a8a8a; font-variant-numeric: tabular-nums; white-space: nowrap;">= 15 + 2</span>
        </div>
        <div role="img" aria-label="d20, DC 12, rolled 17" style="position: relative; height: 32px; margin: 0 6px;">
          <span style="position: absolute; left: 0; right: 0; top: 6px; height: 6px; border-radius: 3px; background: rgba(20, 20, 20, 0.1);"></span>
          <span style="position: absolute; left: 60%; right: 0; top: 6px; height: 6px; border-radius: 0 3px 3px 0; background: rgba(31, 122, 63, 0.22);"></span>
          <span style="position: absolute; left: 60%; top: 0; width: 2px; height: 18px; margin-left: -1px; background: #525252;"></span>
          <span style="position: absolute; left: 85%; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #1f7a3f; box-shadow: 0 0 0 2px #ffffff;"></span>
          <span style="position: absolute; left: 60%; top: 22px; transform: translateX(-50%); font-size: 10px; line-height: 1; color: #8a8a8a; font-variant-numeric: tabular-nums; white-space: nowrap;">DC 12</span>
        </div>
      </div>

      <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px; color: #525252;"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; color: #8a8a8a;">Clue</span>
          <p style="margin: 0; font-size: 14px; line-height: 1.6;">持剑的男子听到“李玉”时，握剑的手紧了一下。</p>
        </div>
        <button aria-label="Pin" style="flex: none; width: 32px; height: 32px; margin: -6px -8px 0 0; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; color: #8a8a8a; cursor: pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3H7l3-3-1-5zM12 12v8"></path></svg></button>
      </div>

      <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px; color: #525252;"><path d="M5 4.5h9a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z M17 7.5h2V20h-2"></path></svg>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 11px; color: #8a8a8a;">Notes</span>
          <ul style="margin: 0; padding-left: 1.1em; font-size: 14px; line-height: 1.65; color: #525252;">
            <li>你说自己是在山下茶棚听人提起李玉。</li>
            <li>道人似乎认识李玉，语气里有怨气。</li>
          </ul>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #525252;"><path d="M12 21s-6-5.3-6-10.5a6 6 0 0 1 12 0C18 15.7 12 21 12 21z"></path><circle cx="12" cy="10.5" r="2.2"></circle></svg>
          <span style="font-size: 11px; color: #8a8a8a;">位置</span>
          <span style="font-size: 14px; font-weight: 600; line-height: 1.3;">竹林小径</span>
        </div>
        <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #525252;"><path d="M4 17h16M6 17a6 6 0 0 1 12 0M12 5v2M5.6 8.6l1.4 1.4M18.4 8.6L17 10"></path></svg>
          <span style="font-size: 11px; color: #8a8a8a;">时间</span>
          <span style="font-size: 14px; font-weight: 600; line-height: 1.3;">第三天 黄昏</span>
        </div>
        <div style="background: rgba(20, 20, 20, 0.04); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #525252;"><path d="M7 15a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.5 1.5A3.25 3.25 0 0 1 17.5 15H7zM9 18l-1 2M13 18l-1 2M17 18l-1 2"></path></svg>
          <span style="font-size: 11px; color: #8a8a8a;">天气</span>
          <span style="font-size: 14px; font-weight: 600; line-height: 1.3;">将雨</span>
        </div>
      </div>

      <div style="display: flex; gap: 4px; padding-top: 6px;">
        <button aria-label="Swipe" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; color: #525252; cursor: pointer;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4"></path></svg></button>
        <button aria-label="Reword" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; color: #525252; cursor: pointer;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19L15 9M14 4v3M19 9h-3M17.5 5.5l-2 2M9 5l.6 1.4L11 7l-1.4.6L9 9l-.6-1.4L7 7l1.4-.6z"></path></svg></button>
        <button aria-label="Edit" style="width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; color: #525252; cursor: pointer;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"></path></svg></button>
      </div>

    </div>
  </section>

</div>
</x-dc>

</html>
