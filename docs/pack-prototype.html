<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>写作包与小剧场/代称联动原型 (Issue #69)</title>
  <style>
    /* ───────── 1. Design Tokens ───────── */
    :root {
      color-scheme: light dark;

      --surface-0: light-dark(#f3f3ef, #0b0b0b);
      --surface-1: light-dark(#fcfcfb, #151514);
      --surface-2: light-dark(#ffffff, #1c1c1b);
      --surface-3: light-dark(#ffffff, #242423);

      --ink: light-dark(#151515, #f5f5f3);
      --ink-2: light-dark(#525252, #a3a3a1);
      --ink-3: light-dark(#8a8a8a, #6f6f6d);

      --alpha-1: light-dark(rgb(20 20 20 / 0.04), rgb(255 255 255 / 0.045));
      --alpha-2: light-dark(rgb(20 20 20 / 0.08), rgb(255 255 255 / 0.085));
      --alpha-3: light-dark(rgb(20 20 20 / 0.16), rgb(255 255 255 / 0.16));
      --alpha-4: light-dark(rgb(20 20 20 / 0.28), rgb(255 255 255 / 0.28));
      --ghost-hover: var(--alpha-1);

      --primary: var(--ink);
      --primary-ink: var(--surface-1);
      --danger: light-dark(#dc2626, #f87171);
      --warn: light-dark(#b45309, #fbbf24);
      --warn-soft: light-dark(rgb(180 83 9 / 0.11), rgb(251 191 36 / 0.14));
      --ok: light-dark(#16a34a, #22c55e);
      --ok-soft: light-dark(rgb(22 163 74 / 0.12), rgb(34 197 94 / 0.15));
      --scrim: light-dark(rgb(0 0 0 / 0.22), rgb(0 0 0 / 0.58));
      --ring: var(--alpha-4);

      --shadow-1:
        0 1px 2px light-dark(rgb(0 0 0 / 0.04), rgb(0 0 0 / 0.4)),
        0 2px 8px light-dark(rgb(0 0 0 / 0.06), rgb(0 0 0 / 0.4));
      --shadow-2:
        0 2px 4px light-dark(rgb(0 0 0 / 0.04), rgb(0 0 0 / 0.45)),
        0 8px 20px light-dark(rgb(0 0 0 / 0.06), rgb(0 0 0 / 0.45));
      --shadow-pop:
        0 16px 44px light-dark(rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.72)),
        0 4px 12px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.5));

      --radius-sm: 6px;
      --radius: 9px;
      --radius-card: 12px;
      --radius-dialog: 16px;
      --radius-pill: 999px;

      --shell-top: 38px;
      --control-lg: 36px;
      --control: 32px;
      --control-sm: 26px;

      --font-sans:
        system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --text-caption: 0.75rem;
      --text-footnote: 0.8125rem;
      --text-body: 0.875rem;
      --text-heading: 1rem;
      --text-title: 1.25rem;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 28px;

      --dur-1: 80ms;
      --dur-2: 150ms;
      --dur-3: 240ms;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: 1.5;
      color: var(--ink);
      background: var(--surface-0);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, fieldset {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
    }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
    h1, h2, h3, h4, p, ul { margin: 0; padding: 0; list-style: none; }
    .mono { font-family: var(--font-mono); }
    .spacer { flex: 1; }

    /* ───────── 2. Floating Demo Switcher (Bottom-Right) ───────── */
    .demo-dock {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 95;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-caption);
      user-select: none;
    }
    .demo-dock button {
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-weight: 500;
    }
    .demo-dock button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
      font-weight: 600;
    }
    .demo-dock .sep {
      width: 1px;
      height: 12px;
      background: var(--alpha-2);
    }

    /* ───────── 3. Viewport & Top Shell Bar (.shell-top) ───────── */
    .app-wrap {
      height: 100dvh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface-0);
    }
    .app-wrap[data-vp="mobile"] {
      background: light-dark(#e2e2de, #050505);
      align-items: center;
      justify-content: center;
      padding: var(--space-3);
    }
    .shell-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface-0);
      position: relative;
    }
    .app-wrap[data-vp="mobile"] .shell-frame {
      max-width: 390px;
      max-height: 820px;
      border-radius: 38px;
      box-shadow: var(--shadow-pop);
      background: var(--surface-1);
    }

    .shell-top {
      flex: none;
      height: var(--shell-top);
      padding: 0 20px 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-0);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      user-select: none;
    }
    .app-wrap[data-vp="mobile"] .shell-top {
      display: none;
    }
    .shell-back {
      height: 26px;
      padding: 0 8px 0 6px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink-2);
      font-weight: 550;
    }
    .shell-back:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .shell-back svg {
      width: 15px;
      height: 15px;
    }

    /* ───────── 4. Shared Controls (Borderless Tonal Surfaces) ───────── */
    .scroller {
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color var(--dur-3) var(--ease);
    }
    .scroller:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    .icon-btn {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius);
      display: inline-grid;
      place-items: center;
      color: var(--ink-2);
      flex: none;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .icon-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .icon-btn svg {
      width: 18px;
      height: 18px;
    }
    .icon-btn.sm {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: var(--radius-sm);
    }
    .icon-btn.sm svg {
      width: 15px;
      height: 15px;
    }

    .btn {
      height: var(--control);
      padding: 0 12px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: none;
      background: var(--alpha-1);
      font-size: var(--text-footnote);
      font-weight: 550;
      white-space: nowrap;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .btn:hover {
      background: var(--alpha-2);
    }
    .btn svg {
      width: 14px;
      height: 14px;
    }
    .btn.sm {
      height: var(--control-sm);
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: var(--text-caption);
    }
    .btn.primary {
      background: var(--primary);
      color: var(--primary-ink);
    }
    .btn.primary:hover {
      opacity: 0.92;
      background: var(--primary);
    }
    .btn.ghost {
      background: none;
      color: var(--ink-2);
    }
    .btn.ghost:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .btn.danger {
      color: var(--danger);
    }

    .tag {
      flex: none;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: var(--radius-sm);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-caption);
      white-space: nowrap;
    }
    .tag.warn {
      background: var(--warn-soft);
      color: var(--warn);
      font-weight: 600;
    }

    .switch {
      flex: none;
      width: 36px;
      height: 20px;
      padding: 2px;
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-pill);
      background: var(--alpha-3);
      transition: background var(--dur-2) var(--ease);
    }
    .switch[aria-checked="true"] {
      background: var(--ok);
    }
    .switch .thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.25);
      transition: translate var(--dur-2) var(--ease);
    }
    .switch[aria-checked="true"] .thumb {
      translate: 16px 0;
    }

    /* ───────── 5. View 1: Settings Three-Card Canvas (.settings) ───────── */
    .settings {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 13.5rem 16.5rem minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: 8px;
      padding: 0 8px 8px;
      background: var(--surface-0);
    }
    .phone-bar,
    .mobile-back {
      display: none;
    }

    .nav-card {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      padding: var(--space-5) var(--space-3);
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      user-select: none;
    }
    .nav-head {
      display: flex;
      align-items: center;
      min-height: var(--control);
      padding-left: var(--space-3);
    }
    .nav-head h1 {
      font-size: var(--text-title);
      font-weight: 650;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .nav-item,
    .p-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 40px;
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      color: var(--ink-2);
      text-align: left;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--ink-3);
    }
    .nav-item:hover,
    .p-row:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .nav-item[aria-current="page"],
    .p-row[aria-selected="true"] {
      background: var(--surface-3);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-1);
    }
    .nav-item[aria-current="page"] svg {
      color: var(--ink);
    }

    .master-card,
    .detail-card {
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
    }
    .detail-card {
      box-shadow: var(--shadow-2);
    }
    .master-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: var(--space-4) var(--space-3) var(--space-2);
    }
    .p-row {
      flex: none;
      height: 42px;
      padding: 0 10px;
    }
    .p-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .master-foot {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-3);
    }
    .master-foot .btn {
      flex: 1;
      height: 36px;
    }

    .detail-header {
      flex: none;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-6) var(--space-1);
    }
    .name-input {
      font-size: var(--text-heading);
      font-weight: 650;
      height: var(--control);
      padding: 0 var(--space-2);
      margin-left: calc(-1 * var(--space-2));
      border-radius: var(--radius-sm);
      min-width: 7rem;
      max-width: 16rem;
    }
    .name-input:hover,
    .name-input:focus {
      background: var(--alpha-1);
      outline: none;
    }

    /* ───────── 6. The 5 Fixed Modules (Soft Tonal Wells, Zero Divider Lines) ───────── */
    .detail-scroll {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-6) var(--space-6);
    }

    .mod-card {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-card);
      background: var(--alpha-1);
    }
    .mod-head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 26px;
    }
    .mod-head h3 {
      font-size: var(--text-body);
      font-weight: 600;
    }
    .mod-actions {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .mod-card .btn {
      background: var(--surface-2);
    }
    .mod-card .btn:hover {
      background: var(--surface-3);
    }
    .mod-card .btn.ghost {
      background: none;
    }
    .mod-card .btn.ghost:hover {
      background: var(--alpha-1);
    }

    .item-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .item-pill {
      height: 30px;
      max-width: 100%;
      padding: 0 11px;
      border-radius: var(--radius);
      background: var(--surface-2);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-footnote);
      color: var(--ink);
      transition: background var(--dur-1);
    }
    .item-pill:hover {
      background: var(--surface-3);
    }
    .item-pill .preview {
      max-width: 16rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--ink-2);
    }
    .item-pill .dot-on {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      flex: none;
    }

    /* Inline hole-input chips (for Pack.names and Player.names) */
    .name-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .name-chip {
      height: 32px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: var(--surface-2);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--text-footnote);
    }
    .name-chip[data-unfilled="true"] {
      background: var(--warn-soft);
    }
    .name-chip .hole-key {
      font-family: var(--font-mono);
      font-size: var(--text-caption);
      color: var(--ink-3);
    }
    .name-chip[data-unfilled="true"] .hole-key {
      color: var(--warn);
      font-weight: 600;
    }
    .name-chip input {
      width: 6.5rem;
      font-size: var(--text-footnote);
      font-weight: 550;
      outline: none;
    }
    .name-chip input::placeholder {
      color: var(--ink-3);
      font-weight: 400;
    }

    .compact-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .compact-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: 34px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: var(--surface-2);
      text-align: left;
      cursor: pointer;
      transition: background var(--dur-1);
    }
    .compact-row:hover {
      background: var(--surface-3);
    }
    .compact-row[data-off="true"] .row-text {
      opacity: 0.45;
    }
    .compact-row .row-text {
      flex: 1;
      min-width: 0;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ───────── 7. View 2: Writing Workbench in Play (.wpage / .wsheet) ───────── */
    .wpage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 var(--space-5) var(--space-5);
      background: var(--surface-0);
    }
    .wsheet {
      width: 100%;
      max-width: 56rem;
      height: min(44rem, 100%);
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .whead {
      flex: none;
      min-height: 56px;
      padding: var(--space-2) var(--space-4) var(--space-2) var(--space-3);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
    }
    .whead h1 {
      font-size: var(--text-heading);
      font-weight: 650;
    }
    .card-switcher {
      display: inline-flex;
      gap: 2px;
      padding: 2px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
    }
    .card-switcher button {
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      font-size: var(--text-caption);
      color: var(--ink-2);
      font-weight: 550;
    }
    .card-switcher button[aria-pressed="true"] {
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-1);
    }

    .wtabs {
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
    }
    .wtabs button {
      height: 28px;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 550;
      white-space: nowrap;
    }
    .wtabs button[aria-selected="true"] {
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-1);
    }

    /* Per-Card Pack Mount & Hole Strip at top of Writing Sheet */
    .wmount {
      flex: none;
      margin: 0 var(--space-5);
      padding: 10px 14px;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .wmount-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .wmount-label {
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-3);
      min-width: 3.2rem;
    }
    .pack-chip {
      height: 28px;
      padding: 0 11px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .pack-chip:hover {
      background: var(--surface-3);
      color: var(--ink);
    }
    .pack-chip[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-ink);
      font-weight: 550;
    }

    .wbody {
      flex: 1;
      min-height: 0;
      padding: var(--space-4) var(--space-5) var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .wsec {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .block-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 26px;
    }
    .block-title h3 {
      font-size: var(--text-body);
      font-weight: 600;
    }
    .block-title .right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sw-grid,
    .prod-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
    }
    .sw-card {
      padding: 10px 14px;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
    }
    .sw-card legend {
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-3);
    }
    .sw-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .sw-pills button {
      height: 26px;
      padding: 0 11px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: var(--text-footnote);
    }
    .sw-pills button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--primary-ink);
      font-weight: 550;
    }

    .prod-kind {
      grid-column: 1 / -1;
      margin-top: 4px;
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-3);
    }
    .prod-item {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 42px;
      padding: 0 12px;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
    }
    .prod-item[data-editable="true"] {
      cursor: pointer;
      transition: background var(--dur-1);
    }
    .prod-item[data-editable="true"]:hover {
      background: var(--alpha-2);
    }
    .prod-item .pname {
      flex: 1;
      min-width: 0;
      font-size: var(--text-body);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ───────── 8. Spatial Layer 1: Slide-Over Side Drawer (.side-drawer) ───────── */
    .drawer-scrim {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: var(--scrim);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-3) var(--ease);
    }
    .drawer-scrim[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }
    .side-drawer {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      bottom: var(--space-3);
      width: min(28rem, calc(100% - 2 * var(--space-3)));
      z-index: 35;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      translate: calc(100% + var(--space-4)) 0;
      transition: translate var(--dur-3) var(--ease);
      overflow: hidden;
    }
    .side-drawer[data-open="true"] {
      translate: 0 0;
    }
    .drawer-head {
      flex: none;
      height: 52px;
      padding: var(--space-2) var(--space-3) 0 var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .drawer-head h3 {
      font-size: var(--text-heading);
      font-weight: 650;
    }
    .drawer-search {
      flex: none;
      padding: var(--space-2) var(--space-4);
    }
    .search-box {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: var(--control);
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      background: var(--alpha-1);
    }
    .search-box svg {
      width: 15px;
      height: 15px;
      color: var(--ink-3);
      flex: none;
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      font-size: var(--text-footnote);
      outline: none;
    }
    .drawer-body {
      flex: 1;
      min-height: 0;
      padding: var(--space-2) var(--space-4) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .drawer-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: 38px;
      padding: 0 12px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      cursor: pointer;
      transition: background var(--dur-1);
    }
    .drawer-row:hover {
      background: var(--alpha-2);
    }
    .drawer-row .d-name {
      font-size: var(--text-footnote);
      font-weight: 600;
      white-space: nowrap;
    }
    .drawer-row .d-preview {
      flex: 1;
      min-width: 0;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ───────── 9. Spatial Layer 2: Centered Dialog Modal (<dialog class="modal">) ───────── */
    dialog.modal {
      width: min(28rem, calc(100vw - 2 * var(--space-4)));
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      outline: none;
      overflow: hidden;
    }
    dialog.modal[open] {
      display: flex;
      flex-direction: column;
    }
    dialog.modal::backdrop {
      background: var(--scrim);
    }
    .modal-head {
      height: 48px;
      padding: var(--space-2) var(--space-3) 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h3 {
      font-size: var(--text-heading);
      font-weight: 650;
    }
    .modal-body {
      padding: var(--space-3) var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .modal-foot {
      padding: var(--space-2) var(--space-4) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-2);
    }
    .mfield {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mfield > span {
      font-size: var(--text-footnote);
      color: var(--ink-3);
    }
    .mfield input,
    .mfield textarea {
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-size: var(--text-body);
      line-height: 1.55;
      resize: none;
      outline: none;
    }
    .mfield input:focus,
    .mfield textarea:focus {
      background: var(--alpha-2);
    }
    .at-toggle {
      display: inline-flex;
      align-self: flex-start;
      gap: 2px;
      padding: 2px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
    }
    .at-toggle button {
      height: 26px;
      padding: 0 12px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-size: var(--text-caption);
      font-weight: 550;
    }
    .at-toggle button[aria-pressed="true"] {
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-1);
    }

    /* ───────── 10. Mobile 390px Rules ───────── */
    .app-wrap[data-vp="mobile"] .settings {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0;
      padding: 0;
      background: var(--surface-1);
    }
    .app-wrap[data-vp="mobile"] .nav-card {
      display: none;
    }
    .app-wrap[data-vp="mobile"] .phone-bar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 10px var(--space-3) 6px var(--space-2);
    }
    .phone-bar .title {
      flex: 1;
      font-size: var(--text-heading);
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .phone-bar .tabs {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
    }
    .phone-bar .tabs button {
      width: 32px;
      height: 28px;
      border-radius: var(--radius-pill);
      display: grid;
      place-items: center;
      color: var(--ink-3);
    }
    .phone-bar .tabs button svg {
      width: 16px;
      height: 16px;
    }
    .phone-bar .tabs button[aria-selected="true"] {
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-1);
    }
    .app-wrap[data-vp="mobile"] .master-card,
    .app-wrap[data-vp="mobile"] .detail-card {
      border-radius: 0;
      box-shadow: none;
    }
    .app-wrap[data-vp="mobile"] .settings[data-pane="list"] .detail-card,
    .app-wrap[data-vp="mobile"] .settings[data-pane="detail"] .master-card {
      display: none;
    }
    .app-wrap[data-vp="mobile"] .mobile-back {
      display: inline-grid;
    }
    .app-wrap[data-vp="mobile"] .detail-header {
      min-height: 48px;
      padding: var(--space-2) var(--space-3);
    }
    .app-wrap[data-vp="mobile"] .detail-scroll {
      padding: var(--space-2) var(--space-3) var(--space-6);
      gap: var(--space-2);
    }
    .app-wrap[data-vp="mobile"] .mod-card {
      padding: 10px var(--space-3);
    }
    .app-wrap[data-vp="mobile"] .wpage {
      padding: 0;
      background: var(--surface-1);
    }
    .app-wrap[data-vp="mobile"] .wsheet {
      height: 100%;
      border-radius: 0;
      box-shadow: none;
    }
    .app-wrap[data-vp="mobile"] .wtabs {
      width: 100%;
    }
    .app-wrap[data-vp="mobile"] .wtabs button {
      flex: 1;
      padding: 0 6px;
      font-size: var(--text-caption);
    }
    .app-wrap[data-vp="mobile"] .wmount {
      margin: 0 var(--space-3);
    }
    .app-wrap[data-vp="mobile"] .wbody {
      padding: var(--space-3);
    }
    .app-wrap[data-vp="mobile"] .sw-grid,
    .app-wrap[data-vp="mobile"] .prod-grid {
      grid-template-columns: minmax(0, 1fr);
    }
    .app-wrap[data-vp="mobile"] dialog.modal {
      width: calc(min(390px, 100vw) - 24px);
    }
  </style>
</head>

  <script>
    const ICONS = {
      plus: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round"><path d="M128 40v176M40 128h176"/></svg>`,
      back: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M216 128H40M112 56l-72 72 72 72"/></svg>`,
      trash: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M216 56H40M104 104v64M152 104v64M200 56v152a8 8 0 0 1-8 8H64a8 8 0 0 1-8-8V56M168 56V40a16 16 0 0 0-16-16h-48a16 16 0 0 0-16 16v16"/></svg>`,
      export: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M80 112l48 48 48-48M128 40v120M216 152v56a8 8 0 0 1-8 8H48a8 8 0 0 1-8-8v-56"/></svg>`,
      close: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round"><path d="M200 56L56 200M200 200L56 56"/></svg>`,
      search: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round"><circle cx="116" cy="116" r="76"/><path d="M170 170l50 50"/></svg>`,
      chevRight: `<svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"><path d="M96 48l80 80-80 80"/></svg>`,
    };

    const HOLE = /\{\{\s*([A-Za-z_]\w*)\s*\}\}/g;
    const holesOf = (text) => [...new Set(Array.from(text.matchAll(HOLE), (m) => m[1]))];
    const unfilledOf = (text, names) => holesOf(text).filter((k) => !names[k]);
    const hookOf = (text) => (text.trim().split(/(?<=[.。!?！？])\s*/)[0] || "").trim();

    // Cards in shelf (with Card.names defaults)
    const cardsById = {
      ri: {
        id: "ri",
        title: "理",
        persona: "克莱恩",
        names: {}, // Multi-character card (理 & 罗伦斯): char is intentionally not fixed by the card!

          { id: "people", label: "在场人物" }

    // Player layer state
    const playerState = {
      packs: {
        ri: ["pack-lotm", "pack-theater"],
        banxing: ["pack-theater"],
        zhulin: ["pack-wuxia"]
      },
      names: {
        ri: {}, // On《理》, {{char}} is unfilled until the player types "理" or "罗伦斯"!
        banxing: {},
        zhulin: {}
      },
      products: {
        scene: true,
        people: true,
        options: false,
        inner: true
      },
      theaters: []
    };

    const packs = [
      {
        id: "pack-new",
        name: "新写作包",
        fragments: [],
        entries: [],
        lexicon: [],
        theaters: [],
        snippets: [],
        names: {}
      },
      {
        id: "pack-theater",
        name: "同人与番外小剧场集",
        fragments: [],
        entries: [],
        lexicon: [],
        theaters: [
          {
            id: "reading-room",
            label: "同人阅读体小剧场",
            on: false,
            text: "现在停止角色扮演。在同人小说创作中，阅读体/观影体是让角色被拉进神秘空间看到自身相关故事（小说、剧本、漫画、视频屏幕等）并做出反应的形式。\n请结合{{char}}和{{user}}的人设与当前剧情生成一个载体故事，描写他们一起阅读/观影的番外剧场。内容有趣生动，可以略缺德和吐槽，一步步展示每个剧情点及人物反应。"
          },
          {
            id: "gunfighter-narrator",

    // ───────── VIEW 2: WRITING WORKBENCH IN PLAY (挂载包 + 代称填空 + 小剧场) ─────────
    function computeCardContext(cid) {
      const card = cardsById[cid];
      const mountedIds = playerState.packs[cid] || [];
      const mountedPacks = mountedIds.map((id) => packs.find((p) => p.id === id)).filter(Boolean);

      // Merged names: { user, ...card.names, ...packs.names, ...player.names[cid] }
      const baseNames = Object.assign(
        { user: card.persona || "玩家" },
        card.names,
        ...mountedPacks.map((p) => p.names || {})
      );
      const mergedNames = { ...baseNames, ...(playerState.names[cid] || {}) };

      // Resolve theater products: default inner + mounted packs' theaters + player.theaters
      const byId = new Map([
        [
          "inner",
          {
            id: "inner",
            label: "人物心声",
            text: "本幕角色心中所想但未说出口的话，简短一段。",
            on: false,
            source: null
          }
        ]
      ]);
      for (const pk of mountedPacks) {
        for (const th of pk.theaters) {
          const prev = byId.get(th.id);
          byId.set(th.id, {
            id: th.id,
            label: th.label || prev?.label || th.id,
            text: th.text || prev?.text || "",
            on: th.on ?? prev?.on ?? false,
            source: pk.name
          });
        }
      }
      for (const th of playerState.theaters) {
        const prev = byId.get(th.id);
        byId.set(th.id, {
          id: th.id,
          label: th.label || prev?.label || th.id,
          text: th.text || prev?.text || "",
          on: th.on ?? prev?.on ?? false,
          source: null
        });
      }
      const theaters = [...byId.values()];

      // Scan all outgoing texts for holes (excluding `user`)
      const outTexts = [
        ...mountedPacks.flatMap((p) => [
          ...p.fragments.map((x) => x.text),
          ...p.entries.map((x) => x.text),
          ...p.snippets.map((x) => x.text)
        ]),
        ...theaters.map((t) => t.text)
      ].join("\n");
      // Server GET /card computes `names` (merged) and `holes` (unfilled in order of appearance).
      // Client UI derives the row keys strictly from `holes ∪ (Object.keys(names) \ {"user"})`:
      const serverHoles = unfilledOf(outTexts, mergedNames);
      const nameKeys = [
        ...serverHoles,
        ...Object.keys(mergedNames).filter((k) => k !== "user" && !serverHoles.includes(k))
      ];

      return { card, mountedIds, mountedPacks, mergedNames, serverHoles, theaters, allHoles: nameKeys };
    }

    function renderWriting() {
      const sheet = document.getElementById("writingSheet");
      const ctx = computeCardContext(activeCardId);
      const { card, mountedIds, mergedNames, theaters, allHoles } = ctx;
      const libraryPacks = packs.filter((p) => p.id !== "pack-new" || totalCount(p) > 0);

      sheet.innerHTML = `
        <header class="whead">
          <div class="card-switcher" role="group" aria-label="切换卡片预览">
            ${Object.values(cardsById).map((c) => `
              <button type="button" data-switch-card="${c.id}" aria-pressed="${c.id === activeCardId ? "true" : "false"}">
                ${c.title}
              </button>
            `).join("")}
          </div>
          <h1>写作</h1>
          <span class="tag">${card.persona}</span>
          <span class="spacer"></span>
          <nav class="wtabs" role="tablist">
            <button type="button" role="tab" aria-selected="${activeWTab === "switches" ? "true" : "false"}" data-wtab="switches">开关与记录</button>
            <button type="button" role="tab" aria-selected="${activeWTab === "prose" ? "true" : "false"}" data-wtab="prose">文风与要求</button>
            <button type="button" role="tab" aria-selected="${activeWTab === "polish" ? "true" : "false"}" data-wtab="polish">润色与禁词</button>
            <button type="button" role="tab" aria-selected="${activeWTab === "inputs" ? "true" : "false"}" data-wtab="inputs">快捷输入</button>
          </nav>
        </header>

        <!-- Per-card Pack Mounts & Derived Holes ({{char}}, {{char_place}}, etc.) -->
        <div class="wmount">
          <div class="wmount-row">
            <span class="wmount-label">写作包</span>
            ${libraryPacks.map((p) => `
              <button
                type="button"
                class="pack-chip"
                aria-pressed="${mountedIds.includes(p.id) ? "true" : "false"}"
                data-toggle-mount="${p.id}"
              >
                <span>${p.name}</span>
              </button>
            `).join("")}
            <button type="button" class="btn sm ghost" id="jumpToPacksBtn">
              <span>管理</span> ${ICONS.chevRight}
            </button>
          </div>
          ${allHoles.length > 0 ? `
            <div class="wmount-row">
              <span class="wmount-label">代称</span>
              <span class="tag mono">{{user}} = ${mergedNames.user}</span>
              ${allHoles.map((k) => {
                const val = mergedNames[k] || "";
                return `
                  <label class="name-chip" data-unfilled="${!val ? "true" : "false"}">
                    <span class="hole-key">{{${k}}}</span>
                    <input
                      value="${val}"
                      placeholder="未填写"
                      data-card-hole="${k}"
                    />
                  </label>
                `;
              }).join("")}
            </div>
          ` : ""}
        </div>

        <div class="wbody scroller">
          <div class="wsec">
            <div class="block-title">
              <h3>叙事开关</h3>
              <div class="right">
                <button type="button" class="btn sm ghost">全部跟随卡片</button>
              </div>
            </div>
            <div class="sw-grid">
              <fieldset class="sw-card">
                <legend>视角</legend>
                <div class="sw-pills">
                  <button type="button" aria-pressed="true">跟随卡片</button>
                  <button type="button" aria-pressed="false">第二人称</button>
                  <button type="button" aria-pressed="false">第三人称</button>
                  <button type="button" aria-pressed="false">无主角</button>
                </div>
              </fieldset>
              <fieldset class="sw-card">
                <legend>篇幅</legend>
                <div class="sw-pills">
                  <button type="button" aria-pressed="true">跟随卡片</button>
                  <button type="button" aria-pressed="false">简短</button>
                  <button type="button" aria-pressed="false">适中</button>
                  <button type="button" aria-pressed="false">详尽</button>
                </div>
              </fieldset>
            </div>
          </div>

          <div class="wsec">
            <div class="block-title">
              <h3>每轮记录</h3>
              <div class="right">
                <button type="button" class="btn sm" id="addPlayerTheaterBtn">${ICONS.plus} <span>添加小剧场</span></button>
              </div>
            </div>
            <div class="prod-grid">
              ${card.worldProducts.length > 0 ? `
                <h4 class="prod-kind">状态</h4>
                ${card.worldProducts.map((wp) => {
                  const isOn = playerState.products[wp.id] ?? true;
                  return `
                    <div class="prod-item">
                      <span class="pname">${wp.label}</span>
                      <span class="tag">${card.title}</span>
                      <button type="button" class="switch" role="switch" aria-checked="${isOn ? "true" : "false"}" data-flip-prod="${wp.id}">
                        <span class="thumb"></span>
                      </button>
                    </div>
                  `;
                }).join("")}
              ` : ""}

              <h4 class="prod-kind">小剧场</h4>
              <!-- options: list shape, switch only -->
              <div class="prod-item">
                <span class="pname">行动选项</span>
                <button type="button" class="switch" role="switch" aria-checked="${playerState.products.options ? "true" : "false"}" data-flip-prod="options">
                  <span class="thumb"></span>
                </button>
              </div>

              <!-- text-shaped theaters: clickable to edit label & prompt text! -->
              ${theaters.map((th) => {
                const isOn = playerState.products[th.id] ?? th.on;
                const missing = unfilledOf(th.text, mergedNames);
                return `
                  <div class="prod-item" data-editable="true" data-edit-wtheater="${th.id}">
                    <span class="pname">${th.label}</span>
                    ${missing.map((m) => `<span class="tag warn mono">{{${m}}}</span>`).join("")}
                    ${th.source ? `<span class="tag">${th.source}</span>` : ""}
                    <button type="button" class="switch" role="switch" aria-checked="${isOn ? "true" : "false"}" data-flip-prod="${th.id}">
                      <span class="thumb"></span>
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;

      sheet.querySelectorAll("[data-switch-card]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeCardId = btn.dataset.switchCard;
          renderWriting();
        });
      });
      sheet.querySelectorAll("[data-wtab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeWTab = btn.dataset.wtab;
          renderWriting();
        });
      });
      sheet.querySelectorAll("[data-toggle-mount]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const pid = btn.dataset.toggleMount;
          const cur = playerState.packs[activeCardId] || [];
          playerState.packs[activeCardId] = cur.includes(pid)
            ? cur.filter((x) => x !== pid)
            : [...cur, pid];
          renderWriting();
          renderList();
        });
      });
      sheet.querySelector("#jumpToPacksBtn")?.addEventListener("click", () => {
        setViewMode("settings");
      });
      sheet.querySelectorAll("[data-card-hole]").forEach((inp) => {
        inp.addEventListener("input", () => {
          const k = inp.dataset.cardHole;
          const v = inp.value.trim();
          playerState.names[activeCardId] = playerState.names[activeCardId] || {};
          if (v) playerState.names[activeCardId][k] = v;
          else delete playerState.names[activeCardId][k];
          renderWriting();
          const next = sheet.querySelector(`[data-card-hole="${k}"]`);
          if (next) {
            next.focus();
            next.setSelectionRange(v.length, v.length);
          }
        });
      });
      sheet.querySelectorAll("[data-flip-prod]").forEach((sw) => {
        sw.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = sw.dataset.flipProd;
          const th = theaters.find((t) => t.id === id);
          const cur = playerState.products[id] ?? th?.on ?? false;
          playerState.products[id] = !cur;
          renderWriting();
        });
      });
      sheet.querySelector("#addPlayerTheaterBtn")?.addEventListener("click", () => {
        openTheaterModal(-1, true);
      });
      sheet.querySelectorAll("[data-edit-wtheater]").forEach((row) => {
        row.addEventListener("click", () => {
          const id = row.dataset.editWtheater;
          openWritingTheaterModal(id, theaters);
        });
      });
    }

    // ───────── Modal Helpers ─────────
    const modal = document.getElementById("itemModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalFoot = document.getElementById("modalFoot");
    document.getElementById("closeModalBtn").addEventListener("click", () => modal.close());

    function openFragModal(idx) {
      const p = currentPack();
      const cur = idx >= 0 ? { ...p.fragments[idx] } : { id: `req-${p.fragments.length + 1}`, at: "tail", enabled: true, text: "" };
      modalTitle.textContent = idx >= 0 ? "编辑要求" : "添加要求";
      modalBody.innerHTML = `
        <div class="mfield">
          <span>位置</span>
          <div class="at-toggle">
            <button type="button" id="mAtTail" aria-pressed="${cur.at === "tail" ? "true" : "false"}">每轮末尾</button>
            <button type="button" id="mAtHead" aria-pressed="${cur.at !== "tail" ? "true" : "false"}">开头</button>
          </div>
        </div>
        <label class="mfield">
          <span>要求</span>
          <textarea id="mFragText" rows="5">${cur.text}</textarea>
        </label>
      `;
      modalFoot.innerHTML = `
        ${idx >= 0 ? `<button type="button" class="btn sm ghost danger" id="mDelBtn">删除</button><span class="spacer"></span>` : ""}
        <button type="button" class="btn sm ghost" id="mCancelBtn">取消</button>
        <button type="button" class="btn sm primary" id="mSaveBtn">保存</button>
      `;
      let at = cur.at;
      modalBody.querySelector("#mAtTail").onclick = () => {
        at = "tail";
        modalBody.querySelector("#mAtTail").setAttribute("aria-pressed", "true");
        modalBody.querySelector("#mAtHead").setAttribute("aria-pressed", "false");
      };
      modalBody.querySelector("#mAtHead").onclick = () => {
        at = "head";
        modalBody.querySelector("#mAtHead").setAttribute("aria-pressed", "true");
        modalBody.querySelector("#mAtTail").setAttribute("aria-pressed", "false");
      };
      modalFoot.querySelector("#mCancelBtn").onclick = () => modal.close();
      modalFoot.querySelector("#mDelBtn")?.addEventListener("click", () => {
        p.fragments.splice(idx, 1);
        modal.close();
        renderList();
        renderDetail();
      });
      modalFoot.querySelector("#mSaveBtn").onclick = () => {
        const text = modalBody.querySelector("#mFragText").value.trim();
        if (!text) return;
        const item = { id: cur.id, at, enabled: cur.enabled !== false, text };
        if (idx >= 0) p.fragments[idx] = item;
        else p.fragments.push(item);
        modal.close();
        renderList();
        renderDetail();
      };
      modal.showModal();
    }

    function openEntryModal(idx) {
      const p = currentPack();
      const cur = idx >= 0 ? { ...p.entries[idx] } : { id: "", text: "" };
      modalTitle.textContent = idx >= 0 ? "编辑词条" : "添加词条";
      modalBody.innerHTML = `
        <label class="mfield">
          <span>名称</span>
          <input id="mEntryId" value="${cur.id}" />
        </label>
        <label class="mfield">
          <span>内容</span>
          <textarea id="mEntryText" rows="6">${cur.text}</textarea>
        </label>
      `;
      modalFoot.innerHTML = `
        ${idx >= 0 ? `<button type="button" class="btn sm ghost danger" id="mDelBtn">删除</button><span class="spacer"></span>` : ""}
        <button type="button" class="btn sm ghost" id="mCancelBtn">取消</button>
        <button type="button" class="btn sm primary" id="mSaveBtn">保存</button>
      `;
      modalFoot.querySelector("#mCancelBtn").onclick = () => modal.close();
      modalFoot.querySelector("#mDelBtn")?.addEventListener("click", () => {
        p.entries.splice(idx, 1);
        modal.close();
        renderList();
        renderDetail();
      });
      modalFoot.querySelector("#mSaveBtn").onclick = () => {
        const text = modalBody.querySelector("#mEntryText").value.trim();
        if (!text) return;
        const id = modalBody.querySelector("#mEntryId").value.trim() || hookOf(text).slice(0, 12);
        if (idx >= 0) p.entries[idx] = { id, text };
        else p.entries.push({ id, text });
        modal.close();
        renderList();
        renderDetail();
      };
      modal.showModal();
    }

    function openLexModal(idx) {
      const p = currentPack();
      const cur = idx >= 0 ? { ...p.lexicon[idx] } : { pattern: "", hint: "" };
      modalTitle.textContent = idx >= 0 ? "编辑禁词" : "添加禁词";
      modalBody.innerHTML = `
        <label class="mfield">
          <span>匹配词条</span>
          <input id="mLexPat" value="${cur.pattern}" />
        </label>
        <label class="mfield">
          <span>替代写法</span>
          <input id="mLexHint" value="${cur.hint || ""}" />
        </label>
      `;
      modalFoot.innerHTML = `
        ${idx >= 0 ? `<button type="button" class="btn sm ghost danger" id="mDelBtn">删除</button><span class="spacer"></span>` : ""}
        <button type="button" class="btn sm ghost" id="mCancelBtn">取消</button>
        <button type="button" class="btn sm primary" id="mSaveBtn">保存</button>
      `;
      modalFoot.querySelector("#mCancelBtn").onclick = () => modal.close();
      modalFoot.querySelector("#mDelBtn")?.addEventListener("click", () => {
        p.lexicon.splice(idx, 1);
        modal.close();
        renderList();
        renderDetail();
      });
      modalFoot.querySelector("#mSaveBtn").onclick = () => {
        const pattern = modalBody.querySelector("#mLexPat").value.trim();
        const hint = modalBody.querySelector("#mLexHint").value.trim();
        if (!pattern) return;
        const item = hint ? { pattern, hint } : { pattern };
        if (idx >= 0) p.lexicon[idx] = item;
        else p.lexicon.push(item);
        modal.close();
        renderList();
        renderDetail();
      };
      modal.showModal();
    }

    function openTheaterModal(idx, isPlayerLayer) {
      const list = isPlayerLayer ? playerState.theaters : currentPack().theaters;
      const cur = idx >= 0
        ? { ...list[idx] }
        : { id: `th-${Date.now()}`, label: "", on: false, text: "" };
      modalTitle.textContent = idx >= 0 ? "编辑小剧场" : "添加小剧场";
      modalBody.innerHTML = `
        <label class="mfield">
          <span>名称</span>
          <input id="mThLabel" value="${cur.label}" />
        </label>
        ${!isPlayerLayer ? `
          <div class="mfield">
            <span>触发</span>
            <div class="at-toggle">
              <button type="button" id="mThDemand" aria-pressed="${!cur.on ? "true" : "false"}">按需索取</button>
              <button type="button" id="mThAuto" aria-pressed="${cur.on ? "true" : "false"}">每轮常开</button>
            </div>
          </div>
        ` : ""}
        <label class="mfield">
          <span>提示词</span>
          <textarea id="mThText" rows="7">${cur.text}</textarea>
        </label>
      `;
      modalFoot.innerHTML = `
        ${idx >= 0 ? `<button type="button" class="btn sm ghost danger" id="mDelBtn">删除</button><span class="spacer"></span>` : ""}
        <button type="button" class="btn sm ghost" id="mCancelBtn">取消</button>
        <button type="button" class="btn sm primary" id="mSaveBtn">保存</button>
      `;
      let on = !!cur.on;
      const btnDemand = modalBody.querySelector("#mThDemand");
      const btnAuto = modalBody.querySelector("#mThAuto");
      if (btnDemand && btnAuto) {
        btnDemand.onclick = () => {
          on = false;
          btnDemand.setAttribute("aria-pressed", "true");
          btnAuto.setAttribute("aria-pressed", "false");
        };
        btnAuto.onclick = () => {
          on = true;
          btnAuto.setAttribute("aria-pressed", "true");
          btnDemand.setAttribute("aria-pressed", "false");
        };
      }
      modalFoot.querySelector("#mCancelBtn").onclick = () => modal.close();
      modalFoot.querySelector("#mDelBtn")?.addEventListener("click", () => {
        list.splice(idx, 1);
        modal.close();
        renderList();
        renderDetail();
        renderWriting();
      });
      modalFoot.querySelector("#mSaveBtn").onclick = () => {
        const label = modalBody.querySelector("#mThLabel").value.trim();
        const text = modalBody.querySelector("#mThText").value.trim();
        if (!label || !text) return;
        const id = label === "人物心声" ? "inner" : cur.id;
        const item = { id, label, on, text };
        if (idx >= 0) list[idx] = item;
        else list.push(item);
        modal.close();
        renderList();
        renderDetail();
        renderWriting();
      };
      modal.showModal();
    }

    function openWritingTheaterModal(id, resolvedList) {
      const cur = resolvedList.find((t) => t.id === id);
      if (!cur) return;
      const ownIdx = playerState.theaters.findIndex((t) => t.id === id);
      modalTitle.textContent = "编辑小剧场";
      modalBody.innerHTML = `
        <label class="mfield">
          <span>名称</span>
          <input id="mThLabel" value="${cur.label}" />
        </label>
        <label class="mfield">
          <span>提示词</span>
          <textarea id="mThText" rows="7">${cur.text}</textarea>
        </label>
      `;
      modalFoot.innerHTML = `
        ${ownIdx >= 0 && id !== "inner" ? `<button type="button" class="btn sm ghost danger" id="mDelBtn">删除</button><span class="spacer"></span>` : ""}
        <button type="button" class="btn sm ghost" id="mCancelBtn">取消</button>
        <button type="button" class="btn sm primary" id="mSaveBtn">保存</button>
      `;
      modalFoot.querySelector("#mCancelBtn").onclick = () => modal.close();
      modalFoot.querySelector("#mDelBtn")?.addEventListener("click", () => {
        playerState.theaters.splice(ownIdx, 1);
        modal.close();
        renderWriting();
      });
      modalFoot.querySelector("#mSaveBtn").onclick = () => {
        const label = modalBody.querySelector("#mThLabel").value.trim();
        const text = modalBody.querySelector("#mThText").value.trim();
        if (!label || !text) return;
        const item = { id, label, text };
        if (ownIdx >= 0) playerState.theaters[ownIdx] = { ...playerState.theaters[ownIdx], ...item };
        else playerState.theaters.push(item);
        modal.close();
        renderWriting();
      };
      modal.showModal();
    }

    function openSnipModal(idx) {
      const p = currentPack();
      const cur = idx >= 0 ? { ...p.snippets[idx] } : { name: "", text: "", hint: "", note: true };
      modalTitle.textContent = idx >= 0 ? "编辑片段" : "新片段";
      modalBody.innerHTML = `
        <label class="mfield">
          <span>名称</span>
          <input id="mSnipName" value="${cur.name}" />
        </label>
        <div class="mfield">
          <span>发给谁</span>
          <div class="at-toggle">
            <button type="button" id="mChStory" aria-pressed="${!cur.note ? "true" : "false"}">故事里</button>
            <button type="button" id="mChNote" aria-pressed="${cur.note ? "true" : "false"}">给叙事者</button>
          </div>
        </div>
        <label class="mfield">
          <span>插入内容</span>
          <textarea id="mSnipText" rows="3">${cur.text}</textarea>
        </label>
      `;
      modalFoot.innerHTML = `
        ${idx >= 0 ? `<button type="button" class="btn sm ghost danger" id="mDelBtn">删除</button><span class="spacer"></span>` : ""}
        <button type="button" class="btn sm ghost" id="mCancelBtn">取消</button>
        <button type="button" class="btn sm primary" id="mSaveBtn">保存</button>
      `;
      let note = !!cur.note;
      modalBody.querySelector("#mChStory").onclick = () => {
        note = false;
        modalBody.querySelector("#mChStory").setAttribute("aria-pressed", "true");
        modalBody.querySelector("#mChNote").setAttribute("aria-pressed", "false");
      };
      modalBody.querySelector("#mChNote").onclick = () => {
        note = true;
        modalBody.querySelector("#mChNote").setAttribute("aria-pressed", "true");
        modalBody.querySelector("#mChStory").setAttribute("aria-pressed", "false");
      };
      modalFoot.querySelector("#mCancelBtn").onclick = () => modal.close();
      modalFoot.querySelector("#mDelBtn")?.addEventListener("click", () => {
        p.snippets.splice(idx, 1);
        modal.close();
        renderList();
        renderDetail();
      });
      modalFoot.querySelector("#mSaveBtn").onclick = () => {
        const name = modalBody.querySelector("#mSnipName").value.trim();
        const text = modalBody.querySelector("#mSnipText").value.trim();
        if (!name || !text) return;
        const item = { name, text, note };
        if (idx >= 0) p.snippets[idx] = item;
        else p.snippets.push(item);
        modal.close();
        renderList();
        renderDetail();
      };
      modal.showModal();
    }

    // New Pack button
    document.getElementById("newPackBtn").addEventListener("click", () => {
      const id = `pack-${Date.now()}`;
      packs.unshift({
        id,
        name: "新写作包",
        fragments: [],
        entries: [],
        lexicon: [],
        theaters: [],
        snippets: [],
        names: {}
      });
      selectedId = id;
      drawerKind = null;
      document.getElementById("settingsView").dataset.pane = "detail";
      renderList();
      renderDetail();
    });

    // Demo Switcher Controls
    const appWrap = document.getElementById("appWrap");
    const modeSettingsBtn = document.getElementById("modeSettingsBtn");
    const modeWritingBtn = document.getElementById("modeWritingBtn");
    const vpDesktopBtn = document.getElementById("vpDesktopBtn");
    const vpMobileBtn = document.getElementById("vpMobileBtn");
    const themeBtn = document.getElementById("themeBtn");

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById("settingsView").style.display = mode === "settings" ? "" : "none";
      document.getElementById("writingView").style.display = mode === "writing" ? "" : "none";
      modeSettingsBtn.setAttribute("aria-pressed", mode === "settings" ? "true" : "false");
      modeWritingBtn.setAttribute("aria-pressed", mode === "writing" ? "true" : "false");
      if (mode === "writing") renderWriting();
      else {
        renderList();
        renderDetail();
      }
    }

    modeSettingsBtn.addEventListener("click", () => setViewMode("settings"));
    modeWritingBtn.addEventListener("click", () => setViewMode("writing"));

    vpDesktopBtn.addEventListener("click", () => {
      appWrap.dataset.vp = "desktop";
      vpDesktopBtn.setAttribute("aria-pressed", "true");
      vpMobileBtn.setAttribute("aria-pressed", "false");
    });
    vpMobileBtn.addEventListener("click", () => {
      appWrap.dataset.vp = "mobile";
      vpMobileBtn.setAttribute("aria-pressed", "true");
      vpDesktopBtn.setAttribute("aria-pressed", "false");
    });
    themeBtn.addEventListener("click", () => {
      const html = document.documentElement;
      const dark = html.dataset.theme !== "dark";
      html.dataset.theme = dark ? "dark" : "light";
      themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
    });

    renderList();
    renderDetail();
  </script>
</body>
</html>
