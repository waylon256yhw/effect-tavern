              class="switch"
              role="switch"
              aria-checked="${p.enabled}"
              aria-label="启用服务商"
              onclick="toggleProviderEnabled('${p.id}')"
            >
              <span class="thumb"></span>
            </button>
          </header>

          <div class="detail-scroll wscroll">
            <!-- API Key -->
            <div class="section-block">
              <div class="section-title">
                <h3>API 密钥</h3>
                <div class="right">
                  ${p.testStatus ? `<span class="tag mono ${p.testStatus.ok ? "ok" : "bad"}">${p.testStatus.text}</span>` : ""}
                </div>
              </div>
              <div style="display:flex;gap:var(--space-2)">
                <div class="input-box" style="flex:1">
                  <input
                    type="${state.showSecret ? "text" : "password"}"
                    class="mono"
                    value="${escapeHtml(p.key)}"
                    placeholder="输入或从密钥库选择"
                    oninput="updateProviderKey('${p.id}', this.value)"
                  />
                  <button type="button" class="icon-btn sm" aria-label="显隐密钥" onclick="state.showSecret = !state.showSecret; render()">
                    ${ICONS.eye}
                  </button>
                </div>
                <details style="position:relative">
                  <summary class="icon-btn" aria-label="密钥库" style="list-style:none;box-shadow:inset 0 0 0 var(--hairline) var(--line-strong);background:var(--surface-2)">
                    ${ICONS.key}
                  </summary>
                  <div style="position:absolute;right:0;top:calc(100% + 6px);width:19rem;padding:var(--space-3);border-radius:var(--radius-card);background:var(--surface-3);box-shadow:var(--shadow-pop);z-index:30;display:flex;flex-direction:column;gap:var(--space-2)">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-1)">
                      <span style="font-size:var(--text-footnote);font-weight:600">密钥库</span>
                      <button type="button" class="btn sm" onclick="saveCurrentKeyToVault('${p.id}')">存入当前密钥</button>
                    </div>
                    <div style="display:flex;flex-direction:column;gap:4px">
                      ${state.vaultKeys.map((vk) => `
                        <div style="display:flex;align-items:center;gap:var(--space-2);padding:6px 8px;border-radius:var(--radius);background:${p.key === vk.value ? "var(--fill)" : "transparent"}">
                          <button type="button" style="flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left" onclick="pickVaultKey('${p.id}', '${vk.id}')">
                            <span style="font-size:var(--text-footnote);font-weight:500">${escapeHtml(vk.name)}</span>
                            <span class="mono" style="font-size:var(--text-caption);color:var(--ink-3)">${escapeHtml(vk.hint)}</span>
                          </button>
                          <button type="button" class="icon-btn sm" aria-label="删除密钥" onclick="deleteVaultKey('${vk.id}')">
                            ${ICONS.trash}
                          </button>
                        </div>
                      `).join("")}
                    </div>
                  </div>
                </details>
                <button type="button" class="btn" onclick="runConnectivityTest('${p.id}')">检测</button>
              </div>
            </div>

            <!-- API Endpoint (Minimal outer row; multi-endpoint & live URL preview inside slide-over card) -->
            <div class="section-block">
              <div class="section-title">
                <h3>API 地址</h3>
                <button type="button" class="link-btn" onclick="openEndpointDrawer()">添加端点</button>
                <div class="right">
                  <span class="tag">${FORMAT_LABELS[defFmt]} · 默认${activeEpCount > 1 ? ` (+${activeEpCount - 1})` : ""}</span>
                </div>
              </div>
              <div style="display:flex;gap:var(--space-2)">
                <div class="input-box" style="flex:1">
                  <input
                    type="url"
                    class="mono"
                    value="${escapeHtml(defEp.url)}"
                    placeholder="https://api.example.com"
                    oninput="updateDefaultEndpointUrl('${p.id}', this.value)"
                  />
                </div>
                <button
                  type="button"
                  class="icon-btn"
                  aria-label="请求配置"
                  style="box-shadow:inset 0 0 0 var(--hairline) var(--line-strong);background:var(--surface-2)"
                  onclick="openEndpointDrawer()"
                >
                  ${ICONS.gear}
                </button>
              </div>
            </div>

            <!-- Models Section (Expandable icon-to-input inline search, zero vertical layout shift) -->
            <div class="section-block">
              <div class="section-title">
                <h3>模型</h3>
                <button type="button" class="icon-btn sm" aria-label="展开或折叠分组" onclick="toggleAllModelGroups()">
                  ${ICONS.collapseAll}
                </button>
                <div
                  class="inline-search"
                  id="inlineModelSearchWrap"
                  data-open="${Boolean(state.showModelSearch || state.modelInlineSearch)}"
                  onclick="expandInlineModelSearch()"
                >
                  ${ICONS.search}
                  <input
                    type="search"
                    id="inlineModelSearchInput"
                    placeholder="搜索模型..."
                    value="${escapeHtml(state.modelInlineSearch)}"
                    oninput="onInlineModelSearch(this.value)"
                    onblur="collapseInlineModelSearchIfEmpty()"
                    onkeydown="if (event.key === 'Escape') closeInlineModelSearch(event)"
                  />
                </div>
                <div class="right">
                  <div class="btn-join">
                    <button type="button" class="btn sm" onclick="openSyncDrawer()">
                      ${ICONS.sync} <span>同步模型</span>
                    </button>
                    <button type="button" class="btn sm" aria-label="手动添加模型" onclick="openAddModelModal()">
                      ${ICONS.plus}
                    </button>
                  </div>
                </div>
              </div>

              <div class="model-groups" id="modelGroupsContainer">
                ${buildModelGroupsHtml(p)}
              </div>
            </div>
          </div>

          <!-- Slide-Over Floating Card (Shared by "请求配置" & "同步模型") -->
          <div class="drawer-backdrop" data-open="${drawerOpen}" onclick="closeSideDrawer()"></div>
          <aside class="side-drawer" data-open="${drawerOpen}" aria-label="${state.drawerMode === "endpoint" ? "请求配置" : "同步模型"}">
            ${state.drawerMode === "endpoint" ? renderEndpointDrawerContent(p) : state.drawerMode === "sync" ? renderSyncDrawerContent(p) : ""}
          </aside>
        </section>
      `;
    }

    function renderEndpointDrawerContent(p) {
      const sampleModel = p.models[0]?.id || "{model}";
      const orderedFormats = ["openai-compatible", "anthropic", "gemini"];

      return `
        <div class="drawer-head">
          <h3>请求配置</h3>
          <span class="spacer"></span>
          <button type="button" class="icon-btn sm" aria-label="关闭" onclick="closeSideDrawer()">
            ${ICONS.close}
          </button>
        </div>

        <div class="drawer-body wscroll" style="padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)">
          ${orderedFormats.map((fmt) => {
            const ep = p.endpoints[fmt] || { url: "", exactPrefix: false };
            const isDefault = p.defaultFormat === fmt;
            const hasUrl = Boolean(ep.url && ep.url.trim());
            const preview = resolveEndpointPreview(fmt, ep.url, ep.exactPrefix, sampleModel);
            const showPreview = hasUrl || isDefault;
            return `
              <div class="form-field">
                <label>
                  <span style="display:inline-flex;align-items:center;gap:var(--space-2)">
                    <strong style="font-weight:600;color:var(--ink)">${FORMAT_LABELS[fmt]}</strong>
                    ${isDefault
                      ? `<span class="tag ok">默认</span>`
                      : `<button type="button" class="btn xs" onclick="setProviderDefaultFormat('${p.id}', '${fmt}')">设为默认</button>`
                    }
                  </span>
                  <span style="display:inline-flex;align-items:center;gap:6px;font-size:var(--text-caption);color:var(--ink-3)">
                    <span>精确前缀</span>
                    <button
                      type="button"
                      class="switch"
                      role="switch"
                      aria-checked="${Boolean(ep.exactPrefix)}"
                      style="transform:scale(0.84);transform-origin:right center"
                      onclick="toggleEndpointExactPrefix('${p.id}', '${fmt}')"
                    >
                      <span class="thumb"></span>
                    </button>
                  </span>
                </label>
                <div class="input-box">
                  <input
                    type="url"
                    class="mono"
                    value="${escapeHtml(ep.url)}"
                    placeholder="Base URL: https://example.com"
                    oninput="updateEndpointUrl('${p.id}', '${fmt}', this.value)"
                  />
                </div>
                <div
                  class="resolved-url ${preview.ok ? "" : "err"}"
                  id="epPreview-${fmt}"
                  style="${showPreview ? "" : "display:none"}"
                >
                  ${escapeHtml(preview.ok ? preview.target : preview.text)}
                </div>
              </div>
            `;
          }).join("")}

          <div style="border-top:var(--hairline) solid var(--line);padding-top:var(--space-3);display:flex;flex-direction:column;gap:var(--space-3)">
            <div class="token-grid">
              <div class="form-field">
                <label>认证方式</label>
                ${renderSelect({
                  size: "sm",
                  value: p.authType,
                  options: [
                    { value: "api_key", label: "API Key Header" },
                    { value: "auth_token", label: "Bearer Token" },
                  ],
                  onSelect: (v) => `setProviderAuthType('${p.id}', '${v}')`,
                })}
              </div>
              <div class="form-field">
                <label>缓存有效期</label>
                ${renderSelect({
                  size: "sm",
                  value: p.cacheTtl,
                  options: [
                    { value: "5m", label: "5 分钟" },
                    { value: "1h", label: "1 小时" },
                  ],
                  onSelect: (v) => `setProviderTtl('${p.id}', '${v}')`,
                })}
              </div>
            </div>

            <div class="form-field">
              <label>网络代理</label>
              ${renderSelect({
                size: "sm",
                value: p.proxyMode,
                options: [
                  { value: "env", label: "跟随系统环境" },
                  { value: "direct", label: "强制直连" },
                  { value: "custom", label: "自定义代理地址" },
                ],
                onSelect: (v) => `setProviderProxy('${p.id}', '${v}')`,
              })}
            </div>

            <div class="form-field">
              <label>
                <span>自定义请求头</span>
                <span class="tag mono">{}</span>
              </label>
              ${(p.headers || []).map((h, idx) => `
                <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:var(--space-2);align-items:center">
                  <div class="input-box" style="height:32px">
                    <input type="text" class="mono" placeholder="Header" value="${escapeHtml(h.key)}" oninput="updateCustomHeader('${p.id}', ${idx}, 'key', this.value)" />
                  </div>
                  <div class="input-box" style="height:32px">
                    <input type="text" class="mono" placeholder="Value" value="${escapeHtml(h.value)}" oninput="updateCustomHeader('${p.id}', ${idx}, 'value', this.value)" />
                  </div>
                  <button type="button" class="icon-btn sm" onclick="removeCustomHeader('${p.id}', ${idx})">${ICONS.close}</button>
                </div>
              `).join("")}
              <button type="button" class="dashed-btn" onclick="addCustomHeader('${p.id}')">
                ${ICONS.plus} <span>添加请求头</span>
              </button>
            </div>
          </div>
        </div>

        <div style="padding:var(--space-3) var(--space-4);border-top:var(--hairline) solid var(--line);display:flex;justify-content:flex-end;gap:var(--space-2)">
          <button type="button" class="btn" onclick="closeSideDrawer()">取消</button>
          <button type="button" class="btn primary" onclick="closeSideDrawer()">保存</button>
        </div>
      `;
    }

    function renderSyncDrawerContent(p) {
      const q = state.drawerSearch.toLowerCase();
      const catalog = p.remoteCatalog.filter((item) => item.id.toLowerCase().includes(q));
      const groups = {};
      for (const item of catalog) {
        (groups[item.group] = groups[item.group] || []).push(item);
      }

      return `
        <div class="drawer-head">
          <h3>${escapeHtml(p.name)} 模型</h3>
          <span class="tag mono">${p.remoteCatalog.length}</span>
          <span class="spacer"></span>
          <button type="button" class="btn sm ghost" onclick="addAllRemoteModels('${p.id}')">
            ${ICONS.plus} <span>添加全部</span>
          </button>
          <button type="button" class="icon-btn sm" onclick="closeSideDrawer()">
            ${ICONS.close}
          </button>
        </div>
        <div class="drawer-search">
          <div class="input-box" style="height:36px">
            ${ICONS.search}
            <input
              type="search"
              placeholder="搜索模型..."
              value="${escapeHtml(state.drawerSearch)}"
              oninput="state.drawerSearch = this.value; render()"
            />
          </div>
        </div>
        <div class="drawer-body wscroll">
          ${Object.entries(groups).map(([gName, items]) => `
            <details class="m-group" open>
              <summary>
                ${ICONS.chevRight}
                <span>${escapeHtml(gName)}</span>
                <span class="tag mono">${items.length}</span>
              </summary>
              <div class="m-rows">
                ${items.map((item) => {
                  const added = p.models.some((m) => m.id === item.id);
                  return `
                    <div class="m-row ${added ? "added" : ""}">
                      <span class="avatar" style="width:22px;height:22px;font-size:10px;background:${p.color}">
                        ${escapeHtml(gName.slice(0, 1).toUpperCase())}
                      </span>
                      <span class="m-name">${escapeHtml(item.id)}</span>
                      <div class="m-acts" style="margin-left:auto">
                        <button
                          type="button"
                          class="icon-btn sm"
                          onclick="toggleCatalogModel('${p.id}', '${escapeHtml(item.id)}', '${escapeHtml(item.group)}')"
                        >
                          ${added ? ICONS.minus : ICONS.plus}
                        </button>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </details>
          `).join("")}
        </div>
      `;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       5. TAB 2: 默认模型 (Single Wide Detail Card on Right)
       ═══════════════════════════════════════════════════════════════════════════ */
    function renderRoutingCard() {
      const pairs = state.providers
        .filter((p) => p.enabled)
        .flatMap((p) =>
          p.models.map((m) => ({
            key: `${p.id}::${m.id}`,
            label: `${p.name} · ${m.id}`,
          }))
        );

      const STAGES = [
        { id: "narrate", title: "正文叙事" },
        { id: "record", title: "状态与记录结算" },
        { id: "decide", title: "行动判定" },
        { id: "direct", title: "导演规划" },
        { id: "lookup", title: "设定检出" },
        { id: "check", title: "护栏检查" },
        { id: "polish", title: "文风润色" },
      ];

      return `
        <section class="detail-card">
          <header class="detail-header">
            <h2>默认模型</h2>
          </header>
          <div class="detail-scroll wscroll">
            <div class="setting-card hero">
              <div>
                <h3 style="font-size:var(--text-heading);font-weight:650">主默认模型</h3>
              </div>
              <div style="min-width:20rem">
                ${renderSelect({
                  value: state.routing.defaultModel,
                  options: pairs.map((pair) => ({ value: pair.key, label: pair.label })),
                  onSelect: (v) => `state.routing.defaultModel = '${escapeHtml(v)}'`,
                })}
              </div>
            </div>

            <div class="section-block">
              <div class="section-title">
                <h3>按阶段指定模型</h3>
                <div class="right">
                  <button
                    type="button"
                    class="switch"
                    role="switch"
                    aria-checked="${state.routing.customStageRouting}"
                    onclick="state.routing.customStageRouting = !state.routing.customStageRouting; render()"
                  >
                    <span class="thumb"></span>
                  </button>
                </div>
              </div>

              ${state.routing.customStageRouting ? `
                <div class="cards-grid">
                  ${STAGES.map((st) => {
                    const cur = state.routing.stages[st.id] || "default";
                    return `
                      <div class="setting-card">
                        <div style="display:flex;align-items:center;justify-content:space-between">
                          <span style="font-weight:600">${st.title}</span>
                          <span class="tag mono">${st.id}</span>
                        </div>
                        ${renderSelect({
                          value: cur,
                          options: [
                            { value: "default", label: "跟随主默认模型" },
                            ...pairs.map((pair) => ({ value: pair.key, label: pair.label })),
                          ],
                          onSelect: (v) => `state.routing.stages['${st.id}'] = '${escapeHtml(v)}'`,
                        })}
                      </div>
                    `;
                  }).join("")}
                </div>
              ` : ""}
            </div>
          </div>
        </section>
      `;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       6. TAB 3: 提示词模板 (Card 2: List + Card 3: Detail)
       ═══════════════════════════════════════════════════════════════════════════ */
    function renderTemplatesCards() {
      const t = state.templates.find((x) => x.id === state.selectedTemplateId) || state.templates[0];

      return `
        <aside class="master-card">
          <div class="master-list wscroll" style="padding-top:var(--space-4)">
            ${state.templates.map((item) => `
              <button
                type="button"
                class="p-row"
                aria-selected="${item.id === t.id}"
                onclick="state.selectedTemplateId = '${item.id}'; state.mobilePane = 'detail'; render()"
              >
                <span class="p-name">${escapeHtml(item.name)}</span>
                <span class="tag mono">${item.narrateHead.length + item.narrateTail.length}</span>
              </button>
            `).join("")}
          </div>
          <div class="master-foot">
            <button type="button" class="btn" onclick="createNewTemplate()">
              ${ICONS.plus} <span>新建模板</span>
            </button>
          </div>
        </aside>

        <section class="detail-card">
          <header class="detail-header">
            <button type="button" class="icon-btn sm mobile-back-btn" onclick="setMobilePane('list')">
              ${ICONS.back}
            </button>
            <div class="input-box" style="height:34px;max-width:18rem">
              <input
                type="text"
                value="${escapeHtml(t.name)}"
                oninput="updateTemplateName('${t.id}', this.value)"
              />
            </div>
            <span class="spacer"></span>
            ${state.templates.length > 1 ? `
              <button type="button" class="icon-btn sm" onclick="deleteTemplate('${t.id}')">
                ${ICONS.trash}
              </button>
            ` : ""}
          </header>

          <div class="detail-scroll wscroll">
            ${renderTemplateSlot(t, "narrateHead", "前置引导消息 (Head)", t.narrateHead)}
            ${renderTemplateSlot(t, "narrateTail", "尾部续写预填 (Tail)", t.narrateTail)}
            ${renderTemplateSlot(t, "reviewHead", "审阅阶段引导 (Review)", t.reviewHead)}
          </div>
        </section>
      `;
    }

    function renderTemplateSlot(t, slotKey, label, list) {
      return `
        <div class="section-block">
          <div class="section-title">
            <h3>${label}</h3>
            <div class="right">
              <button type="button" class="btn sm" onclick="addTemplateMessage('${t.id}', '${slotKey}')">
                ${ICONS.plus} <span>添加消息</span>
              </button>
            </div>
          </div>
          ${list.length === 0 ? `
            <div class="setting-card" style="padding:var(--space-3) var(--space-4);color:var(--ink-3);font-size:var(--text-footnote)">
              未配置消息
            </div>
          ` : `
            <div style="display:flex;flex-direction:column;gap:var(--space-2)">
              ${list.map((msg, idx) => `
                <div class="msg-card">
                  ${renderSelect({
                    size: "sm",
                    value: msg.role,
                    options: [
                      { value: "system", label: "System" },
                      { value: "user", label: "User" },
                      { value: "assistant", label: "Assistant" },
                    ],
                    onSelect: (v) => `updateTemplateMsgRole('${t.id}', '${slotKey}', ${idx}, '${v}')`,
                  })}
                  <textarea rows="2" placeholder="输入消息内容..." oninput="updateTemplateMsgText('${t.id}', '${slotKey}', ${idx}, this.value)">${escapeHtml(msg.text)}</textarea>
                  <button type="button" class="icon-btn sm" onclick="removeTemplateMsg('${t.id}', '${slotKey}', ${idx})">
                    ${ICONS.close}
                  </button>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       7. TAB 4: 玩家人设 (Card 2: List + Card 3: Detail)
       ═══════════════════════════════════════════════════════════════════════════ */
    function renderPersonasCards() {
      const per = state.personas.find((x) => x.id === state.selectedPersonaId) || state.personas[0];

      return `
        <aside class="master-card">
          <div class="master-list wscroll" style="padding-top:var(--space-4)">
            ${state.personas.map((item) => `
              <button
                type="button"
                class="p-row"
                aria-selected="${item.id === per.id}"
                onclick="state.selectedPersonaId = '${item.id}'; state.mobilePane = 'detail'; render()"
              >
                <span class="avatar" style="background:${item.color}">${escapeHtml(item.name.slice(0, 1))}</span>
                <span class="p-name">${escapeHtml(item.name)}</span>
                ${item.cards.length ? `<span class="tag">${item.cards[0]}</span>` : ""}
              </button>
            `).join("")}
          </div>
          <div class="master-foot">
            <button type="button" class="btn" onclick="createNewPersona()">
              ${ICONS.plus} <span>新建人设</span>
            </button>
          </div>
        </aside>

        <section class="detail-card">
          <header class="detail-header">
            <button type="button" class="icon-btn sm mobile-back-btn" onclick="setMobilePane('list')">
              ${ICONS.back}
            </button>
            <div class="input-box" style="height:34px;max-width:16rem">
              <input
                type="text"
                value="${escapeHtml(per.name)}"
                oninput="perNameChange('${per.id}', this.value)"
              />
            </div>
            <div style="display:flex;gap:6px">
              ${per.cards.map((c) => `<span class="tag">${escapeHtml(c)}</span>`).join("")}
            </div>
            <span class="spacer"></span>
            ${state.personas.length > 1 ? `
              <button type="button" class="icon-btn sm" onclick="deletePersona('${per.id}')">
                ${ICONS.trash}
              </button>
            ` : ""}
          </header>

          <div class="detail-scroll wscroll">
            <div class="section-block" style="flex:1">
              <div class="section-title">
                <h3>人设描述</h3>
                <div class="right">
                  <span class="tag mono">${per.text.length} 字</span>
                </div>
              </div>
              <textarea
                style="width:100%;min-height:16rem;padding:var(--space-4);border-radius:var(--radius-card);background:var(--surface-2);box-shadow:inset 0 0 0 var(--hairline) var(--line);line-height:1.75;resize:vertical;outline:none"
                placeholder="描述玩家角色的外貌、身份与性格特征..."
                oninput="updatePersonaText('${per.id}', this.value)"
              >${escapeHtml(per.text)}</textarea>
            </div>
          </div>
        </section>
      `;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       8. MAIN RENDER & INTERACTIONS
       ═══════════════════════════════════════════════════════════════════════════ */
    function render() {
      const canvas = document.getElementById("canvasRoot");
      canvas.setAttribute("data-columns", state.section === "routing" ? "two" : "three");
      canvas.setAttribute("data-pane", state.section === "routing" ? "detail" : state.mobilePane);

      canvas.innerHTML = `
        <!-- Card 1: Left Navigation Card -->
        <nav class="nav-card" aria-label="设置导航">
          <div class="nav-head">
            <h1>设置</h1>
          </div>
          <div class="nav-list">
            <button type="button" class="nav-item" aria-current="${state.section === "providers" ? "page" : "false"}" onclick="switchSection('providers')">
              ${ICONS.plugs} <span>模型服务</span>
            </button>
            <button type="button" class="nav-item" aria-current="${state.section === "routing" ? "page" : "false"}" onclick="switchSection('routing')">
              ${ICONS.sliders} <span>默认模型</span>
            </button>
            <button type="button" class="nav-item" aria-current="${state.section === "templates" ? "page" : "false"}" onclick="switchSection('templates')">
              ${ICONS.template} <span>提示词模板</span>
            </button>
            <button type="button" class="nav-item" aria-current="${state.section === "personas" ? "page" : "false"}" onclick="switchSection('personas')">
              ${ICONS.user} <span>玩家人设</span>
            </button>
          </div>
        </nav>

        <!-- Mobile Top Bar (Safe-area inset + Icon-only Switcher) -->
        <header class="mobile-bar">
          <div class="mobile-bar-row">
            <span class="mobile-bar-title">${SECTION_TITLES[state.section]}</span>
            <div class="mobile-icon-tabs" role="tablist" aria-label="设置分类">
              <button type="button" role="tab" aria-label="模型服务" aria-selected="${state.section === "providers"}" onclick="switchSection('providers')">
                ${ICONS.plugs}
              </button>
              <button type="button" role="tab" aria-label="默认模型" aria-selected="${state.section === "routing"}" onclick="switchSection('routing')">
                ${ICONS.sliders}
              </button>
              <button type="button" role="tab" aria-label="提示词模板" aria-selected="${state.section === "templates"}" onclick="switchSection('templates')">
                ${ICONS.template}
              </button>
              <button type="button" role="tab" aria-label="玩家人设" aria-selected="${state.section === "personas"}" onclick="switchSection('personas')">
                ${ICONS.user}
              </button>
            </div>
          </div>
        </header>

        ${state.section === "providers" ? renderProvidersCards() : ""}
        ${state.section === "routing" ? renderRoutingCard() : ""}
        ${state.section === "templates" ? renderTemplatesCards() : ""}
        ${state.section === "personas" ? renderPersonasCards() : ""}
      `;
    }

    function switchSection(s) {
      state.section = s;
      state.mobilePane = "list";
      state.drawerMode = null;
      render();
    }
    function setMobilePane(p) {
      state.mobilePane = p;
      render();
    }
    function selectProvider(id) {
      state.selectedProviderId = id;
      state.mobilePane = "detail";
      state.drawerMode = null;
      render();
    }
    function toggleProviderEnabled(id) {
      const p = state.providers.find((x) => x.id === id);
      if (p) p.enabled = !p.enabled;
      render();
    }
    function updateProviderName(id, val) {
      const p = state.providers.find((x) => x.id === id);
      if (p && val.trim()) p.name = val.trim();
    }
    function setProviderDefaultFormat(id, fmt) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      p.defaultFormat = fmt;
      render();
    }
    function updateProviderKey(id, val) {
      const p = state.providers.find((x) => x.id === id);
      if (p) p.key = val;
    }
    function pickVaultKey(providerId, vaultKeyId) {
      const p = state.providers.find((x) => x.id === providerId);
      const vk = state.vaultKeys.find((x) => x.id === vaultKeyId);
      if (p && vk) {
        p.key = vk.value;
        p.authType = vk.type;
        render();
      }
    }
    function saveCurrentKeyToVault(providerId) {
      const p = state.providers.find((x) => x.id === providerId);
      if (!p || !p.key.trim()) return;
      const raw = p.key.trim();
      if (state.vaultKeys.some((x) => x.value === raw)) return;
      const prefix = raw.slice(0, 6);
      const suffix = raw.slice(-4);
      state.vaultKeys.push({
        id: "vk-" + Date.now().toString(36),
        name: `${p.name} 密钥`,
        type: p.authType || "api_key",
        value: raw,
        hint: `${prefix}****${suffix}`,
      });
      render();
    }
    function deleteVaultKey(vaultKeyId) {
      state.vaultKeys = state.vaultKeys.filter((x) => x.id !== vaultKeyId);
      render();
    }
    function updateDefaultEndpointUrl(id, val) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      const fmt = p.defaultFormat || "openai-compatible";
      p.endpoints[fmt] = p.endpoints[fmt] || { url: "", exactPrefix: false };
      p.endpoints[fmt].url = val;
    }
    function updateEndpointUrl(id, fmt, val) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      p.endpoints[fmt] = p.endpoints[fmt] || { url: "", exactPrefix: false };
      p.endpoints[fmt].url = val;
      const el = document.getElementById("epPreview-" + fmt);
      if (!el) return;
      const hasUrl = Boolean(val && val.trim());
      if (!hasUrl && p.defaultFormat !== fmt) {
        el.style.display = "none";
        return;
      }
      el.style.display = "";
      const preview = resolveEndpointPreview(fmt, val, p.endpoints[fmt].exactPrefix, p.models[0]?.id || "{model}");
      el.textContent = preview.ok ? preview.target : preview.text;
      el.className = "resolved-url " + (preview.ok ? "" : "err");
    }
    function toggleEndpointExactPrefix(id, fmt) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      p.endpoints[fmt] = p.endpoints[fmt] || { url: "", exactPrefix: false };
      p.endpoints[fmt].exactPrefix = !p.endpoints[fmt].exactPrefix;
      render();
    }
    function addGeminiEndpoint(id) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      const base = p.endpoints[p.defaultFormat]?.url || "https://generativelanguage.googleapis.com";
      p.endpoints.gemini = { url: base, exactPrefix: false };
      render();
    }
    function addCustomHeader(id) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      p.headers = p.headers || [];
      p.headers.push({ key: "", value: "" });
      render();
    }
    function updateCustomHeader(id, idx, field, val) {
      const p = state.providers.find((x) => x.id === id);
      if (p && p.headers && p.headers[idx]) {
        p.headers[idx][field] = val;
      }
    }
    function removeCustomHeader(id, idx) {
      const p = state.providers.find((x) => x.id === id);
      if (p && p.headers) {
        p.headers.splice(idx, 1);
        render();
      }
    }
    function setProviderAuthType(id, val) {
      const p = state.providers.find((x) => x.id === id);
      if (p) p.authType = val;
    }
    function setProviderTtl(id, val) {
      const p = state.providers.find((x) => x.id === id);
      if (p) p.cacheTtl = val;
    }
    function setProviderProxy(id, val) {
      const p = state.providers.find((x) => x.id === id);
      if (p) p.proxyMode = val;
    }
    function runConnectivityTest(id) {
      const p = state.providers.find((x) => x.id === id);
      if (!p) return;
      const ok = Boolean(p.key && p.key.trim().length > 3);
      p.testStatus = {
        ok,
        text: ok ? `200 · ${Math.floor(160 + Math.random() * 180)}ms` : "401 Unauthorized"
      };
      render();
    }
    function deleteProvider(id) {
      if (state.providers.length <= 1) return;
      state.providers = state.providers.filter((x) => x.id !== id);
      state.selectedProviderId = state.providers[0].id;
      render();
    }
    function removeModelFromProvider(pid, mid) {
      const p = state.providers.find((x) => x.id === pid);
      if (p) p.models = p.models.filter((m) => m.id !== mid);
      render();
    }
    function expandInlineModelSearch() {
      state.showModelSearch = true;
      const wrap = document.getElementById("inlineModelSearchWrap");
      const input = document.getElementById("inlineModelSearchInput");
      if (wrap) wrap.setAttribute("data-open", "true");
      if (input) input.focus();
    }
    function collapseInlineModelSearchIfEmpty() {
      if (state.modelInlineSearch && state.modelInlineSearch.trim()) return;
      state.showModelSearch = false;
      const wrap = document.getElementById("inlineModelSearchWrap");
      if (wrap) wrap.setAttribute("data-open", "false");
    }
    function closeInlineModelSearch(e) {
      e.stopPropagation();
      state.modelInlineSearch = "";
      state.showModelSearch = false;
      const wrap = document.getElementById("inlineModelSearchWrap");
      const input = document.getElementById("inlineModelSearchInput");
      if (input) {
        input.value = "";
        input.blur();
      }
      if (wrap) wrap.setAttribute("data-open", "false");
      onInlineModelSearch("");
    }
    function onInlineModelSearch(val) {
      state.modelInlineSearch = val;
      const p = state.providers.find((x) => x.id === state.selectedProviderId) || state.providers[0];
      const container = document.getElementById("modelGroupsContainer");
      if (container && p) {
        container.innerHTML = buildModelGroupsHtml(p);
      }
    }
    function toggleAllModelGroups() {
      state.allGroupsCollapsed = !state.allGroupsCollapsed;
      const p = state.providers.find((x) => x.id === state.selectedProviderId) || state.providers[0];
      const container = document.getElementById("modelGroupsContainer");
      if (container && p) {
        container.innerHTML = buildModelGroupsHtml(p);
      }
    }

    /* Slide-over Side Drawer Handlers ("endpoint" & "sync") */
    function openEndpointDrawer() {
      state.drawerMode = "endpoint";
      render();
    }
    function openSyncDrawer() {
      state.drawerSearch = "";
      state.drawerMode = "sync";
      render();
    }
    function closeSideDrawer() {
      state.drawerMode = null;
      render();
    }
    function toggleCatalogModel(pid, mid, group) {
      const p = state.providers.find((x) => x.id === pid);
      if (!p) return;
      if (p.models.some((m) => m.id === mid)) {
        p.models = p.models.filter((m) => m.id !== mid);
      } else {
        p.models.push({ id: mid, group, templateId: "", effort: "off", maxOutputTokens: 4096, capabilities: {} });
      }
      render();
    }
    function addAllRemoteModels(pid) {
      const p = state.providers.find((x) => x.id === pid);
      if (!p) return;
      for (const item of p.remoteCatalog) {
        if (!p.models.some((m) => m.id === item.id)) {
          p.models.push({ id: item.id, group: item.group, templateId: "", effort: "off", maxOutputTokens: 4096, capabilities: {} });
        }
      }
      render();
    }

    /* Modal 1: Add Custom Provider Onboarding */
    function openAddProviderModal() {
      state.newProvDefaultFormat = "openai-compatible";
      document.getElementById("newProvName").value = "";
      document.getElementById("newProvKey").value = "";
      document.getElementById("newProvUrlOpenai").value = "https://api.openai.com";
      document.getElementById("newProvUrlAnthropic").value = "";
      document.getElementById("newProvUrlGemini").value = "";
      syncNewProvBadges();
      syncNewProvPreview();
      document.getElementById("addProviderModal").showModal();
    }
    function setNewProvDefault(fmt) {
      state.newProvDefaultFormat = fmt;
      syncNewProvBadges();
    }
    function syncNewProvBadges() {
      const def = state.newProvDefaultFormat || "openai-compatible";
      const map = [
        ["openai-compatible", "newProvBadgeOpenai"],
        ["anthropic", "newProvBadgeAnthropic"],
        ["gemini", "newProvBadgeGemini"],
      ];
      for (const [fmt, id] of map) {
        const el = document.getElementById(id);
        if (!el) continue;
        el.innerHTML =
          fmt === def
            ? `<span class="tag ok">默认</span>`
            : `<button type="button" class="btn xs" onclick="setNewProvDefault('${fmt}')">设为默认</button>`;
      }
    }
    function syncNewProvPreview() {
      const pairs = [
        ["openai-compatible", "newProvUrlOpenai", "newProvPreviewOpenai"],
        ["anthropic", "newProvUrlAnthropic", "newProvPreviewAnthropic"],
        ["gemini", "newProvUrlGemini", "newProvPreviewGemini"],
      ];
      for (const [fmt, inputId, previewId] of pairs) {
        const inputEl = document.getElementById(inputId);
        const previewEl = document.getElementById(previewId);
        if (!inputEl || !previewEl) continue;
        const raw = inputEl.value.trim();
        if (!raw) {
          previewEl.style.display = "none";
          previewEl.textContent = "";
        } else {
          previewEl.style.display = "";
          const res = resolveEndpointPreview(fmt, raw, false, "{model}");
          previewEl.textContent = res.ok ? res.target : res.text;
          previewEl.className = "resolved-url " + (res.ok ? "" : "err");
        }
      }
    }
    function submitNewProvider(e) {
      e.preventDefault();
      const name = document.getElementById("newProvName").value.trim();
      const key = document.getElementById("newProvKey").value.trim();
      const urlOpenai = document.getElementById("newProvUrlOpenai").value.trim();
      const urlAnthropic = document.getElementById("newProvUrlAnthropic").value.trim();
      const urlGemini = document.getElementById("newProvUrlGemini").value.trim();

      const defaultFormat = state.newProvDefaultFormat || (
        urlOpenai
          ? "openai-compatible"
          : urlAnthropic
            ? "anthropic"
            : urlGemini
              ? "gemini"
              : "openai-compatible"
      );

      const endpoints = {
        "openai-compatible": { url: urlOpenai, exactPrefix: false },
        anthropic: { url: urlAnthropic, exactPrefix: false },
        gemini: { url: urlGemini, exactPrefix: false },
      };

      const colors = ["#3b82f6", "#ec4899", "#8b5cf6", "#14b8a6"];
      const id = "p-" + Date.now().toString(36);
      state.providers.push({
        id,
        name,
        color: colors[state.providers.length % colors.length],
        enabled: true,
        defaultFormat,
        endpoints,
        headers: [],
        authType: "api_key",
        key,
        cacheTtl: "5m",
        proxyMode: "env",
        proxyUrl: "",
        testStatus: null,
        remoteCatalog: [
          { id: "gpt-4.1", group: "GPT-4.1" },
          { id: "gpt-4.1-mini", group: "GPT-4.1" },
          { id: "claude-sonnet-4-5-20250929", group: "Claude 4.5" }
        ],
        models: [
          { id: "gpt-4.1", group: "GPT-4.1", templateId: "", effort: "off", maxOutputTokens: 8192, capabilities: {} }
        ]
      });
      closeModal("addProviderModal");
      selectProvider(id);
    }

    /* Modal 2: Single Model Settings Modal */
    function openModelSettings(pid, mid) {
      const p = state.providers.find((x) => x.id === pid);
      const m = p?.models.find((x) => x.id === mid);
      if (!p || !m) return;
      state.editingModelId = mid;
      renderModelModalContent(p, m);
      document.getElementById("modelSettingsModal").showModal();
    }

    function renderModelModalContent(p, m) {
      document.getElementById("modelModalTitle").textContent = m.id;
      const effFmt = effectiveFormat(p, m);
      const fmtDef = DEFAULTS[effFmt] || DEFAULTS["openai-compatible"];
      const prefillOn = effectivePrefill(p, m);
      const reasoningBackOn = typeof m.capabilities?.reasoningBack === "boolean" ? m.capabilities.reasoningBack : fmtDef.reasoningBack;
      const structuredMode = m.capabilities?.structured || fmtDef.structured;
      const effortIdx = Math.max(0, EFFORT_STEPS.indexOf(m.effort || "off"));
      const conflict = hasPrefillConflict(p, m);

      document.getElementById("modelModalBody").innerHTML = `
        <div
          id="modelModalConflictBanner"
          style="padding:10px 12px;border-radius:var(--radius);background:var(--warn-soft);color:var(--warn);font-size:var(--text-footnote);${conflict ? "" : "display:none"}"
        >
          所选提示词模板包含 Assistant 尾部预填，请开启下方「允许预填续写」。
        </div>

        <div class="token-grid">
          <div class="form-field">
            <label>提示词模板</label>
            ${renderSelect({
              value: m.templateId || "",
              options: [
                { value: "", label: "无模板" },
                ...state.templates.map((t) => ({ value: t.id, label: t.name })),
              ],
              onSelect: (v) => `setModalTemplate('${p.id}', '${escapeHtml(m.id)}', '${escapeHtml(v)}')`,
            })}
          </div>

          <div class="form-field">
            <label>请求端点协议</label>
            ${renderSelect({
              value: m.format || "",
              options: [
                { value: "", label: `默认 (${FORMAT_LABELS[p.defaultFormat]})` },
                { value: "openai-compatible", label: "OpenAI" },
                { value: "anthropic", label: "Anthropic" },
                { value: "gemini", label: "Gemini" },
              ],
              onSelect: (v) => `setModalModelFormat('${p.id}', '${escapeHtml(m.id)}', '${escapeHtml(v)}')`,
            })}
          </div>
        </div>

        <div class="form-field">
          <label>结构化输出方式</label>
          ${renderSelect({
            value: structuredMode,
            options: [
              { value: "schema", label: "JSON Schema (原生)" },
              { value: "tool", label: "Tool Call (强制工具)" },
              { value: "json", label: "JSON Object (提示词内嵌)" },
            ],
            onSelect: (v) => `setModalCap('${p.id}', '${escapeHtml(m.id)}', 'structured', '${escapeHtml(v)}')`,
          })}
        </div>

        <div class="form-field">
          <label>
            <span>思考强度</span>
            <span class="tag mono" id="effortValBadge">${EFFORT_LABELS[EFFORT_STEPS[effortIdx]]}</span>
          </label>
          <div class="effort-stepper">
            <div class="effort-rail-wrap">
              <div class="effort-rail">
                <div class="effort-rail-fill" id="effortRailFill" style="width:${effortIdx * 25}%"></div>
              </div>
              <div class="effort-stops" id="effortStopsRow">
                ${EFFORT_STEPS.map((st, idx) => `
                  <span class="effort-dot ${idx < effortIdx ? "passed" : ""} ${idx === effortIdx ? "active" : ""}"></span>
                `).join("")}
              </div>
              <input
                type="range"
                id="effortRangeInput"
                class="effort-range-overlay"
                min="0"
                max="4"
                step="1"
                value="${effortIdx}"
                aria-label="思考强度档位"
                oninput="setModalEffortSlider('${p.id}', '${escapeHtml(m.id)}', this.value)"
              />
            </div>
            <div class="effort-ticks" id="effortTicksRow">
              ${EFFORT_STEPS.map((st, idx) => `
                <button
                  type="button"
                  class="effort-tick-btn ${idx === effortIdx ? "active" : ""}"
                  onclick="setModalEffortSlider('${p.id}', '${escapeHtml(m.id)}', '${idx}')"
                >
                  ${EFFORT_LABELS[st]}
                </button>
              `).join("")}
            </div>
          </div>
        </div>

        <div class="token-grid">
          <div class="form-field">
            <label>上下文上限 (Token)</label>
            <div class="input-box">
              <input
                type="number"
                class="mono"
                min="1024"
                step="1024"
                placeholder="默认"
                value="${m.contextTokens ?? ""}"
                oninput="setModalTokenInput('${p.id}', '${escapeHtml(m.id)}', 'contextTokens', this.value)"
              />
            </div>
          </div>
          <div class="form-field">
            <label>最大输出 (Token)</label>
            <div class="input-box">
              <input
                type="number"
                class="mono"
                min="256"
                step="256"
                placeholder="默认"
                value="${m.maxOutputTokens ?? ""}"
                oninput="setModalTokenInput('${p.id}', '${escapeHtml(m.id)}', 'maxOutputTokens', this.value)"
              />
            </div>
          </div>
        </div>

        <div class="form-row-inline">
          <span class="lbl">允许预填续写 (Prefill)</span>
          <button
            type="button"
            id="modalPrefillSwitch"
            class="switch"
            role="switch"
            aria-checked="${prefillOn}"
            onclick="toggleModalSwitch('${p.id}', '${escapeHtml(m.id)}', 'prefill', this)"
          >
            <span class="thumb"></span>
          </button>
        </div>

        <div class="form-row-inline">
          <span class="lbl">回传历史思考过程</span>
          <button
            type="button"
            id="modalReasoningSwitch"
            class="switch"
            role="switch"
            aria-checked="${reasoningBackOn}"
            onclick="toggleModalSwitch('${p.id}', '${escapeHtml(m.id)}', 'reasoningBack', this)"
          >
            <span class="thumb"></span>
          </button>
        </div>
      `;
    }

    function syncModalConflictAndSwitches(p, m) {
      const banner = document.getElementById("modelModalConflictBanner");
      if (banner) {
        banner.style.display = hasPrefillConflict(p, m) ? "" : "none";
      }
      const effFmt = effectiveFormat(p, m);
      const fmtDef = DEFAULTS[effFmt] || DEFAULTS["openai-compatible"];
      const prefillSwitch = document.getElementById("modalPrefillSwitch");
      if (prefillSwitch) {
        prefillSwitch.setAttribute("aria-checked", String(effectivePrefill(p, m)));
      }
      const reasoningSwitch = document.getElementById("modalReasoningSwitch");
      if (reasoningSwitch) {
        const rb = typeof m.capabilities?.reasoningBack === "boolean" ? m.capabilities.reasoningBack : fmtDef.reasoningBack;
        reasoningSwitch.setAttribute("aria-checked", String(rb));
      }
    }

    function setModalTemplate(pid, mid, tplId) {
      const p = state.providers.find((x) => x.id === pid);
      const m = p?.models.find((x) => x.id === mid);
      if (!m) return;
      m.templateId = tplId;
      syncModalConflictAndSwitches(p, m);
    }
    function setModalModelFormat(pid, mid, fmt) {
      const p = state.providers.find((x) => x.id === pid);
      const m = p?.models.find((x) => x.id === mid);
      if (!m) return;
      m.format = fmt || undefined;
      syncModalConflictAndSwitches(p, m);
    }
    function setModalCap(pid, mid, key, val) {
      const p = state.providers.find((x) => x.id === pid);
      const m = p?.models.find((x) => x.id === mid);
      if (!m) return;
      m.capabilities = m.capabilities || {};
      m.capabilities[key] = val;
      syncModalConflictAndSwitches(p, m);
    }
    function toggleModalSwitch(pid, mid, key, btnEl) {
      const cur = btnEl.getAttribute("aria-checked") === "true";
      setModalCap(pid, mid, key, !cur);
    }
    function setModalEffortSlider(pid, mid, idxStr) {
      const p = state.providers.find((x) => x.id === pid);
      const m = p?.models.find((x) => x.id === mid);
      if (!m) return;
      const idx = Math.max(0, Math.min(4, Number(idxStr)));
      const step = EFFORT_STEPS[idx] || "off";
      m.effort = step;
      const badge = document.getElementById("effortValBadge");
      if (badge) badge.textContent = EFFORT_LABELS[step];
      const fill = document.getElementById("effortRailFill");
      if (fill) fill.style.width = `${idx * 25}%`;
      const range = document.getElementById("effortRangeInput");
      if (range) range.value = String(idx);
      const stops = document.querySelectorAll("#effortStopsRow .effort-dot");
      stops.forEach((dot, i) => {
        dot.className = `effort-dot ${i < idx ? "passed" : ""} ${i === idx ? "active" : ""}`;
      });
      const ticks = document.querySelectorAll("#effortTicksRow .effort-tick-btn");
      ticks.forEach((btn, i) => {
        btn.className = `effort-tick-btn ${i === idx ? "active" : ""}`;
      });
    }
    function setModalTokenInput(pid, mid, field, valStr) {
      const p = state.providers.find((x) => x.id === pid);
      const m = p?.models.find((x) => x.id === mid);
      if (!m) return;
      const num = parseInt(valStr, 10);
      m[field] = Number.isFinite(num) && num > 0 ? num : undefined;
    }

    /* Modal 3: Manual Add Model */
    function openAddModelModal() {
      document.getElementById("manualModelIdInput").value = "";
      document.getElementById("manualModelGroupInput").value = "";
      document.getElementById("addModelModal").showModal();
    }
    function submitManualModel(e) {
      e.preventDefault();
      const id = document.getElementById("manualModelIdInput").value.trim();
      const group = document.getElementById("manualModelGroupInput").value.trim() || id.split(/[-/]/)[0] || "自定义";
      const p = state.providers.find((x) => x.id === state.selectedProviderId);
      if (p && id && !p.models.some((m) => m.id === id)) {
        p.models.push({ id, group, templateId: "", effort: "off", maxOutputTokens: 4096, capabilities: {} });
      }
      closeModal("addModelModal");
      render();
    }

    function closeModal(id) {
      document.getElementById(id).close();
    }

    /* Template Handlers */
    function createNewTemplate() {
      const id = "tpl-" + Date.now().toString(36);
      state.templates.push({
        id,
        name: "新建提示词模板",
        narrateHead: [{ role: "system", text: "" }],
        narrateTail: [],
        reviewHead: []
      });
      state.selectedTemplateId = id;
      state.mobilePane = "detail";
      render();
    }
    function updateTemplateName(id, val) {
      const t = state.templates.find((x) => x.id === id);
      if (t) t.name = val;
    }
    function deleteTemplate(id) {
      if (state.templates.length <= 1) return;
      state.templates = state.templates.filter((x) => x.id !== id);
      state.selectedTemplateId = state.templates[0].id;
      render();
    }
    function addTemplateMessage(tid, slotKey) {
      const t = state.templates.find((x) => x.id === tid);
      if (!t) return;
      t[slotKey].push({ role: slotKey === "narrateTail" ? "assistant" : "user", text: "" });
      render();
    }
    function updateTemplateMsgRole(tid, slotKey, idx, role) {
      const t = state.templates.find((x) => x.id === tid);
      if (t && t[slotKey][idx]) t[slotKey][idx].role = role;
    }
    function updateTemplateMsgText(tid, slotKey, idx, text) {
      const t = state.templates.find((x) => x.id === tid);
      if (t && t[slotKey][idx]) t[slotKey][idx].text = text;
    }
    function removeTemplateMsg(tid, slotKey, idx) {
      const t = state.templates.find((x) => x.id === tid);
      if (t) t[slotKey].splice(idx, 1);
      render();
    }

    /* Persona Handlers */
    function createNewPersona() {
      const id = "per-" + Date.now().toString(36);
      state.personas.push({
        id,
        name: "新建人设",
        color: "#10b981",
        cards: [],
        text: ""
      });
      state.selectedPersonaId = id;
      state.mobilePane = "detail";
      render();
    }
    function perNameChange(id, val) {
      const p = state.personas.find((x) => x.id === id);
      if (p) p.name = val;
    }
    function updatePersonaText(id, val) {
      const p = state.personas.find((x) => x.id === id);
      if (p) p.text = val;
    }
    function deletePersona(id) {
      if (state.personas.length <= 1) return;
      state.personas = state.personas.filter((x) => x.id !== id);
      state.selectedPersonaId = state.personas[0].id;
      render();
    }

    /* Demo Switcher Wiring */
    document.querySelectorAll("[data-theme-btn]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const th = btn.getAttribute("data-theme-btn");
        document.documentElement.setAttribute("data-theme", th);
        document.querySelectorAll("[data-theme-btn]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b === btn))
        );
      });
    });
    document.querySelectorAll("[data-vp-btn]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const vp = btn.getAttribute("data-vp-btn");
        document.getElementById("appWrap").setAttribute("data-vp", vp);
        document.body.setAttribute("data-vp", vp);
        document.querySelectorAll("[data-vp-btn]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b === btn))
        );
      });
    });

    document.addEventListener("click", () => {
      document.querySelectorAll('.c-select[data-open="true"]').forEach((el) => {
        el.setAttribute("data-open", "false");
      });
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        document.querySelectorAll('.c-select[data-open="true"]').forEach((el) => {
          el.setAttribute("data-open", "false");
        });
      }
    });

    render();
  </script>
</body>
</html>
