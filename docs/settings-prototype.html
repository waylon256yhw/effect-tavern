<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Settings · 模型服务与设置</title>
  <style>
    /* ───────── 1. Design Tokens (packages/client/src/tokens.css) ───────── */
    :root {
      color-scheme: light dark;

      --surface-0: light-dark(#f3f3ef, #0b0b0b);
      --surface-1: light-dark(#fcfcfb, #151514);
      --surface-2: light-dark(#ffffff, #1c1c1b);
      --surface-3: light-dark(#ffffff, #242423);

      --ink: light-dark(#151515, #f5f5f3);
      --ink-2: light-dark(#525252, #a3a3a1);
      --ink-3: light-dark(#8a8a8a, #6f6f6d);

      --alpha-1: light-dark(rgb(20 20 20 / 0.045), rgb(255 255 255 / 0.045));
      --alpha-2: light-dark(rgb(20 20 20 / 0.09), rgb(255 255 255 / 0.085));
      --alpha-3: light-dark(rgb(20 20 20 / 0.18), rgb(255 255 255 / 0.16));
      --alpha-4: light-dark(rgb(20 20 20 / 0.32), rgb(255 255 255 / 0.28));
      --line: var(--alpha-2);
      --line-strong: var(--alpha-3);
      --ghost-hover: var(--alpha-1);

      --primary: var(--ink);
      --primary-ink: var(--surface-1);
      --danger: light-dark(#dc2626, #f87171);
      --danger-soft: light-dark(rgb(220 38 38 / 0.1), rgb(248 113 113 / 0.14));
      --ok: light-dark(#16a34a, #22c55e);
      --ok-soft: light-dark(rgb(22 163 74 / 0.12), rgb(34 197 94 / 0.15));
      --warn: light-dark(#d97706, #fbbf24);
      --warn-soft: light-dark(rgb(217 119 6 / 0.12), rgb(251 191 36 / 0.14));
      --scrim: light-dark(rgb(0 0 0 / 0.24), rgb(0 0 0 / 0.6));
      --ring: var(--alpha-4);

      --hairline: 1px;
      --shadow-1:
        0 1px 2px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 2px 8px light-dark(rgb(0 0 0 / 0.07), rgb(0 0 0 / 0.4)),
        inset 0 0 0 var(--hairline) light-dark(rgb(20 20 20 / 0.06), rgb(255 255 255 / 0.06));
      --shadow-2:
        0 2px 4px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.45)),
        0 8px 20px light-dark(rgb(0 0 0 / 0.07), rgb(0 0 0 / 0.45)),
        inset 0 0 0 var(--hairline) light-dark(rgb(20 20 20 / 0.07), rgb(255 255 255 / 0.07));
      --shadow-pop:
        inset 0 0 0 1px light-dark(transparent, rgb(255 255 255 / 0.1)),
        0 0 0 1px light-dark(var(--line), transparent),
        0 16px 44px light-dark(rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.72)),
        0 4px 12px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.5));

      --radius-sm: 6px;
      --radius: 9px;
      --radius-card: 12px;
      --radius-dialog: 16px;
      --radius-pill: 999px;

      --control-lg: 38px;
      --control: 34px;
      --control-sm: 28px;

      --font-sans:
        system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --text-caption: 0.75rem;    /* 12px */
      --text-footnote: 0.8125rem; /* 13px */
      --text-body: 0.9375rem;     /* 15px */
      --text-heading: 1.0625rem;  /* 17px */
      --text-title: 1.25rem;      /* 20px */

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 28px;

      --dur-1: 80ms;
      --dur-2: 150ms;
      --dur-3: 240ms;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    @media (resolution >= 2x) {
      :root { --hairline: 0.5px; }
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: 1.5;
      color: var(--ink);
      background: var(--surface-0);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
    }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
    h1, h2, h3, p, ul { margin: 0; padding: 0; list-style: none; }

    /* ───────── 2. Minimal Floating Demo Switcher (Bottom-Left Pill) ───────── */
    .demo-dock {
      position: fixed;
      bottom: 14px;
      left: 14px;
      z-index: 90;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-caption);
    }
    .demo-dock button {
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-weight: 500;
    }
    .demo-dock button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
      font-weight: 600;
    }
    .demo-dock .sep {
      width: 1px;
      height: 12px;
      background: var(--line);
    }

    /* ───────── 3. Three-Card Canvas Layout (Matches Reader's .canvas in chrome.css) ───────── */
    .app-wrap {
      height: 100vh;
      width: 100vw;
      display: flex;
      overflow: hidden;
      background: var(--surface-0);
    }
    .app-wrap[data-vp="mobile"] {
      background: light-dark(#e2e2de, #050505);
      align-items: center;
      justify-content: center;
      padding: var(--space-3);
    }

    /* Desktop: Three independent rounded cards floating on --surface-0 with breathing negative space */
    .canvas {
      flex: 1;
      height: 100%;
      width: 100%;
      display: grid;
      grid-template-columns: 13.5rem 16.5rem minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr);
      gap: var(--space-5);
      padding: var(--space-5);
      background: var(--surface-0);
      position: relative;
      overflow: hidden;
    }
    .canvas[data-columns="two"] {
      grid-template-columns: 13.5rem minmax(0, 1fr);
    }

    /* Mobile 390px Frame */
    .app-wrap[data-vp="mobile"] .canvas {
      max-width: 390px;
      max-height: 820px;
      border-radius: 38px;
      box-shadow: var(--shadow-pop);
      background: var(--surface-1);
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      gap: 0;
      padding: 0;
    }

    /* ───────── 4. Card 1: Left Navigation Card ───────── */
    .nav-card {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: var(--space-5) var(--space-3);
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      gap: var(--space-4);
      user-select: none;
    }
    .nav-head {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0 var(--space-2);
    }
    .nav-head h1 {
      font-size: var(--text-title);
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      color: var(--ink-2);
      font-size: var(--text-body);
      font-weight: 500;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      color: var(--ink-3);
      flex: none;
    }
    .nav-item:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .nav-item[aria-current="page"] {
      background: var(--surface-3);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-1);
    }
    .nav-item[aria-current="page"] svg {
      color: var(--ink);
    }

    /* ───────── 5. Mobile Safe-Area Header + Icon Switcher ───────── */
    .mobile-bar {
      display: none;
      flex-direction: column;
      /* Generous safe-area top + horizontal inset to clear curved corners & notch */
      padding: 22px var(--space-5) var(--space-3);
      background: var(--surface-1);
      border-bottom: var(--hairline) solid var(--line);
    }
    .mobile-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 38px;
    }
    .mobile-bar-title {
      font-size: var(--text-heading);
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .mobile-icon-tabs {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
    }
    .mobile-icon-tabs button {
      width: 34px;
      height: 30px;
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      transition: background var(--dur-1), color var(--dur-1);
    }
    .mobile-icon-tabs button svg {
      width: 17px;
      height: 17px;
    }
    .mobile-icon-tabs button:hover {
      color: var(--ink);
    }
    .mobile-icon-tabs button[aria-selected="true"] {
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-1);
    }

    /* ───────── 6. Card 2: Middle Master List Card ───────── */
    .master-card {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      overflow: hidden;
    }
    .master-top {
      padding: var(--space-4) var(--space-3) var(--space-2);
    }
    .master-top .input-box {
      height: 36px;
      background: var(--surface-0);
    }
    .master-list {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .p-row {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 42px;
      padding: 0 10px;
      border-radius: var(--radius);
      color: var(--ink-2);
      text-align: left;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .p-row:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .p-row[aria-selected="true"] {
      background: var(--surface-3);
      color: var(--ink);
      font-weight: 600;
      box-shadow: var(--shadow-1);
    }
    .p-row .p-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .master-foot {
      padding: var(--space-3);
      border-top: var(--hairline) solid var(--line);
    }
    .master-foot .btn {
      width: 100%;
      height: 36px;
      border-radius: var(--radius);
    }

    /* ───────── 7. Card 3: Right Detail Card (Raised one step like Reader .panel) ───────── */
    .detail-card {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      position: relative;
      overflow: hidden;
    }
    .detail-header {
      flex: none;
      height: 62px;
      padding: 0 var(--space-6);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      border-bottom: var(--hairline) solid var(--line);
    }
    .detail-header h2 {
      font-size: var(--text-heading);
      font-weight: 650;
    }
    .detail-header .spacer { flex: 1; }

    .detail-scroll {
      flex: 1;
      padding: var(--space-5) var(--space-6) var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    /* ───────── 8. Shared Controls (Buttons, Inputs, Toggles, Selects, Sliders, Avatars) ───────── */
    .icon-btn {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      flex: none;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .icon-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .icon-btn.sm {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: var(--radius-sm);
    }
    .icon-btn svg {
      width: 17px;
      height: 17px;
    }

    .btn {
      height: var(--control);
      padding: 0 14px;
      border-radius: var(--radius);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      color: var(--ink);
      font-size: var(--text-footnote);
      font-weight: 550;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
      transition: background var(--dur-1), box-shadow var(--dur-1);
    }
    .btn:hover {
      background: var(--surface-3);
      box-shadow: inset 0 0 0 var(--hairline) var(--alpha-4);
    }
    .btn.sm {
      height: var(--control-sm);
      padding: 0 10px;
      font-size: var(--text-caption);
      border-radius: var(--radius-sm);
    }
    .btn.primary {
      background: var(--primary);
      color: var(--primary-ink);
      box-shadow: none;
    }
    .btn.primary:hover { opacity: 0.9; }
    .btn.ghost {
      background: transparent;
      box-shadow: none;
      color: var(--ink-2);
    }
    .btn.ghost:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .btn svg {
      width: 15px;
      height: 15px;
    }

    .input-box {
      display: flex;
      align-items: center;
      height: var(--control-lg);
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      background: var(--surface-0);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      transition: box-shadow var(--dur-1), background var(--dur-1);
      gap: var(--space-2);
    }
    .input-box:focus-within {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--alpha-4);
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      height: 100%;
      outline: none;
      font-size: var(--text-body);
    }
    .input-box input.mono {
      font-family: var(--font-mono);
      font-size: var(--text-footnote);
    }
    .input-box svg {
      width: 16px;
      height: 16px;
      color: var(--ink-3);
      flex: none;
    }

    /* Expandable Inline Search (icon by default -> expands horizontally on click) */
    .inline-search {
      display: inline-flex;
      align-items: center;
      height: 28px;
      width: 28px;
      padding: 0 7px;
      gap: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--ink-2);
      overflow: hidden;
      cursor: pointer;
      flex: none;
      transition:
        width var(--dur-2) var(--ease-out),
        padding var(--dur-2) var(--ease-out),
        gap var(--dur-2) var(--ease-out),
        background var(--dur-1) var(--ease),
        box-shadow var(--dur-1) var(--ease),
        border-radius var(--dur-1) var(--ease);
    }
    .inline-search:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .inline-search svg {
      width: 14px;
      height: 14px;
      color: currentColor;
      flex: none;
    }
    .inline-search input {
      width: 0;
      min-width: 0;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      outline: none;
      font-size: var(--text-footnote);
      color: var(--ink);
      transition: opacity var(--dur-1) var(--ease);
    }
    .inline-search input::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
    }
    .inline-search[data-open="true"] {
      width: clamp(9rem, 32%, 14rem);
      height: 30px;
      padding: 0 10px;
      gap: 6px;
      border-radius: var(--radius);
      background: var(--surface-0);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      color: var(--ink-3);
      cursor: text;
    }
    .inline-search[data-open="true"]:focus-within {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--alpha-4);
    }
    .inline-search[data-open="true"] input {
      flex: 1;
      width: 100%;
      opacity: 1;
      pointer-events: auto;
    }
    .app-wrap[data-vp="mobile"] .inline-search[data-open="true"] {
      width: 8.75rem;
    }
    @media (max-width: 780px) {
      .inline-search[data-open="true"] {
        width: 8.75rem;
      }
    }

    /* Custom Lightweight Dropdown (replaces native OS <select> to eliminate NSMenu blink/lag & heavy focus ring) */
    .c-select {
      position: relative;
      width: 100%;
    }
    .c-select-btn {
      width: 100%;
      height: var(--control-lg);
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      background: var(--surface-0);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      color: var(--ink);
      font-size: var(--text-body);
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      text-align: left;
      outline: none;
      transition: background var(--dur-1) var(--ease);
    }
    .c-select.sm .c-select-btn {
      height: 34px;
      font-size: var(--text-footnote);
    }
    .c-select-btn:hover,
    .c-select[data-open="true"] .c-select-btn {
      background: var(--surface-2);
    }
    .c-select-label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .c-select-btn .caret {
      width: 13px;
      height: 13px;
      color: var(--ink-3);
      flex: none;
      transition: rotate var(--dur-1) var(--ease);
    }
    .c-select[data-open="true"] .c-select-btn .caret {
      rotate: 180deg;
    }
    .c-select-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      z-index: 80;
      padding: 4px;
      border-radius: var(--radius);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 14rem;
      overflow-y: auto;
      opacity: 0;
      pointer-events: none;
      translate: 0 -3px;
      transition: opacity 90ms var(--ease-out), translate 90ms var(--ease-out);
    }
    .c-select[data-open="true"] .c-select-menu {
      opacity: 1;
      pointer-events: auto;
      translate: 0 0;
    }
    .c-select-opt {
      width: 100%;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--text-footnote);
      color: var(--ink-2);
      text-align: left;
      transition: background 60ms, color 60ms;
    }
    .c-select-opt:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .c-select-opt[aria-selected="true"] {
      background: var(--fill);
      color: var(--ink);
      font-weight: 500;
    }
    .c-select-opt svg {
      width: 13px;
      height: 13px;
      color: var(--ink);
      flex: none;
    }

    .switch {
      width: 42px;
      height: 24px;
      border-radius: var(--radius-pill);
      background: var(--alpha-3);
      padding: 2px;
      display: inline-flex;
      align-items: center;
      transition: background var(--dur-2) var(--ease);
      flex: none;
    }
    .switch[aria-checked="true"] {
      background: var(--ok);
    }
    .switch .thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
      transition: translate var(--dur-2) var(--ease);
    }
    .switch[aria-checked="true"] .thumb {
      translate: 18px 0;
    }

    /* Stepped Discrete Slider (5 fixed stops for Reasoning Effort) */
    .effort-stepper {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px 2px 2px;
      user-select: none;
    }
    .effort-rail-wrap {
      position: relative;
      height: 22px;
      display: flex;
      align-items: center;
    }
    .effort-rail {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 4px;
      border-radius: 2px;
      background: var(--alpha-2);
    }
    .effort-rail-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--ink);
      transition: width var(--dur-2) var(--ease);
    }
    .effort-stops {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .effort-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface-2);
      box-shadow: inset 0 0 0 2px var(--alpha-3);
      transition: transform var(--dur-1), background var(--dur-1), box-shadow var(--dur-1);
    }
    .effort-dot.passed {
      background: var(--ink-2);
      box-shadow: none;
    }
    .effort-dot.active {
      width: 18px;
      height: 18px;
      background: var(--ink);
      box-shadow: 0 0 0 3px var(--surface-2), var(--shadow-1);
    }
    .effort-range-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }
    .effort-ticks {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      text-align: center;
    }
    .effort-tick-btn {
      font-size: var(--text-caption);
      color: var(--ink-3);
      padding: 2px 0;
      border-radius: var(--radius-sm);
      transition: color var(--dur-1), font-weight var(--dur-1);
    }
    .effort-tick-btn:hover {
      color: var(--ink-2);
    }
    .effort-tick-btn.active {
      color: var(--ink);
      font-weight: 650;
    }
    .effort-tick-btn:first-child { text-align: left; }
    .effort-tick-btn:last-child { text-align: right; }

    .token-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .link-btn {
      font-size: var(--text-footnote);
      font-weight: 500;
      color: var(--ink-2);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      transition: color var(--dur-1), background var(--dur-1);
    }
    .link-btn:hover {
      color: var(--ink);
      background: var(--ghost-hover);
    }

    .btn-join {
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      overflow: hidden;
    }
    .btn-join > .btn {
      box-shadow: none;
      border-radius: 0;
      background: transparent;
    }
    .btn-join > .btn + .btn {
      border-left: var(--hairline) solid var(--line-strong);
      padding-inline: 10px;
    }

    .btn.xs {
      height: 22px;
      padding: 0 8px;
      font-size: var(--text-caption);
      border-radius: var(--radius-sm);
    }

    .dashed-btn {
      width: 100%;
      height: 34px;
      border-radius: var(--radius);
      border: 1px dashed var(--line-strong);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background var(--dur-1), color var(--dur-1);
    }
    .dashed-btn svg {
      width: 14px;
      height: 14px;
      flex: none;
    }
    .dashed-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }

    .avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-caption);
      font-weight: 700;
      color: #fff;
      flex: none;
    }
    .avatar.lg {
      width: 52px;
      height: 52px;
      font-size: var(--text-title);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: transparent;
      flex: none;
    }
    .status-dot.on {
      background: var(--ok);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-caption);
      white-space: nowrap;
    }
    .tag.mono { font-family: var(--font-mono); }
    .tag.ok {
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 600;
    }
    .tag.warn {
      background: var(--warn-soft);
      color: var(--warn);
      font-weight: 600;
    }
    .tag.bad {
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 600;
    }

    .wscroll {
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }
    .wscroll:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 28px;
    }
    .section-title h3 {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
    }
    .section-title .right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }
    .resolved-url {
      font-family: var(--font-mono);
      font-size: var(--text-caption);
      color: var(--ink-3);
      padding-left: 2px;
      overflow-wrap: anywhere;
    }
    .resolved-url.err {
      color: var(--danger);
    }

    /* ───────── 9. Grouped Model Cards ───────── */
    .model-groups {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .m-group {
      border-radius: var(--radius-card);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      overflow: hidden;
    }
    .m-group > summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
      height: 40px;
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: var(--text-footnote);
      font-weight: 600;
      color: var(--ink-2);
      background: color-mix(in srgb, var(--surface-0) 40%, var(--surface-2));
    }
    .m-group > summary::-webkit-details-marker { display: none; }
    .m-group > summary .chev {
      width: 14px;
      height: 14px;
      color: var(--ink-3);
      transition: rotate var(--dur-1);
    }
    .m-group[open] > summary .chev {
      rotate: 90deg;
    }
    .m-rows {
      display: flex;
      flex-direction: column;
    }
    .m-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      min-height: 46px;
      padding: 6px var(--space-4);
      border-top: var(--hairline) solid var(--line);
      transition: background var(--dur-1);
    }
    .m-row:hover {
      background: var(--ghost-hover);
    }
    .m-row .m-name {
      font-weight: 550;
      color: var(--ink);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .m-row .m-badges {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .m-row .m-acts {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    /* ───────── 10. Slide-Over Side Card (Sync Models Drawer inside Detail Card) ───────── */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: var(--scrim);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-3) var(--ease);
    }
    .drawer-backdrop[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }
    .side-drawer {
      position: absolute;
      top: var(--space-3);
      right: var(--space-3);
      bottom: var(--space-3);
      width: min(29rem, calc(100% - 2 * var(--space-3)));
      z-index: 45;
      border-radius: var(--radius-dialog);
      background: var(--surface-2);
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      translate: calc(100% + var(--space-4)) 0;
      transition: translate var(--dur-3) var(--ease);
      overflow: hidden;
    }
    .side-drawer[data-open="true"] {
      translate: 0 0;
    }
    .drawer-head {
      height: 56px;
      padding: 0 var(--space-4) 0 var(--space-5);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      border-bottom: var(--hairline) solid var(--line);
    }
    .drawer-head h3 {
      font-size: var(--text-heading);
      font-weight: 650;
    }
    .drawer-head .spacer { flex: 1; }
    .drawer-search {
      padding: var(--space-3) var(--space-5);
      border-bottom: var(--hairline) solid var(--line);
    }
    .drawer-body {
      flex: 1;
      padding: var(--space-4) var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .m-row.added {
      background: color-mix(in srgb, var(--ok) 9%, transparent);
    }

    /* ───────── 11. Modals (Add Provider Onboarding & Model Settings) ───────── */
    dialog.modal {
      width: min(27rem, calc(100vw - 2 * var(--space-4)));
      max-width: 100%;
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-2);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      outline: none;
      overflow: hidden;
    }
    dialog.modal[open] {
      display: flex;
      flex-direction: column;
    }
    dialog.modal::backdrop {
      background: var(--scrim);
    }
    .modal-head {
      height: 54px;
      padding: 0 var(--space-4) 0 var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      border-bottom: var(--hairline) solid var(--line);
    }
    .modal-head h3 {
      font-size: var(--text-heading);
      font-weight: 650;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-body {
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      max-height: 72vh;
      overflow-y: auto;
    }
    .modal-foot {
      padding: var(--space-3) var(--space-5);
      border-top: var(--hairline) solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-field label {
      font-size: var(--text-footnote);
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-row-inline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      min-height: 38px;
    }
    .form-row-inline .lbl {
      font-size: var(--text-body);
      font-weight: 500;
    }

    /* ───────── 12. Default Model & Template Cards ───────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(19rem, 1fr));
      gap: var(--space-4);
    }
    .setting-card {
      padding: var(--space-4) var(--space-5);
      border-radius: var(--radius-card);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .setting-card.hero {
      grid-column: 1 / -1;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
    }

    .msg-card {
      display: grid;
      grid-template-columns: 8.5rem minmax(0, 1fr) auto;
      gap: var(--space-3);
      align-items: start;
      padding: var(--space-3);
      border-radius: var(--radius-card);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
    }
    .msg-card textarea {
      width: 100%;
      min-height: 3.4rem;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      background: var(--surface-0);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      line-height: 1.55;
      resize: vertical;
      outline: none;
    }
    .msg-card textarea:focus {
      box-shadow: inset 0 0 0 1.5px var(--ink-2);
    }

    /* ───────── 13. Responsive & Mobile 390px Rules ───────── */
    .mobile-back-btn { display: none; }
    @media (max-width: 62rem) {
      .canvas, .canvas[data-columns="two"] {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        gap: 0;
        padding: 0;
      }
      .nav-card { display: none; }
      .mobile-bar { display: flex; }
      .master-card, .detail-card {
        border-radius: 0;
        box-shadow: none;
      }
      .canvas[data-pane="detail"] .master-card { display: none; }
      .canvas[data-pane="list"] .detail-card { display: none; }
      .mobile-back-btn { display: inline-flex; }
      .detail-header, .detail-scroll { padding-inline: var(--space-5); }
      .setting-card.hero { flex-direction: column; align-items: stretch; }
      .msg-card { grid-template-columns: minmax(0, 1fr); }
      dialog.modal {
        width: calc(100vw - 24px);
      }
      .modal-head { padding: 0 var(--space-4); }
      .modal-body { padding: var(--space-4); }
      .modal-foot { padding: var(--space-3) var(--space-4); }
    }
    .app-wrap[data-vp="mobile"] .nav-card { display: none; }
    .app-wrap[data-vp="mobile"] .mobile-bar { display: flex; }
    .app-wrap[data-vp="mobile"] .master-card,
    .app-wrap[data-vp="mobile"] .detail-card {
      border-radius: 0;
      box-shadow: none;
    }
    .app-wrap[data-vp="mobile"] .canvas[data-pane="detail"] .master-card { display: none; }
    .app-wrap[data-vp="mobile"] .canvas[data-pane="list"] .detail-card { display: none; }
    .app-wrap[data-vp="mobile"] .mobile-back-btn { display: inline-flex; }
    .app-wrap[data-vp="mobile"] .detail-header,
    .app-wrap[data-vp="mobile"] .detail-scroll { padding-inline: var(--space-4); }
    .app-wrap[data-vp="mobile"] .setting-card.hero { flex-direction: column; align-items: stretch; }
    .app-wrap[data-vp="mobile"] .msg-card { grid-template-columns: minmax(0, 1fr); }
    body[data-vp="mobile"] dialog.modal {
      width: calc(min(390px, 100vw) - 24px);
      max-width: calc(390px - 24px);
    }
    body[data-vp="mobile"] .modal-head { padding: 0 var(--space-4); height: 48px; }
    body[data-vp="mobile"] .modal-body { padding: var(--space-4); gap: var(--space-3); }
    body[data-vp="mobile"] .modal-foot { padding: var(--space-3) var(--space-4); }
  </style>
</head>
<body>
  <!-- Floating Demo Switcher (Theme + Viewport) -->
  <div class="demo-dock" aria-label="Demo Switcher">
    <button type="button" data-theme-btn="dark" aria-pressed="true">Dark</button>
    <button type="button" data-theme-btn="light" aria-pressed="false">Light</button>
    <span class="sep"></span>
    <button type="button" data-vp-btn="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-vp-btn="mobile" aria-pressed="false">390px</button>
  </div>

  <div class="app-wrap" id="appWrap" data-vp="desktop">
    <div class="canvas" id="canvasRoot" data-columns="three" data-pane="list"></div>
  </div>

  <!-- ───────── Modal 1: Add Custom Provider Onboarding ───────── -->
  <dialog class="modal" id="addProviderModal" closedby="any">
    <div class="modal-head">
      <h3>添加自定义服务商</h3>
      <button type="button" class="icon-btn sm" aria-label="Close" onclick="closeModal('addProviderModal')">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18"><path d="M200 56L56 200M200 200L56 56"/></svg>
      </button>
    </div>
    <form id="addProviderForm" onsubmit="submitNewProvider(event)">
      <div class="modal-body" style="gap:var(--space-3)">
        <div class="token-grid">
          <div class="form-field">
            <label>服务商名称 <span style="color:var(--danger)">*</span></label>
            <div class="input-box">
              <input type="text" id="newProvName" placeholder="例如 OpenAI / 硅基中转" required />
            </div>
          </div>
          <div class="form-field">
            <label>API 密钥</label>
            <div class="input-box">
              <input type="password" id="newProvKey" class="mono" placeholder="输入 API 密钥" />
            </div>
          </div>
        </div>
        <div class="form-field" style="gap:var(--space-3);border-top:var(--hairline) solid var(--line);padding-top:var(--space-3)">
          <label style="color:var(--ink-2)">端点设置</label>
          <div class="form-field">
            <label>
              <span>OpenAI</span>
              <span id="newProvBadgeOpenai"><span class="tag ok">默认</span></span>
            </label>
            <div class="input-box">
              <input type="url" id="newProvUrlOpenai" class="mono" placeholder="Base URL: https://api.openai.com" value="https://api.openai.com" oninput="syncNewProvPreview()" />
            </div>
            <div class="resolved-url" id="newProvPreviewOpenai">https://api.openai.com/v1/chat/completions</div>
          </div>
          <div class="form-field">
            <label>
              <span>Anthropic</span>
              <span id="newProvBadgeAnthropic"><button type="button" class="btn xs" onclick="setNewProvDefault('anthropic')">设为默认</button></span>
            </label>
            <div class="input-box">
              <input type="url" id="newProvUrlAnthropic" class="mono" placeholder="Base URL: https://api.anthropic.com" oninput="syncNewProvPreview()" />
            </div>
            <div class="resolved-url" id="newProvPreviewAnthropic" style="display:none"></div>
          </div>
          <div class="form-field">
            <label>
              <span>Gemini</span>
              <span id="newProvBadgeGemini"><button type="button" class="btn xs" onclick="setNewProvDefault('gemini')">设为默认</button></span>
            </label>
            <div class="input-box">
              <input type="url" id="newProvUrlGemini" class="mono" placeholder="Base URL: https://generativelanguage.googleapis.com" oninput="syncNewProvPreview()" />
            </div>
            <div class="resolved-url" id="newProvPreviewGemini" style="display:none"></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" onclick="closeModal('addProviderModal')">取消</button>
        <button type="submit" class="btn primary">添加</button>
      </div>
    </form>
  </dialog>

  <!-- ───────── Modal 2: Single Model Settings (Gear Modal) ───────── -->
  <dialog class="modal" id="modelSettingsModal" closedby="any">
    <div class="modal-head">
      <h3 id="modelModalTitle">模型设置</h3>
      <button type="button" class="icon-btn sm" aria-label="Close" onclick="closeModal('modelSettingsModal')">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18"><path d="M200 56L56 200M200 200L56 56"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modelModalBody"></div>
    <div class="modal-foot">
      <button type="button" class="btn primary" onclick="closeModal('modelSettingsModal')">完成</button>
    </div>
  </dialog>

  <!-- ───────── Modal 3: Add Manual Model ───────── -->
  <dialog class="modal" id="addModelModal" closedby="any" style="width:min(24rem,92%)">
    <div class="modal-head">
      <h3>添加模型</h3>
      <button type="button" class="icon-btn sm" aria-label="Close" onclick="closeModal('addModelModal')">
        <svg viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="18"><path d="M200 56L56 200M200 200L56 56"/></svg>
      </button>
    </div>
    <form onsubmit="submitManualModel(event)">
      <div class="modal-body">
        <div class="form-field">
          <label>模型 ID <span style="color:var(--danger)">*</span></label>
          <div class="input-box">
            <input type="text" id="manualModelIdInput" class="mono" placeholder="例如 claude-opus-4-6" required />
          </div>
        </div>
        <div class="form-field">
          <label>分组名称</label>
          <div class="input-box">
            <input type="text" id="manualModelGroupInput" placeholder="自动按前缀归组" />
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn" onclick="closeModal('addModelModal')">取消</button>
        <button type="submit" class="btn primary">添加</button>
      </div>
    </form>
  </dialog>

  <script>
    /* ═══════════════════════════════════════════════════════════════════════════
       1. URL NORMALIZER & PLANNER
       ═══════════════════════════════════════════════════════════════════════════ */
    const RULES = {
      anthropic: { defaultPath: "/v1", operationPath: "/messages" },
      "openai-compatible": { defaultPath: "/v1", operationPath: "/chat/completions" },
      gemini: { defaultPath: "/v1beta", operationPath: "/models/{model}:streamGenerateContent" },
    };

    const DEFAULTS = {
      anthropic: { prefill: false, structured: "schema", reasoningBack: false },
      "openai-compatible": { prefill: true, structured: "schema", reasoningBack: true },
      gemini: { prefill: true, structured: "schema", reasoningBack: true },
    };

    const EFFORT_STEPS = ["off", "low", "medium", "high", "max"];
    const EFFORT_LABELS = { off: "关闭", low: "低", medium: "中", high: "高", max: "最高" };
    const FORMAT_LABELS = {
      "openai-compatible": "OpenAI",
      anthropic: "Anthropic",
      gemini: "Gemini",
    };
    const SECTION_TITLES = {
      providers: "模型服务",
      routing: "默认模型",
      templates: "提示词模板",
      personas: "玩家人设"
    };

    function resolveEndpointPreview(format, rawInput, exactPrefix = false, sampleModel = "{model}") {
      const trimmed = (rawInput || "").trim();
      if (!trimmed) return { ok: false, text: "请输入 API 地址" };
      let u;
      try {
        u = new URL(trimmed);
      } catch {
        return { ok: false, text: "无效的 URL 格式" };
      }
      if (u.protocol !== "http:" && u.protocol !== "https:") {
        return { ok: false, text: "仅支持 http 或 https 协议" };
      }
      if (u.search || u.hash) {
        return { ok: false, text: "地址不可包含查询参数 (?query) 或锚点 (#hash)" };
      }

              return `
                <button
                  type="button"

                  aria-selected="${active}"
                  onclick="pickCustomSelect(this, event); ${onSelect(String(opt.value))}"
                >

                  <span class="c-select-check">${active ? ICONS.check : ""}</span>
                </button>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function toggleCustomSelect(btn, event) {
      event.stopPropagation();
      const root = btn.closest(".c-select");
      if (!root) return;
      const wasOpen = root.getAttribute("data-open") === "true";
      document.querySelectorAll('.c-select[data-open="true"]').forEach((el) => {
        el.setAttribute("data-open", "false");
      });
      root.setAttribute("data-open", wasOpen ? "false" : "true");
    }

    function pickCustomSelect(optBtn, event) {
      event.stopPropagation();
      const root = optBtn.closest(".c-select");
      if (!root) return;
      root.setAttribute("data-open", "false");
      const labelText = optBtn.querySelector("span")?.textContent || "";
      const labelEl = root.querySelector(".c-select-label");
      if (labelEl) labelEl.textContent = labelText;
      root.querySelectorAll(".c-select-opt").forEach((b) => {
        const isTarget = b === optBtn;
        b.setAttribute("aria-selected", String(isTarget));
        const chk = b.querySelector(".c-select-check");
        if (chk) chk.innerHTML = isTarget ? ICONS.check : "";
      });
    }
