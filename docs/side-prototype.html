    /** The picker's rows: what the client has (name, text; the card's own persona text is not served). 卡片默认 first,
     *  then the personas whose name or text match the search; with none made, a hint to the settings page. */
    function renderPickerRowsHTML() {
      const c = activeCard();
      const curP = activePersona();
      const list = emptyPersonas ? [] : personas;
      const q = personaSearch.trim().toLowerCase();
      const hits = q ? list.filter((p) => p.name.toLowerCase().includes(q) || p.text.toLowerCase().includes(q)) : list;
      const defaultBio = c.defaultPersona ? "这张卡写定的玩家角色" : "无主角卡：没有玩家角色";
      const row = (id, name, bio, checked, cls = "") => `
        <button
          type="button"
          role="menuitemradio"
          class="item ${cls}"
          aria-checked="${checked ? "true" : "false"}"
          onclick="pickPersona(${id === undefined ? "undefined" : `'${id}'`})"
        >
          <span class="name">${escapeHtml(name)}</span>
          <span class="check" aria-hidden="true">${ICONS.check}</span>
          <span class="bio">${escapeHtml(bio)}</span>
        </button>
      `;
      const defaultRow = !q || "卡片默认".includes(q) ? row(undefined, "卡片默认", defaultBio, !curP, "default") : "";
      const rows = hits.map((p) => row(p.id, p.name, p.text.split("\n")[0], curP && curP.id === p.id)).join("");
      const tail = !list.length
        ? `<div class="picker-empty">
            <span>尚未创建人设，当前用「卡片默认」。</span>
            <button type="button" class="btn sm" onclick="goManagePersonas()">${ICONS.plus} <span>去设置页新建</span></button>
          </div>`
        : q && !hits.length && !defaultRow
          ? `<div class="picker-empty"><span>没有匹配「${escapeHtml(personaSearch.trim())}」的人设</span></div>`
          : "";
      return defaultRow + (defaultRow && rows ? "<hr />" : "") + rows + tail;
    }

    /** The picker: head, search, rows. Desktop: inside dialog#persona-dialog; phone: a sheet over the session sheet;
     *  overview: drawn open in .picker-static. The search filters the rows in place (filterPicker), so the field keeps
     *  its focus; a full render re-reads `personaSearch`. */
    function renderPickerHTML(context) {
      const c = activeCard();
      const list = emptyPersonas ? [] : personas;
      return `
        <div class="picker-shell" role="dialog" aria-label="选择人设">
          <header class="picker-head">
            <h3>选择人设</h3>
            <span class="tag">${escapeHtml(c.title)}</span>
            <span class="spacer"></span>
            <button type="button" class="btn sm ghost" onclick="goManagePersonas()" title="设置页的玩家人设：新建、改写、删除、全文">
              <span>管理人设</span>
              ${ICONS.arrowUpRight}
            </button>
            <button type="button" class="icon sm" aria-label="关闭" onclick="closePicker()">
              ${ICONS.close}
            </button>
          </header>
          <div class="picker-search">
            <div class="input-box">
              ${ICONS.magGlass}
              <input
                type="search"
                placeholder="搜索人设（名字或正文）"
                value="${escapeAttr(personaSearch)}"
                oninput="filterPicker(this)"
                aria-label="搜索人设"
                ${context === "static" ? "" : "autofocus"}
              />
            </div>
            <span class="tag mono picker-count">${list.length}</span>
          </div>
          <div class="picker-list scroller" role="menu">
            ${renderPickerRowsHTML()}
          </div>
        </div>
      `;
    }

    function renderPhoneFrameHTML() {
      const c = activeCard();
      const curStory = stories.find((s) => s.id === currentStoryId) ?? stories[0];
      const curStoryLabel = curStory.title ?? "New story";
      return `
        <div class="phone-frame">
          <!-- 手机顶部栏：点击标题拉起 Session Sheet（与进卡页的 .cardhead 角色分开） -->
          <header class="topbar">
            <button
              type="button"
              class="title-trigger"
              onclick="togglePhoneSheet()"
              title="手机标题栏：点击拉起/收起 Session Sheet"
            >
              <h1>${escapeHtml(c.title)}</h1>
              <span class="story-sub">· ${escapeHtml(curStoryLabel)}</span>
              ${ICONS.caretDown}
            </button>
            <button type="button" class="icon" aria-label="Status" onclick="showToast('打开手机 Status 弹层')">
              ${ICONS.chartBar}
            </button>
          </header>

          <!-- 底层阅读器示意 -->
          <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; overflow: hidden;">
            <div class="said-bubble">我解下腰间那柄旧短剑放在石桌上：「我是替李鹤来送还故物的。」</div>
            <div class="prose-turn">
              <p>雨后的苦竹林里雾气未散，竹叶上的水珠顺着亭檐一滴滴落在青石板上。</p>
              <p>裴青舟按着乌木剑鞘站在三步开外，目光静静地落在你腰间的旧短剑上。</p>
            </div>
            <div style="margin-top: auto; padding: 12px; border-radius: 12px; background: var(--alpha-1); font-size: 12px; color: var(--ink-3); text-align: center;">
              ↑ 点击顶部「${escapeHtml(c.title)} · ${escapeHtml(curStoryLabel)} ▾」拉起 Session Sheet
            </div>
          </div>

          <!-- 手机 Session Sheet (直接以 .cardhead 顶置，去掉冗余的 SESSION 标题栏) -->
          <div class="phone-scrim" data-open="${phoneSheetOpen ? "true" : "false"}" onclick="if(event.target===this) togglePhoneSheet(false)">
            <div class="phone-sheet">
              ${renderSessionHTML("sheet")}
            </div>
          </div>

          <!-- 选人设：手机上是第二层 sheet，盖在 Session Sheet 上（真机是叠放的两个 .sheet dialog） -->
          <div class="phone-scrim picker-scrim" data-open="${pickerOpen ? "true" : "false"}" onclick="if(event.target===this) closePicker()">
            <div class="phone-sheet picker-sheet">
              ${pickerOpen ? renderPickerHTML("sheet") : ""}
            </div>
          </div>

          <!-- 故事管理：手机上同样是第二层 sheet，盖在 Session Sheet 上 -->
          <div class="phone-scrim stories-scrim" data-open="${storiesModalOpen ? "true" : "false"}" onclick="if(event.target===this) closeStoriesModal()">
            <div class="phone-sheet stories-sheet">
              ${storiesModalOpen ? renderStoriesModalHTML("sheet") : ""}
            </div>
          </div>
        </div>
      `;
    }

    function renderAll() {
      const stage = document.getElementById("stage");
      const c = activeCard();

      if (stageMode === "overview") {
        stage.innerHTML = `
          <div class="overview-grid">
            <!-- State 1: 桌面左栏 (15rem / 192px 净宽) -->
            <div class="state-col">
              <div class="state-label">
                <span>1. 桌面左栏 (aside.side)</span>
                <span class="spec-pill">15rem · 收藏置顶 4 条 + 全部入口</span>
              </div>
              <div class="overview-side-host">
                <aside class="side" aria-label="Desktop Session Card">
                  ${renderSessionHTML("side")}
                </aside>
              </div>
            </div>

            <!-- State 2: Stories 管理弹窗 (#75 Step 2: 35rem 宽大号 Sheet) -->
            <div class="state-col">
              <div class="state-label">
                <span>2. 故事管理弹窗 (#75 第二步 · Sheet)</span>
                <span class="spec-pill">35rem · 全文搜索 · 收藏筛选 · 批量清理 · 单卡动作</span>
              </div>
              <div class="stories-static">
                ${renderStoriesModalHTML("static")}
              </div>
            </div>

            <!-- State 3: 手机 Sheet (390×812) -->
            <div class="state-col">
              <div class="state-label">
                <span>3. 手机标题栏 + 二层叠放 Sheet</span>
                <span class="spec-pill">390px · 点「全部 ${stories.length} 个故事」升起二层 Sheet</span>
              </div>
              ${renderPhoneFrameHTML()}
            </div>

            <!-- State 4: the persona picker open (the desktop dialog, drawn in place) -->
            <div class="state-col">
              <div class="state-label">
                <span>4. 选人设弹窗 (对照 · 25rem)</span>
                <span class="spec-pill">25rem · 搜索 · 两行 · 卡片默认置顶</span>
              </div>
              <div class="picker-static">
                ${renderPickerHTML("static")}
              </div>
            </div>
          </div>
        `;
      } else if (stageMode === "desktop" || stageMode === "picker" || stageMode === "stories") {
        stage.innerHTML = `
          <div class="desktop-canvas">
            <aside class="side" aria-label="Session">
              ${renderSessionHTML("side")}
            </aside>
            <div class="reader-panel">
              <div class="reader-flow">
                <div class="said-bubble">我解下腰间那柄旧短剑放在石桌上：「我是替李鹤来送还故物的。」</div>
                <div class="prose-turn">
                  <p>暮春的雨刚歇，苦竹岭上雾气未散，竹叶间积着的水珠顺着破败的亭檐一滴一滴砸在青石阶上。</p>
                  <p>立在亭柱旁的青衫剑客原本只拿冷淡的余光打量你，待看清剑柄末端那道熟悉的刻痕时，他按在腰间乌木剑鞘上的手指蓦地一紧，呼吸也跟着滞了一瞬。</p>
                  <p>亭外竹叶沙沙作响，过了好半晌，裴青舟才缓缓收回按剑的手，抬起那双布满血丝的眼看向你，声音比刚才哑了几分：「这把剑，他从不离身……你是从何处得来的？」</p>
                </div>
              </div>
              <div class="composer-mock">
                <span>输入角色言行，或切换场外指导...</span>
                <span class="tag mono">⌘↵</span>
              </div>
            </div>
            <aside class="glance-card" aria-label="Status and Record">
              <div>
                <h2>Status</h2>
                <div class="meter-mock">
                  <div class="row"><span>体力</span><span>40 / 100</span></div>
                  <div class="track"><div class="fill" style="width: 40%"></div></div>
                </div>
                <div class="meter-mock">
                  <div class="row"><span>交情</span><span>+4</span></div>
                  <div class="track"><div class="fill" style="width: 34%"></div></div>
                </div>
              </div>
              <div>
                <h2>Record</h2>
                <p style="font-size: var(--text-footnote); color: var(--ink-2); background: var(--alpha-1); padding: 10px 12px; border-radius: 8px;">
                  第 14 幕：你亮出李鹤托付的牛皮鞘旧短剑，裴青舟认出剑柄刻痕，戒备初解。
                </p>
              </div>
            </aside>
          </div>
        `;
      } else if (stageMode === "mobile") {
        stage.innerHTML = `
          <div class="overview-grid" style="align-items: center; padding-top: 20px;">
            <div class="state-col">
              <div class="state-label">
                <span>手机视图 (点击顶部标题可收起/拉起 Sheet)</span>
                <span class="spec-pill">390 × 812</span>
              </div>
              ${renderPhoneFrameHTML()}
            </div>
          </div>
        `;
      }

      // the desktop dialogs: content follows every render
      const dlg = document.getElementById("persona-dialog");
      if (dlg) {
        dlg.innerHTML = renderPickerHTML("dialog");
        if (stageMode === "picker" && !dlg.open) dlg.showModal();
        if (stageMode !== "picker" && dlg.open) dlg.close();
      }
      const sDlg = document.getElementById("stories-dialog");
      if (sDlg) {
        sDlg.innerHTML = renderStoriesModalHTML("dialog");
        if (stageMode === "stories" && !sDlg.open) sDlg.showModal();
        if (stageMode !== "stories" && sDlg.open) sDlg.close();
      }
    }

    // ───────── 4. Interactive Handlers ─────────
    function setStageMode(mode) {
      stageMode = mode;
      if (mode === "mobile") {
        phoneSheetOpen = true;
      }
      for (const m of ["overview", "desktop", "mobile", "stories", "picker"]) {
        const btn = document.getElementById(`btn-mode-${m}`);
        if (btn) btn.setAttribute("aria-pressed", String(m === mode));
      }
      renderAll();
    }

    function setNavStyle(style) {
      navStyle = style;
      for (const k of ["icons", "inline", "stack"]) {
        const el = document.getElementById(`btn-nav-${k}`);
        if (el) el.setAttribute("aria-pressed", String(style === k));
      }
      renderAll();
    }

    function setWritingCount(n) {
      writingCount = n;
      for (const k of [3, 4, 5]) {
        const el = document.getElementById(`btn-wc-${k}`);
        if (el) el.setAttribute("aria-pressed", String(k === n));
      }
      renderAll();
    }

    function toggleWritingShortMode() {
      writingShortMode = !writingShortMode;
      const btn = document.getElementById("btn-wmode-toggle");
      if (btn) {
        btn.setAttribute("aria-pressed", String(writingShortMode));
        btn.textContent = writingShortMode ? "策略:双字短签" : "策略:+N";
      }
      renderAll();
    }

    function setIconSet(set) {
      iconSet = set;
      const a = document.getElementById("btn-icon-a");
      const b = document.getElementById("btn-icon-b");
      if (a) a.setAttribute("aria-pressed", String(set === "a"));
      if (b) b.setAttribute("aria-pressed", String(set === "b"));
      renderAll();
    }

    function setStorySlice(n) {
      storySlice = n;
      for (const k of [4, 5, 2]) {
        document.getElementById(`btn-sc-${k}`).setAttribute("aria-pressed", String(k === n));
      }
      renderAll();
    }

    function toggleEmptyPersonas() {
      emptyPersonas = !emptyPersonas;
      document.getElementById("btn-personas-empty").setAttribute("aria-pressed", String(emptyPersonas));
      renderAll();
    }

    function togglePinned() {
      showPinned = !showPinned;
      document.getElementById("btn-pin-toggle").setAttribute("aria-pressed", String(showPinned));
      renderAll();
    }

    function toggleCard() {
      currentCardKey = currentCardKey === "wuxia" ? "yandao" : "wuxia";
      const btn = document.getElementById("btn-card-toggle");
      btn.textContent = `切卡片: ${CARDS[currentCardKey].title}`;
      btn.setAttribute("aria-pressed", String(currentCardKey === "yandao"));
      renderAll();
    }

    function toggleHeadLines() {
      headLines = headLines === 3 ? 2 : 3;
      const btn = document.getElementById("btn-head-lines");
      if (btn) {
        btn.setAttribute("aria-pressed", String(headLines === 3));
        btn.textContent = `卡头:${headLines}行`;
      }
      renderAll();
    }

    function toggleThemeInNav() {
      themeInNav = !themeInNav;
      document.getElementById("btn-theme-in-nav").setAttribute("aria-pressed", String(themeInNav));
      renderAll();
    }

    function toggleLangMode() {
      langZh = !langZh;
      document.getElementById("btn-lang-toggle").setAttribute("aria-pressed", String(langZh));
      renderAll();
    }

    function toggleTheme() {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
    }

    function togglePhoneSheet(force) {
      phoneSheetOpen = typeof force === "boolean" ? force : !phoneSheetOpen;
      renderAll();
    }

    function selectStory(id, context) {
      currentStoryId = id;
      if (context === "sheet" && stageMode === "mobile") {
        // #60: tapping a story on a phone closes the sheet back to the reader
        phoneSheetOpen = false;
        showToast("已切换故事并收起手机 Sheet (#60)");
      }
      renderAll();
    }

    function createNewStory() {
      const nextId = Math.max(0, ...stories.map((s) => s.id)) + 1;
      stories.unshift({
        id: nextId,
        title: null,
        turns: 0,
        agoEn: "just now",
        agoZh: "刚刚",
        starred: false,
        last: "",
        history: [],
      });
      currentStoryId = nextId;
      showToast("已新建故事 (默认显示 New story，0轮仅显示时间)");
      renderAll();
    }

    function openRenameDialog(id) {
      renamingStoryId = id;
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      const dlg = document.getElementById("rename-dialog");
      const inp = document.getElementById("rename-input");
      inp.value = s.title ?? "";
      dlg.showModal();
      requestAnimationFrame(() => inp.select());
    }

    function commitRename(e) {
      e.preventDefault();
      const s = stories.find((x) => x.id === renamingStoryId);
      const inp = document.getElementById("rename-input");
      if (s && inp) {
        const trimmed = inp.value.trim();
        s.title = trimmed ? trimmed : null;
      }
      document.getElementById("rename-dialog").close();
      renderAll();
    }

    function openDeleteDialog(id = currentStoryId) {
      deletingStoryId = id;
      document.getElementById("delete-dialog").showModal();
    }

    function commitDeleteStory() {
      const targetId = deletingStoryId ?? currentStoryId;
      if (stories.length > 1) {
        stories = stories.filter((s) => s.id !== targetId);
        selectedStoryIds.delete(targetId);
        if (currentStoryId === targetId) currentStoryId = stories[0].id;
        showToast("已删除故事");
      } else {
        showToast("至少保留最后一个故事");
      }
      deletingStoryId = null;
      document.getElementById("delete-dialog").close();
      renderAll();
    }

    // ───────── Stories Management Modal Handlers (#75 Step 2) ─────────
    function openStoriesModal(context) {
      openExportStoryId = null;
      if (context === "sheet") {
        storiesModalOpen = true;
        renderAll();
        return;
      }
      setStageMode("stories");
    }

    function closeStoriesModal() {
      const sDlg = document.getElementById("stories-dialog");
      if (sDlg && sDlg.open) sDlg.close();
      if (storiesModalOpen) {
        storiesModalOpen = false;
        renderAll();
      }
    }

    function onStoriesModalClose() {
      if (stageMode === "stories") setStageMode("desktop");
    }

    function filterStoriesModal(input, context) {
      storiesSearch = input.value;
      const shell = input.closest(".stories-shell");
      const list = shell?.querySelector(".stories-card-list");
      if (list) list.innerHTML = renderStoriesCardsHTML(context);
    }

    function setStoriesSearchQuery(q) {
      storiesSearch = q;
      renderAll();
    }

    function setStoriesFilter(f) {
      storiesFilter = f;
      renderAll();
    }

    function toggleStoryStar(id) {
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      s.starred = !s.starred;
      showToast(s.starred ? `已收藏「${s.title ?? "New story"}」（左栏置顶）` : "已取消收藏");
      renderAll();
    }

    function pickStoryFromModal(id, context) {
      currentStoryId = id;
      const s = stories.find((x) => x.id === id);
      if (context === "sheet") {
        storiesModalOpen = false;
        phoneSheetOpen = false;
      } else if (stageMode === "stories") {
        closeStoriesModal();
      }
      showToast(`已切换到故事：「${s?.title ?? "New story"}」`);
      renderAll();
    }

    function toggleExportBar(id) {
      openExportStoryId = openExportStoryId === id ? null : id;
      renderAll();
    }

    function exportStory(id, format) {
      const s = stories.find((x) => x.id === id);
      const name = s?.title ?? `story-${id}`;
      openExportStoryId = null;
      showToast(
        format === "md"
          ? `已导出当前主线阅读稿：${name}.md（开场白 + 玩家台词 + 正文）`
          : `已导出完整分支树备份：${name}.json`
      );
      renderAll();
    }

    function toggleBatchMode(force) {
      batchMode = typeof force === "boolean" ? force : !batchMode;
      if (!batchMode) selectedStoryIds.clear();
      renderAll();
    }

    function toggleSelectStory(id) {
      if (selectedStoryIds.has(id)) selectedStoryIds.delete(id);
      else selectedStoryIds.add(id);
      renderAll();
    }

    function selectPreset(kind) {
      if (kind === "clear") {
        selectedStoryIds.clear();
      } else if (kind === "empty") {
        for (const s of stories) if (s.turns === 0) selectedStoryIds.add(s.id);
      } else if (kind === "unnamed") {
        for (const s of stories) if (s.title === null && !s.starred) selectedStoryIds.add(s.id);
      }
      renderAll();
    }

    function deleteSelectedStories() {
      if (selectedStoryIds.size === 0) return;
      const count = selectedStoryIds.size;
      const remaining = stories.filter((s) => !selectedStoryIds.has(s.id));
      if (remaining.length === 0) {
        // Always keep at least one fresh story, matching library.newest()
        const freshId = Math.max(0, ...stories.map((s) => s.id)) + 1;
        stories = [{ id: freshId, title: null, turns: 0, agoEn: "just now", agoZh: "刚刚", starred: false, last: "", history: [] }];
      } else {
        stories = remaining;
      }
      if (!stories.some((s) => s.id === currentStoryId)) {
        currentStoryId = stories[0].id;
      }
      selectedStoryIds.clear();
      batchMode = false;
      showToast(`已批量清理 ${count} 个故事`);
      renderAll();
    }

    /** The Persona row: on the phone's sheet the picker is a second sheet; elsewhere the modal dialog. */
    function openPicker(context) {
      personaSearch = "";
      if (context === "sheet") {
        pickerOpen = true;
        renderAll();
        return;
      }
      setStageMode("picker");
    }

    function closePicker() {
      const dlg = document.getElementById("persona-dialog");
      if (dlg && dlg.open) dlg.close(); // onclose → onPickerClose
      if (pickerOpen) {
        pickerOpen = false;
        renderAll();
      }
    }

    /** The dialog closed (×, Escape, a click outside, a pick): the "picker" mode falls back to the desktop canvas. */
    function onPickerClose() {
      personaSearch = "";
      if (stageMode === "picker") setStageMode("desktop");
    }

    /** Typing filters the rows in place: the field is not re-rendered, so it keeps its focus and caret. */
    function filterPicker(input) {
      personaSearch = input.value;
      const shell = input.closest(".picker-shell");
      const list = shell?.querySelector(".picker-list");
      if (list) list.innerHTML = renderPickerRowsHTML();
    }

    function pickPersona(id) {
      pickedPersonaByCard[currentCardKey] = id;
      personaSearch = "";
      pickerOpen = false;
      const dlg = document.getElementById("persona-dialog");
      if (dlg && dlg.open) dlg.close();
      if (stageMode === "picker") setStageMode("desktop");
      else renderAll();
    }

    function goManagePersonas() {
      closePicker();
      showToast('跳转 openSettings("personas")：设置页的玩家人设（新建 / 改写 / 删除 / 全文）');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.setAttribute("data-show", "true");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.setAttribute("data-show", "false"), 2200);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/"/g, "&quot;");
    }

    renderAll();
  </script>
</body>
</html>
