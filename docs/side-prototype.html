<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Session 左栏重构 · 三态静态与交互原型 (Issue #77)</title>
  <!--
    ═══════════════════════════════════════════════════════════════════════════════
    SESSION CARD REFACTOR PROTOTYPE (ISSUE #77, WITH #75 STEP 1, #67, #70)
    States: 1. desktop left card · 2. phone sheet · 3. the persona picker open (dialog)
    ═══════════════════════════════════════════════════════════════════════════════

    1. CARD GEOMETRY & ELASTIC ALLOCATION (`.side` = 15rem / 240px, net 192px):
       - Only `section.stories` takes elastic height (`flex: 1`).
       - The other 4 zones (`.cardhead`, `.persona`, `.writing`, `nav.tools`, plus
         optional `.pinned`) stay compact at their natural 1-2 line height, anchored
         cleanly below `Stories` instead of leaving a dead void at the bottom of the card.

    2. FIVE ZONES:
       - Zone 1 (卡头 `.cardhead` vs Mobile `.topbar .title`):
         * Desktop `.cardhead`: Title + persistent entry icon on the right (button
           affordance at rest, not hover-only) + clamped summary. DECIDED: 3 lines
           (`-webkit-line-clamp: 3`, ~39 CJK chars: the opening sentence whole), paid for
           by Stories showing 4 rows instead of 5; the dock's 卡头 toggle shows 2 lines for
           comparison.
         * Mobile separation of roles: `.topbar .title` pulls up the Session sheet
           (styled with a down/sheet chevron and current story subtitle), whereas
           inside the sheet `.cardhead` is a framed card banner that enters `CardPage`.
       - Zone 2 (Stories `section.stories`):
         * DECIDED: 4 recent rows, NO nested `overflow-y: auto` scrollbar. 5 rows fit a
           688px card only when nothing else grows: at a 700px viewport (652px card) 5 rows
           leave 10px of air and overflow by 55px once a pin is armed; 4 rows keep ~30px of
           air there and absorb the pin. 4 is also what buys the 3-line summary above.
         * Row shape (#75 Step 1): `grid-template-columns: minmax(0, 1fr)` (fixes #40/#75
           horizontal overflow); main line `title ?? "New story"`, sub line
           `N turns · 16 minutes ago` (when `turns === 0`, only time is shown).
         * Rename via `<dialog class="confirm">` + `.field` input (pencil button or
           double-click row).
         * Final row: `"全部 N 个故事 ›"` opens the #75 Stories management page.
       - Zone 3 (Persona `section.persona` + the picker `dialog.picker`):
         * Sidebar row: unified `.chosen` row with `<span class="chip">卡片默认</span>`
           (or the picked persona's name) + right chevron `›`. Never disabled when
           `people().length === 0`.
         * DECIDED: the row opens a picker dialog, not a popover. A popover is pinned to
           the 176px column or hangs out of the card unaligned, and a long list is a chore
           to scan on a phone; a dialog has its own width and a search field. Desktop: a
           centred `<dialog>` 25rem wide (the confirm dialogs' mechanism); phone: a sheet
           rising from the bottom over the session sheet (chrome.css `.sheet`).
         * Inside: head (选择人设 · the card's name · 管理人设 ↗ · ×), a search field
           (name and text) with the count, then two-line rows (name, the text's first
           line); `卡片默认` is the first row, the pick in force carries a check. With no
           personas the list is `卡片默认` plus a hint to make one on the settings page.
         * NOT here: reading a persona whole, stars, editing. Those are the settings
           page's 玩家人设 (master list + detail editor, which exists); the card's own
           persona text does not reach the client (`GET /card` leaves it out; the card
           page is where it would belong), so `卡片默认` shows a fixed caption.
         * `As the card has it` becomes `卡片默认`, so it no longer collides with
           Writing's `跟随卡片`.
       - Zone 4 (Writing `section.writing`):
         * Unified `.chosen` row: `.chips` on ONE line (`flex-flow: row nowrap`) + right
           chevron `›`. DECIDED: up to 3 chips show whole, 4 or 5 collapse to the first 2
           + `+N` (the order is switches.ts's: pov, echo, agency, verbosity, supplement, so
           the two that set the voice stay visible; the row's `title` lists all). The chip
           budget is 176px (192 - 12 chevron - 4 gap); a 4-char chip is 55px, so three of
           them are 172px. The supplement chip is therefore `本卡补充` (4 chars), the name
           the Writing page already uses: `含本卡补充` (66px) beside two 4-char chips is
           183px and spills. 2-char short tags stay in the dock for comparison only: all 5
           still spill (186px) and `仅输` / `二称` read as nothing.
           Uses concrete default items (`第二人称` · `转述言行` · `仅限输入`) instead of
           colliding on `"跟随卡片"`.
       - Zone 5 (底部页面导航 `nav.tools`):
         * Replaces coding icons (`git-branch`, `terminal-window`) with narrative/inspection
           icons (`ph/tree-structure` or `ph/path`, `ph/list-magnifying-glass` or
           `ph/magnifying-glass`).
         * DECIDED: icons only, one row, no labels: 时间线 · 检查器 on the left, #70's
           theme toggle · 设置 on the right, four 28px icons in 192px. The client dropped
           `data-hint` tooltips in #78, so the icons carry the meaning alone (`aria-label`
           names them for readers). The two labelled layouts stay in the dock for reference:
           - `带字同行` (Inline: left two with text `时间线` / `检查器`, right `⚙` Settings gear)
           - `竖排三行` (Stack: `时间线` / `检查器` / `设置` as 3 full-width rows)
    ═══════════════════════════════════════════════════════════════════════════════
  -->
  <style>
    /* ───────── 1. Tokens: exact match with packages/client/src/tokens.css ───────── */
    :root {
      color-scheme: light dark;

      --surface-0: light-dark(#f9f9f7, #0b0b0b);
      --surface-1: light-dark(#fcfcfb, #151515);
      --surface-2: light-dark(#ffffff, #1a1a19);
      --surface-3: light-dark(#ffffff, #20201f);

      --ink: light-dark(#151515, #f5f5f5);
      --ink-2: light-dark(#525252, #a3a3a3);
      --ink-3: light-dark(#8a8a8a, #6f6f6f);

      --alpha-1: light-dark(rgb(20 20 20 / 0.05), rgb(255 255 255 / 0.05));
      --alpha-2: light-dark(rgb(20 20 20 / 0.1), rgb(255 255 255 / 0.09));
      --alpha-3: light-dark(rgb(20 20 20 / 0.2), rgb(255 255 255 / 0.18));
      --alpha-4: light-dark(rgb(20 20 20 / 0.35), rgb(255 255 255 / 0.3));
      --line: var(--alpha-2);
      --line-strong: var(--alpha-3);
      --fill: var(--alpha-2);
      --fill-hover: light-dark(rgb(20 20 20 / 0.14), rgb(255 255 255 / 0.14));
      --ghost-hover: var(--alpha-1);
      --ghost-active: var(--alpha-2);

      --primary: var(--ink);
      --primary-ink: var(--surface-1);
      --danger: light-dark(#dc2626, #f87171);
      --ok: light-dark(#1f7a3f, #4ade80);
      --ok-soft: light-dark(rgb(31 122 63 / 0.22), rgb(74 222 128 / 0.25));
      --ok-wash: light-dark(rgb(34 197 94 / 0.12), rgb(187 247 208 / 0.09));
      --warn: light-dark(#b45309, #fbbf24);
      --warn-soft: light-dark(rgb(217 119 6 / 0.12), rgb(251 191 36 / 0.14));
      --scrim: light-dark(rgb(0 0 0 / 0.2), rgb(0 0 0 / 0.5));
      --ring: var(--alpha-4);

      --hairline: 1px;
      --shadow-1:
        0 1px 2px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 2px 8px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-2:
        0 2px 4px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 6px 16px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-pop:
        inset 0 0 0 1px light-dark(transparent, rgb(255 255 255 / 0.1)),
        0 0 0 1px light-dark(var(--line), transparent),
        0 8px 24px light-dark(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.65)),
        0 2px 6px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.45));
      --shadow-composer:
        0 4px 20px light-dark(rgb(0 0 0 / 0.035), rgb(0 0 0 / 0.4)),
        inset 0 0 0 1px var(--line);

      --radius-sm: 4px;
      --radius: 8px;
      --radius-card: 12px;
      --radius-composer: 14px;
      --radius-dialog: 16px;
      --radius-pill: 999px;

      --control: 32px;
      --control-sm: 24px;
      --icon: 20px;
      --icon-sm: 16px;

      --font-sans:
        system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --text-caption: 0.6875rem;   /* 11px */
      --text-footnote: 0.75rem;    /* 12px */
      --text-body: 0.875rem;       /* 14px */
      --text-heading: 0.9375rem;    /* 15px */
      --text-prose: 1rem;          /* 16px */
      --text-field: var(--text-body);
      --text-title: 1.25rem;       /* 20px */
      --leading-tight: 1.25;
      --leading-body: 1.45;
      --leading-prose: 1.75;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --fade: 24px;

      --dur-1: 60ms;
      --dur-2: 120ms;
      --dur-3: 200ms;
      --dur-4: 300ms;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    @media (resolution >= 2x) {
      :root { --hairline: 0.5px; }
    }

    * { box-sizing: border-box; }
    html {
      height: 100%;
      font-size: 16px; /* 1rem = 16px so 15rem .side = 240px (net 192px) as in reader.css */
    }
    body {
      margin: 0;
      height: 100%;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      color: var(--ink);
      background: var(--surface-0);
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
    }
    button {
      cursor: pointer;
      border-radius: var(--radius);
      transition: background var(--dur-3) var(--ease), color var(--dur-3) var(--ease);
    }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }
    button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    h1, h2, h3, p, ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* ───────── 2. Shared Primitives (.icon, .chip, .tag, .btn, .scroller, [data-hint]) ───────── */
    .scroller {
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color var(--dur-3) var(--ease);
    }
    .scroller:hover,
    .scroller:focus-within {
      scrollbar-color: var(--alpha-2) transparent;
    }

    .icon {
      width: var(--control);
      height: var(--control);
      display: inline-grid;
      place-items: center;
      color: var(--ink-2);
      flex: none;
    }
    .icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .icon svg {
      width: var(--icon);
      height: var(--icon);
    }
    .icon.sm {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: var(--radius-sm);
    }
    .icon.sm svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }

    .chip {
      height: var(--control-sm);
      padding: 0 9px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .chip.state {
      background: none;
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      color: var(--ink);
    }
    .chip.danger {
      background: var(--danger);
      color: #fff;
    }

    .tag {
      flex: none;
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: var(--radius-sm);
      background: var(--alpha-1);
      color: var(--ink-3);
      font-size: var(--text-caption);
      white-space: nowrap;
    }
    .tag.ok {
      background: var(--ok-soft);
      color: var(--ok);
      font-weight: 600;
    }
    .tag.mono {
      font-family: var(--font-mono);
    }

    .btn {
      height: var(--control);
      padding: 0 12px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      font-size: var(--text-footnote);
      font-weight: 550;
      color: var(--ink);
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) {
      background: var(--alpha-1);
    }
    .btn.sm {
      height: var(--control-sm);
      padding: 0 9px;
      border-radius: var(--radius-sm);
      font-size: var(--text-caption);
    }
    .btn.ghost {
      background: none;
      box-shadow: none;
      color: var(--ink-2);
    }
    .btn.ghost:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .btn svg {
      width: 14px;
      height: 14px;
    }

    .field {
      box-sizing: border-box;
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border: 0;
      border-radius: var(--radius);
      background: var(--alpha-1);
      color: inherit;
      font: inherit;
      font-size: var(--text-field);
      outline: none;
    }
    .field:focus {
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
    }

    @media (hover: hover) {
      [data-hint] {
        position: relative;
      }
      [data-hint]::after {
        content: attr(data-hint);
        position: absolute;
        bottom: calc(100% + 6px);
        left: 50%;
        translate: -50% 0;
        padding: 3px 8px;
        border-radius: var(--radius-sm);
        background: var(--ink);
        color: var(--surface-1);
        font-size: var(--text-caption);
        line-height: 1.4;
        white-space: nowrap;
        pointer-events: none;
        display: none;
        z-index: 20;
      }
      [data-hint]:is(:hover, :focus-visible)::after {
        display: block;
      }
    }

    /* ───────── 3. Refactored Session Card Styles (Issue #77) ───────── */
    .side {
      box-sizing: border-box;
      width: 15rem; /* 240px outer, 200px inner column */
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding: var(--space-5);
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color var(--dur-3) var(--ease);
    }
    .side:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    .session {
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex: 1;
      min-height: 0;
    }
    .session section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* Section headers: natural Chinese caption by default (no rigid all-caps spacing);
       compact 22px height with tight 22×22 action icon cluster on the right */
    .session h2 {
      display: flex;
      align-items: center;
      gap: 2px;
      margin: 0;
      min-height: 22px;
      font-size: var(--text-caption);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink-3);
    }
    .session[data-lang="en"] h2 {
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .session h2 .icon {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 5px;
      color: var(--ink-3);
    }
    .session h2 .icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .session h2 .icon.danger-hover:hover:not(:disabled) {
      color: var(--danger);
    }
    .session h2 .icon svg {
      width: 13px;
      height: 13px;
    }
    .session h2 .icon:first-of-type {
      margin-left: auto;
    }
    .session h2 .icon:last-of-type {
      margin-right: -3px;
    }

    /* ── Zone 1: 卡头 (.cardhead) ──
       Desktop: persistent entry icon beside title (button feel at rest, not hover-only),
       summary kept with -webkit-line-clamp: 2 (~26 CJK chars). */
    .cardhead {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: calc(-1 * var(--space-2));
      padding: var(--space-2);
      border-radius: var(--radius-card);
      text-align: left;
      transition: background var(--dur-2) var(--ease);
    }
    .cardhead:hover {
      background: var(--ghost-hover);
    }
    .cardhead-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-width: 0;
    }
    .cardhead h1 {
      margin: 0;
      font-size: var(--text-title);
      font-weight: 650;
      line-height: var(--leading-tight);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* Persistent entry icon badge beside the title: compact 20×20 on desktop, pill with label in mobile sheet */
    .cardhead .enter-badge {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-width: 20px;
      height: 20px;
      padding: 0 4px;
      border-radius: 5px;
      background: var(--alpha-1);
      color: var(--ink-3);
      font-size: var(--text-caption);
      font-weight: 500;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), translate var(--dur-2) var(--ease);
    }
    .cardhead .enter-badge svg {
      width: 11px;
      height: 11px;
    }
    .cardhead:hover .enter-badge {
      background: var(--alpha-2);
      color: var(--ink);
      translate: 1px 0;
    }
    .cardhead p {
      margin: 0;
      color: var(--ink-2);
      font-size: var(--text-footnote);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3; /* decided: the opening sentence whole (~39 CJK chars); 4 story rows pay for the third line */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .session[data-head-lines="2"] .cardhead p {
      -webkit-line-clamp: 2;
    }

    /* Mobile Sheet's .cardhead: sits directly at the top of the sheet (no redundant "SESSION" header bar) */
    .phone-sheet .cardhead {
      margin: calc(-1 * var(--space-1)) calc(-1 * var(--space-2)) 0;
      padding: var(--space-2);
    }
    .phone-sheet .cardhead .enter-badge {
      height: 22px;
      padding: 0 7px;
    }

    /* ── Zone 2: Stories (section.stories) ──
       4 stories with balanced breathing room above and below:
       margin-block: auto centers the Stories block between .cardhead and the bottom preference group,
       eliminating the single large void underneath while giving comfortable air above and below. */
    .session section.stories {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
      margin-bottom: auto;
      padding-block: 4px;
    }
    .phone-sheet .session section.stories {
      padding-block: 2px;
    }
    .stories ul {
      margin: 0 calc(-1 * var(--space-2));
      padding: 0;
      list-style: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 4px;
      /* No max-height: 11rem, no overflow-y: auto */
    }
    .story {
      display: grid;
      grid-template-columns: minmax(0, 1fr); /* #75 Defect 1 fix: prevents long text from widening ul */
      gap: 2px;
      box-sizing: border-box;
      width: 100%;
      padding: 6px var(--space-2);
      border-radius: var(--radius);
      text-align: left;
    }
    .story:hover:not(:disabled) {
      background: var(--ghost-hover);
    }
    .story[aria-current="true"] {
      background: var(--alpha-1);
    }
    .story .first-row {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .story .first {
      flex: 1;
      min-width: 0;
      font-size: var(--text-body);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story[aria-current="true"] .first {
      font-weight: 600;
    }
    .story .first.unnamed {
      color: var(--ink-2);
    }
    .story .star-mark {
      flex: none;
      width: 11px;
      height: 11px;
      color: var(--ink-3);
      opacity: 0.75;
    }
    .story .meta {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      font-size: var(--text-caption);
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* "全部 N 个故事" entry row at the end of Stories */
    .stories-all {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      align-self: stretch;
      margin: 2px calc(-1 * var(--space-2)) 0;
      padding: 5px var(--space-2);
      border-radius: var(--radius);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 500;
      text-align: left;
    }
    .stories-all:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .stories-all svg {
      flex: none;
      width: 12px;
      height: 12px;
      color: var(--ink-3);
      opacity: 0.75;
      transition: translate var(--dur-2) var(--ease), color var(--dur-2) var(--ease), opacity var(--dur-2) var(--ease);
    }
    .stories-all:hover svg {
      color: var(--ink);
      opacity: 1;
      translate: 1px 0;
    }

    /* ── Zone 3 & Zone 4: Unified Single-Line Row for Persona & Writing (.session .chosen) ──
       Single-line chips on the left (3 four-char chips fit on 1 line; 4–5 chips use +N or 2-char short tags), right chevron › */
    .session .chosen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      align-self: stretch;
      margin: -2px calc(-1 * var(--space-2));
      padding: 4px var(--space-2);
      box-sizing: border-box;
      border-radius: var(--radius);
      text-align: left;
    }
    .session .chosen:hover:not(:disabled) {
      background: var(--ghost-hover);
    }
    .session .chosen .chips {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-flow: row nowrap;
      align-items: center;
      gap: 3.5px;
      overflow: hidden;
    }
    .session .chosen .chip {
      height: 22px;
      padding: 0 5.5px;
      font-size: var(--text-caption);
      color: var(--ink-2);
      flex: none;
    }
    .session .chosen .chip.more {
      padding: 0 5.5px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-3);
      background: var(--alpha-2);
    }
    .session .chosen .chev {
      flex: none;
      width: 12px;
      height: 12px;
      color: var(--ink-3);
      opacity: 0.75;
      transition: translate var(--dur-2) var(--ease), color var(--dur-2) var(--ease), opacity var(--dur-2) var(--ease);
    }
    .session .chosen:hover:not(:disabled) .chev {
      color: var(--ink);
      opacity: 1;
      translate: 1px 0;
    }

    /* Armed Pin section (when present) */
    .pinned p {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin: 0;
      color: var(--ink-2);
      font-size: var(--text-footnote);
      text-align: left;
    }
    .pinned svg {
      flex: none;
      width: 14px;
      height: 14px;
      color: var(--ink-3);
    }
    .pinned span {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Zone 5: 底部页面导航 (nav.tools) ──
       Default: data-nav="icons" (紧凑同行 · 3个纯图标，不带文字解释)
       Also keeps inline (带字) & stack (竖排) in dock for reference */
    .tools {
      padding-top: var(--space-2);
      box-shadow: inset 0 var(--hairline) 0 var(--line);
    }
    .tools[data-nav="icons"] {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-inline: -4px;
    }
    .tools[data-nav="icons"] .icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      color: var(--ink-3);
    }
    .tools[data-nav="icons"] .icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .tools[data-nav="icons"] .icon svg {
      width: 15px;
      height: 15px;
    }
    .tools[data-nav="icons"] .nav-right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .tools[data-nav="inline"] {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-inline: calc(-1 * var(--space-2));
    }
    .tools[data-nav="inline"] .nav-btn {
      height: 28px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink-2);
      font-size: var(--text-caption);
      font-weight: 500;
      white-space: nowrap;
    }
    .tools[data-nav="inline"] .nav-btn:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .tools[data-nav="inline"] .nav-btn svg {
      width: 14px;
      height: 14px;
      color: var(--ink-3);
      flex: none;
    }
    .tools[data-nav="inline"] .nav-btn:hover:not(:disabled) svg {
      color: var(--ink);
    }
    .tools[data-nav="inline"] .nav-right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .tools[data-nav="inline"] .icon {
      width: 28px;
      height: 28px;
    }
    .tools[data-nav="inline"] .icon svg {
      width: 15px;
      height: 15px;
    }

    /* Variant B: 竖排三行 (Stack) */
    .tools[data-nav="stack"] {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-inline: calc(-1 * var(--space-2));
    }
    .tools[data-nav="stack"] .nav-btn {
      width: 100%;
      height: 32px;
      padding: 0 var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 500;
      text-align: left;
    }
    .tools[data-nav="stack"] .nav-btn:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .tools[data-nav="stack"] .nav-btn svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
      color: var(--ink-3);
      flex: none;
    }
    .tools[data-nav="stack"] .nav-btn:hover:not(:disabled) svg {
      color: var(--ink);
    }
    .tools[data-nav="stack"] .nav-btn .sub {
      margin-left: auto;
      font-size: var(--text-caption);
      color: var(--ink-3);
    }
    .tools[data-nav="stack"] .stack-row {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .tools[data-nav="stack"] .stack-row .nav-btn {
      flex: 1;
    }

    /* ───────── 4. Persona Picker (dialog.picker; the phone's .picker-sheet; the overview's .picker-static) ─────────
       Head, search, two-line rows. The shell is a flex column; only the list scrolls. */
    dialog.picker {
      width: min(25rem, calc(100vw - 2 * var(--space-4)));
      max-height: min(32rem, calc(100dvh - 2 * var(--space-5)));
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      outline: none;
      font-size: var(--text-body);
      line-height: var(--leading-body);
    }
    dialog.picker::backdrop {
      background: var(--scrim);
    }
    dialog.picker[open] {
      display: flex;
    }
    .picker-static {
      width: 25rem;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      display: flex;
    }
    .picker-shell {
      flex: 1;
      min-width: 0;
      min-height: 0;
      max-height: min(32rem, calc(100dvh - 2 * var(--space-5))); /* as tall as its rows, then the list scrolls */
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4);
      text-align: left;
    }
    .picker-sheet .picker-shell {
      height: 100%;
    }
    .picker-head {
      flex: none;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .picker-head h3 {
      font-size: var(--text-heading);
      font-weight: 650;
    }
    .picker-head .spacer {
      flex: 1;
    }
    .picker-search {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-box {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 var(--space-2) 0 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-box svg {
      flex: none;
      width: 14px;
      height: 14px;
      color: var(--ink-3);
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      height: 100%;
      font-size: var(--text-footnote);
      outline: none;
    }
    .picker-list {
      flex: 1;
      min-height: 0;
      margin: 0 calc(-1 * var(--space-2));
      padding: 0 var(--space-2);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .picker-shell .item {
      flex: none;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      column-gap: var(--space-2);
      row-gap: 1px;
      align-items: center;
      width: 100%;
      padding: 6px var(--space-2);
      border-radius: var(--radius);
      text-align: left;
    }
    .picker-shell .item:hover,
    .picker-shell .item:focus-visible {
      background: var(--ghost-hover);
      outline: none;
    }
    .picker-shell .item .name {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .picker-shell .item[aria-checked="true"] .name {
      font-weight: 600;
      color: var(--primary);
    }
    .picker-shell .item .check {
      grid-column: 2;
      grid-row: 1 / span 2;
      width: 14px;
      height: 14px;
      color: var(--ink);
      visibility: hidden;
    }
    .picker-shell .item[aria-checked="true"] .check {
      visibility: visible;
    }
    .picker-shell .item .bio {
      grid-column: 1;
      font-size: var(--text-caption);
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .picker-shell .item.default .name::after {
      content: "随卡";
      margin-left: 6px;
      padding: 0 5px;
      border-radius: var(--radius-sm);
      background: var(--alpha-1);
      color: var(--ink-3);
      font-size: var(--text-caption);
      font-weight: 500;
      vertical-align: 1px;
    }
    .picker-list hr {
      flex: none;
      margin: 2px var(--space-2);
      border: 0;
      height: var(--hairline);
      background: var(--line);
    }
    .picker-empty {
      margin: var(--space-1) 0;
      padding: var(--space-4);
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      text-align: center;
      color: var(--ink-3);
      font-size: var(--text-footnote);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-2);
    }
    /* the phone: the picker or stories manager is a second sheet over the session sheet */
    .phone-scrim.picker-scrim,
    .phone-scrim.stories-scrim {
      z-index: 11;
    }

    /* ───────── 4b. Stories Management Sheet (dialog.stories-modal; phone .stories-sheet; overview .stories-static) ─────────
       Larger than the persona picker (35rem / 560px on desktop vs 25rem), holding rich story cards with:
       1. Star toggle, title (or "New story"), current badge, and inline action icons (Rename, Export, Delete)
       2. Content preview: last player input on head, OR dynamic full-text search snippet with <mark> highlight & turn badge
       3. Metadata: turns count + last updated time
       Plus top full-text search bar, All / Starred filter pills, and Batch Cleanup mode (0-turn empty / unnamed & unstarred). */
    dialog.stories-modal {
      width: min(35rem, calc(100vw - 2 * var(--space-4)));
      max-height: min(42rem, calc(100dvh - 2 * var(--space-5)));
      margin: auto;
      padding: 0;
      border: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      outline: none;
      font-size: var(--text-body);
      line-height: var(--leading-body);
    }
    dialog.stories-modal::backdrop {
      background: var(--scrim);
    }
    dialog.stories-modal[open] {
      display: flex;
    }
    .stories-static {
      width: 35rem;
      max-width: calc(100vw - 2 * var(--space-5));
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      display: flex;
    }
    .stories-shell {
      flex: 1;
      min-width: 0;
      min-height: 0;
      max-height: min(42rem, calc(100dvh - 2 * var(--space-5)));
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      padding: var(--space-4);
      text-align: left;
    }
    .stories-sheet .stories-shell {
      height: 100%;
      max-height: none;
    }
    .stories-toolbar {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .stories-search-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .stories-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
    }
    .filter-pills {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .filter-pill {
      height: 26px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      font-size: var(--text-footnote);
      font-weight: 500;
      color: var(--ink-2);
      background: var(--alpha-1);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .filter-pill:hover {
      background: var(--alpha-2);
      color: var(--ink);
    }
    .filter-pill[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
      font-weight: 600;
    }
    .filter-pill svg {
      width: 12px;
      height: 12px;
    }
    .filter-pill .cnt {
      font-family: var(--font-mono);
      font-size: var(--text-caption);
      opacity: 0.75;
    }
    .search-hints {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      font-size: var(--text-caption);
      color: var(--ink-3);
    }
    .search-hint-chip {
      height: 20px;
      padding: 0 6px;
      border-radius: var(--radius-sm);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-caption);
    }
    .search-hint-chip:hover {
      background: var(--alpha-2);
      color: var(--ink);
    }
    /* Batch cleanup quick-select bar */
    .batch-bar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex-wrap: wrap;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      font-size: var(--text-footnote);
    }
    .batch-bar .presets {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .batch-bar .preset-btn {
      height: 24px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
      font-size: var(--text-caption);
      color: var(--ink-2);
      font-weight: 500;
    }
    .batch-bar .preset-btn:hover {
      color: var(--ink);
      background: var(--ghost-hover);
    }
    /* Story card list inside the modal */
    .stories-card-list {
      flex: 1;
      min-height: 0;
      margin: 0 calc(-1 * var(--space-2));
      padding: 2px var(--space-2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .story-card {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-card);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      cursor: pointer;
      transition: background var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
    }
    .story-card:hover {
      background: var(--ghost-hover);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
    }
    .story-card[aria-current="true"] {
      background: var(--alpha-1);
      box-shadow: inset 0 0 0 1.5px var(--line-strong);
    }
    .story-card[data-selected="true"] {
      background: var(--warn-soft);
      box-shadow: inset 0 0 0 1.5px var(--warn);
    }
    .story-card .batch-check {
      flex: none;
      margin-top: 3px;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1.5px var(--ink-3);
      display: grid;
      place-items: center;
      color: var(--surface-1);
      background: var(--surface-3);
    }
    .story-card[data-selected="true"] .batch-check {
      background: var(--ink);
      box-shadow: none;
    }
    .story-card .batch-check svg {
      width: 11px;
      height: 11px;
    }
    .story-card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .story-card-top {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .story-card-top .star-btn {
      flex: none;
      width: 22px;
      height: 22px;
      margin-left: -3px;
      border-radius: var(--radius-sm);
      display: inline-grid;
      place-items: center;
      color: var(--ink-3);
    }
    .story-card-top .star-btn:hover {
      background: var(--alpha-2);
      color: var(--ink);
    }
    .story-card-top .star-btn[aria-pressed="true"] {
      color: var(--warn);
    }
    .story-card-top .star-btn svg {
      width: 14px;
      height: 14px;
    }
    .story-card-top .title-text {
      font-weight: 600;
      font-size: var(--text-body);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .story-card-top .title-text.unnamed {
      color: var(--ink-2);
      font-weight: 500;
    }
    .story-card-top .card-actions {
      margin-left: auto;
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .story-card-top .card-actions .icon.sm {
      width: 24px;
      height: 24px;
      color: var(--ink-3);
    }
    .story-card-top .card-actions .icon.sm:hover {
      color: var(--ink);
      background: var(--alpha-2);
    }
    .story-card-top .card-actions .icon.sm.danger-hover:hover {
      color: var(--danger);
      background: light-dark(rgb(220 38 38 / 0.1), rgb(248 113 113 / 0.14));
    }
    .story-card-top .card-actions .icon.sm svg {
      width: 14px;
      height: 14px;
    }
    /* Row 2: Content preview (last player input OR matched full-text search snippet) */
    .story-card-preview {
      font-size: var(--text-footnote);
      line-height: 1.45;
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .story-card-preview.empty-preview {
      color: var(--ink-3);
      font-style: italic;
    }
    .story-card-preview .hit-badge {
      display: inline-flex;
      align-items: center;
      height: 18px;
      padding: 0 5px;
      margin-right: 5px;
      border-radius: var(--radius-sm);
      background: var(--warn-soft);
      color: var(--warn);
      font-size: var(--text-caption);
      font-weight: 600;
      vertical-align: baseline;
    }
    .story-card-preview mark {
      background: var(--warn-soft);
      color: var(--ink);
      font-weight: 600;
      padding: 0 2px;
      border-radius: 3px;
    }
    /* Row 3: Metadata (turns + last updated time + export popover trigger status) */
    .story-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-caption);
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .story-card-meta .dot-sep {
      opacity: 0.5;
    }
    /* Inline Export mini-bar when user clicks Export on a card */
    .export-inline {
      margin-top: 4px;
      padding: 6px 8px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--text-caption);
      color: var(--ink-2);
    }
    .export-inline .export-btns {
      display: inline-flex;
      gap: 6px;
    }
    .stories-footer {
      flex: none;
      padding-top: var(--space-2);
      box-shadow: inset 0 var(--hairline) 0 var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--text-footnote);
      color: var(--ink-2);
    }

    /* ───────── 5. Mobile Frame & Sheet (.topbar + .sheet) ───────── */
    .phone-frame {
      width: 390px;
      height: 688px;
      border-radius: 30px;
      background: var(--surface-1);
      box-shadow:
        0 0 0 5px light-dark(#dcdcd6, #242423),
        0 16px 40px rgb(0 0 0 / 0.22);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      flex: none;
    }
    /* Mobile .topbar: role is pulling up the Session sheet (distinct from .cardhead) */
    .topbar {
      height: 52px;
      padding: 0 var(--space-2) 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      background: var(--surface-1);
      box-shadow: inset 0 calc(-1 * var(--hairline)) 0 var(--line);
      flex: none;
    }
    .topbar .title-trigger {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding: 4px 8px;
      margin-left: -8px;
      border-radius: var(--radius);
      text-align: left;
    }
    .topbar .title-trigger:hover {
      background: var(--ghost-hover);
    }
    .topbar .title-trigger h1 {
      font-size: var(--text-heading);
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar .title-trigger .story-sub {
      font-size: var(--text-caption);
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 9rem;
    }
    .topbar .title-trigger svg {
      flex: none;
      width: 14px;
      height: 14px;
      color: var(--ink-3);
    }
    .phone-scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 10;
      transition: opacity var(--dur-3) var(--ease);
    }
    .phone-scrim[data-open="false"] {
      opacity: 0;
      pointer-events: none;
    }
    .phone-sheet {
      position: absolute;
      inset: 52px 0 0;
      background: var(--surface-3);
      border-radius: var(--radius-dialog) var(--radius-dialog) 0 0;
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform var(--dur-4) var(--ease);
    }
    .phone-scrim[data-open="false"] .phone-sheet {
      transform: translateY(100%);
    }
    .phone-sheet .session {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: var(--space-4) var(--space-4) var(--space-3);
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color var(--dur-3) var(--ease);
    }
    .phone-sheet .session:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    /* ───────── 6. Stage Modes: 三态同屏 (Overview) vs 桌面画布 (Desktop) vs 手机视口 (Mobile) ───────── */
    .stage {
      width: 100vw;
      height: 100dvh;
      overflow: auto;
      background: var(--surface-0);
    }

    /* Mode 1: 三态同屏 (Overview: Desktop Left Card + Mobile Sheet + the left card with its persona menu open) */
    .overview-grid {
      min-height: 100dvh;
      padding: 14px 20px 58px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .state-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .state-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 4px;
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-2);
    }
    .state-label .spec-pill {
      font-family: var(--font-mono);
      font-weight: 500;
      color: var(--ink-3);
      background: var(--alpha-1);
      padding: 2px 6px;
      border-radius: var(--radius-sm);
    }
    .overview-side-host {
      height: 688px;
      display: flex;
    }

    /* Mode 2: 桌面三栏画布 (Desktop Full Reader Canvas) */
    .desktop-canvas {
      width: 100%;
      height: 100dvh;
      display: grid;
      grid-template-columns: 15rem minmax(0, 1fr) 19rem;
      grid-template-rows: minmax(0, 1fr);
      gap: var(--space-5);
      padding: var(--space-5);
    }
    .reader-panel {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      overflow: hidden;
    }
    .reader-flow {
      flex: 1;
      max-width: 42rem;
      margin: 0 auto;
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      overflow-y: auto;
    }
    .said-bubble {
      align-self: flex-start;
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      font-size: 15px;
      line-height: 1.6;
    }
    .prose-turn p {
      font-size: var(--text-prose);
      line-height: var(--leading-prose);
      margin-bottom: var(--space-3);
    }
    .composer-mock {
      max-width: 42rem;
      width: calc(100% - 2 * var(--space-6));
      margin: 0 auto var(--space-5);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-composer);
      background: var(--surface-3);
      box-shadow: var(--shadow-composer);
      color: var(--ink-3);
      font-size: var(--text-body);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .glance-card {
      width: 19rem;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      overflow-y: auto;
    }
    .glance-card h2 {
      font-size: var(--text-caption);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: var(--space-2);
    }
    .meter-mock {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: var(--space-3);
    }
    .meter-mock .row {
      display: flex;
      justify-content: space-between;
      font-size: var(--text-body);
    }
    .meter-mock .track {
      height: 6px;
      border-radius: 3px;
      background: var(--alpha-2);
      overflow: hidden;
    }
    .meter-mock .fill {
      height: 100%;
      background: var(--ink);
    }

    /* Native Dialogs: Rename / Delete Confirm */
    dialog.confirm {
      width: min(22rem, calc(100% - 2 * var(--space-4)));
      margin: auto;
      padding: var(--space-4);
      border: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      outline: none;
    }
    dialog.confirm::backdrop {
      background: var(--scrim);
    }
    dialog.confirm p {
      margin: 0 0 var(--space-3);
      font-weight: 600;
    }
    dialog.confirm .sub-hint {
      margin: -4px 0 var(--space-3);
      font-size: var(--text-footnote);
      font-weight: 400;
      color: var(--ink-3);
    }
    dialog.confirm .row {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    dialog.confirm .chip {
      height: var(--control);
      padding: 0 var(--space-4);
      font-size: var(--text-body);
    }

    /* Toast feedback for navigation actions */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      translate: -50% 0;
      z-index: 200;
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      background: var(--ink);
      color: var(--surface-1);
      font-size: var(--text-footnote);
      font-weight: 500;
      box-shadow: var(--shadow-pop);
      pointer-events: none;
      opacity: 0;
      transition: opacity var(--dur-2) var(--ease);
    }
    .toast[data-show="true"] {
      opacity: 1;
    }

    /* ───────── 7. Bottom Floating Prototype Switcher Dock ───────── */
    .demo-dock {
      position: fixed;
      bottom: 10px;
      left: 50%;
      translate: -50% 0;
      z-index: 100;
      max-width: calc(100vw - 16px);
      display: inline-flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
      gap: 3px;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-caption);
    }
    .demo-dock::-webkit-scrollbar {
      display: none;
    }
    .demo-dock .group-label {
      color: var(--ink-3);
      padding: 0 2px 0 4px;
      font-weight: 600;
      white-space: nowrap;
    }
    .demo-dock button {
      height: 22px;
      padding: 0 7px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-weight: 500;
      white-space: nowrap;
      flex: none;
    }
    .demo-dock button:hover {
      color: var(--ink);
      background: var(--ghost-hover);
    }
    .demo-dock button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
      font-weight: 600;
    }
    .demo-dock .sep {
      width: 1px;
      height: 14px;
      background: var(--line);
      margin: 0 3px;
    }
  </style>
</head>
<body>
  <!-- Toast notification for page jumps (CardPage, StoriesPage, WritingPage, Settings, Timeline, Inspector) -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Main Stage -->
  <div id="stage" class="stage"></div>

  <!-- Shared Rename Story Dialog (#75 Step 1: reuses .confirm + .field input) -->
  <dialog id="rename-dialog" class="confirm" closedby="any">
    <form method="dialog" onsubmit="commitRename(event)">
      <p>重命名故事</p>
      <p class="sub-hint">留空保存将恢复默认名「New story」</p>
      <input
        id="rename-input"
        type="text"
        class="field"
        placeholder="New story"
        aria-label="Story name"
      />
      <div class="row">
        <button type="button" class="chip state" onclick="document.getElementById('rename-dialog').close()">
          取消
        </button>
        <button type="submit" class="chip" style="background: var(--primary); color: var(--primary-ink);">
          保存
        </button>
      </div>
    </form>
  </dialog>

  <!-- Shared Delete Story Confirm Dialog -->
  <dialog id="delete-dialog" class="confirm" closedby="any">
    <p>删除当前故事？其中的所有回合都将永久移除。</p>
    <div class="row">
      <button type="button" class="chip state" onclick="document.getElementById('delete-dialog').close()">
        取消
      </button>
      <button type="button" class="chip danger" onclick="commitDeleteStory()">
        删除
      </button>
    </div>
  </dialog>

  <!-- Persona picker (desktop: a centred modal dialog; its content is rendered by renderAll) -->
  <dialog id="persona-dialog" class="picker" closedby="any" onclose="onPickerClose()"></dialog>

  <!-- Stories Management Sheet (#75 Step 2: desktop 35rem centred modal dialog; phone 2nd sheet) -->
  <dialog id="stories-dialog" class="stories-modal" closedby="any" onclose="onStoriesModalClose()"></dialog>

  <!-- Prototype Control Dock -->
  <nav class="demo-dock" aria-label="原型状态与方案切换">
    <span class="group-label">视图</span>
    <button type="button" id="btn-mode-overview" aria-pressed="true" onclick="setStageMode('overview')">
      四态同屏
    </button>
    <button type="button" id="btn-mode-desktop" aria-pressed="false" onclick="setStageMode('desktop')">
      桌面画布
    </button>
    <button type="button" id="btn-mode-mobile" aria-pressed="false" onclick="setStageMode('mobile')">
      手机Sheet
    </button>
    <button type="button" id="btn-mode-stories" aria-pressed="false" onclick="setStageMode('stories')">
      故事管理弹窗 (#75)
    </button>
    <button type="button" id="btn-mode-picker" aria-pressed="false" onclick="setStageMode('picker')">
      选人设弹窗
    </button>

    <span class="sep"></span>
    <span class="group-label">导航</span>
    <button type="button" id="btn-nav-icons" aria-pressed="true" onclick="setNavStyle('icons')">
      纯图标同行
    </button>
    <button type="button" id="btn-nav-inline" aria-pressed="false" onclick="setNavStyle('inline')">
      带字同行
    </button>
    <button type="button" id="btn-nav-stack" aria-pressed="false" onclick="setNavStyle('stack')">
      竖排三行
    </button>

    <span class="sep"></span>
    <span class="group-label">写作胶囊</span>
    <button type="button" id="btn-wc-3" aria-pressed="true" onclick="setWritingCount(3)" title="3个四字胶囊单行排下">
      3项同行
    </button>
    <button type="button" id="btn-wc-4" aria-pressed="false" onclick="setWritingCount(4)" title="4个胶囊时单行 +1 收纳或双字短签">
      4项
    </button>
    <button type="button" id="btn-wc-5" aria-pressed="false" onclick="setWritingCount(5)" title="满配5个胶囊(4开关+本卡补充)">
      5项(满)
    </button>
    <button type="button" id="btn-wmode-toggle" aria-pressed="false" onclick="toggleWritingShortMode()" title="超过3项时的单行策略：+N 收纳（定）vs 双字短签（对照：5项仍溢出，且短签不可读）">
      策略:+N
    </button>

    <span class="sep"></span>
    <span class="group-label">故事</span>
    <button type="button" id="btn-sc-4" aria-pressed="true" onclick="setStorySlice(4)">
      4条
    </button>
    <button type="button" id="btn-sc-5" aria-pressed="false" onclick="setStorySlice(5)">
      5条
    </button>
    <button type="button" id="btn-sc-2" aria-pressed="false" onclick="setStorySlice(2)">
      2条
    </button>

    <span class="sep"></span>
    <button type="button" id="btn-lang-toggle" aria-pressed="true" onclick="toggleLangMode()">
      中文小标
    </button>
    <button type="button" id="btn-personas-empty" aria-pressed="false" onclick="toggleEmptyPersonas()">
      0人设
    </button>
    <button type="button" id="btn-pin-toggle" aria-pressed="false" onclick="togglePinned()">
      Pinned
    </button>
    <button type="button" id="btn-card-toggle" aria-pressed="false" onclick="toggleCard()">
      卡:竹林
    </button>
    <button type="button" id="btn-theme-in-nav" aria-pressed="true" onclick="toggleThemeInNav()">
      #70 主题键
    </button>
    <button type="button" id="btn-head-lines" aria-pressed="true" onclick="toggleHeadLines()" title="卡头简介的行数：3 行放下开篇整句，2 行对照">
      卡头:3行
    </button>
    <button type="button" onclick="toggleTheme()">
      浅/深
    </button>
  </nav>

        return chips
          .map((c) => `<span class="chip" title="${escapeAttr(c)}">${escapeHtml(SHORT_SWITCH_MAP[c] ?? c)}</span>`)
          .join("");
      }
      // Single line: up to 3 chips (3 × 55px + 2 × 3.5px = 172px of the 176px budget); 4 or 5 show the first 2 + "+N" 
      if (chips.length <= 3) {
        return chips.map((c) => `<span class="chip">${escapeHtml(c)}</span>`).join("");
      }
      const visible = chips.slice(0, 2);
      const rest = chips.slice(2);
      return (
        visible.map((c) => `<span class="chip">${escapeHtml(c)}</span>`).join("") +
        `<span class="chip more" title="${escapeAttr(rest.join(" · "))}">+${rest.length}</span>`

    /** Highlights occurrences of query `q` inside `text` with <mark>. */
    function highlightMatch(text, q) {
      if (!q) return escapeHtml(text);
      const lower = text.toLowerCase();
      const qLower = q.toLowerCase();
      const idx = lower.indexOf(qLower);
      if (idx === -1) return escapeHtml(text);
      const before = text.slice(0, idx);
      const match = text.slice(idx, idx + q.length);
      const after = text.slice(idx + q.length);
      return `${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}`;
    }

    /** Full-text match for a story: checks title, then historical turns (input + reply), then last input. */
    function matchStory(s, q) {
      if (!q) return { matched: true, hit: null };
      const qLower = q.toLowerCase();
      const titleMatch = s.title && s.title.toLowerCase().includes(qLower);
      const turnHits = (s.history ?? []).filter((h) => h.text.toLowerCase().includes(qLower));
      if (turnHits.length > 0) {
        return { matched: true, titleMatch, hit: turnHits[0], hitCount: turnHits.length };
      }
      if (s.last && s.last.toLowerCase().includes(qLower)) {
        return { matched: true, titleMatch, hit: { turn: s.turns, kind: "input", text: s.last }, hitCount: 1 };
      }
      if (titleMatch) {
        return { matched: true, titleMatch: true, hit: null, hitCount: 0 };
      }
      return { matched: false, hit: null };
    }

    /** Renders the story cards inside the Stories Management Sheet. */
    function renderStoriesCardsHTML(context) {
      const q = storiesSearch.trim();
      const baseList = [...stories]
        .filter((s) => (storiesFilter === "starred" ? s.starred : true))
        .sort((a, b) => Number(b.starred) - Number(a.starred));

      const evaluated = baseList
        .map((s) => ({ story: s, ...matchStory(s, q) }))
        .filter((x) => x.matched);

      if (evaluated.length === 0) {
        const emptyMsg = q
          ? `没有匹配「${escapeHtml(q)}」的故事（已检索标题、玩家台词与历史正文）`
          : storiesFilter === "starred"
            ? "尚未收藏任何故事，点击卡片左上角的星标即可收藏。"
            : "暂无故事记录";
        return `
          <div class="picker-empty">
            <span>${emptyMsg}</span>
            ${q ? `<button type="button" class="btn sm" onclick="setStoriesSearchQuery('')">清空搜索</button>` : ""}
          </div>
        `;
      }

      return evaluated
        .map(({ story: s, hit, hitCount }) => {
          const isCurrent = s.id === currentStoryId;
          const isUnnamed = s.title === null;
          const displayTitle = s.title ?? "New story";
          const isSelected = selectedStoryIds.has(s.id);
          const isExportOpen = openExportStoryId === s.id;

          let previewHTML = "";
          if (hit && q) {
            const kindLabel = hit.kind === "input" ? "玩家台词" : "正文";
            const extraHits = hitCount > 1 ? ` · 共 ${hitCount} 处` : "";
            previewHTML = `
              <div class="story-card-preview">
                <span class="hit-badge">第 ${hit.turn} 轮 · ${kindLabel}${extraHits}</span>${highlightMatch(hit.text, q)}
              </div>
            `;
          } else if (s.turns === 0 || !s.last) {
            previewHTML = `<div class="story-card-preview empty-preview">尚未开始对话（仅开场白，0 轮空档）</div>`;
          } else {
            previewHTML = `<div class="story-card-preview">${highlightMatch(s.last, q)}</div>`;
          }

          const turnsLabel = s.turns === 0 ? "0 轮（空档）" : `${s.turns} 轮`;
          const updatedLabel = `最后更新 ${s.agoZh}`;

          const exportBarHTML = isExportOpen
            ? `
              <div class="export-inline" onclick="event.stopPropagation()">
                <span>导出「${escapeHtml(displayTitle)}」</span>
                <div class="export-btns">
                  <button type="button" class="btn sm" onclick="exportStory(${s.id}, 'md')">阅读稿 (.md)</button>
                  <button type="button" class="btn sm" onclick="exportStory(${s.id}, 'json')">完整树 (.json)</button>
                </div>
              </div>
            `
            : "";

          return `
            <div
              class="story-card"
              role="listitem"
              aria-current="${isCurrent ? "true" : "false"}"
              data-selected="${batchMode && isSelected ? "true" : "false"}"
              onclick="${batchMode ? `toggleSelectStory(${s.id})` : `pickStoryFromModal(${s.id}, '${context}')`}"
            >
              ${
                batchMode
                  ? `<span class="batch-check" aria-hidden="true">${isSelected ? ICONS.check : ""}</span>`
                  : ""
              }
              <div class="story-card-body">
                <div class="story-card-top">
                  <button
                    type="button"
                    class="star-btn"
                    aria-label="${s.starred ? "取消收藏" : "收藏故事"}"
                    aria-pressed="${s.starred ? "true" : "false"}"
                    title="${s.starred ? "已收藏（点击取消）" : "收藏此故事（置顶）"}"
                    onclick="event.stopPropagation(); toggleStoryStar(${s.id})"
                  >
                    ${s.starred ? ICONS.starFill : ICONS.star}
                  </button>
                  <span class="title-text ${isUnnamed ? "unnamed" : ""}">${highlightMatch(displayTitle, q)}</span>
                  ${isCurrent ? `<span class="tag ok">当前</span>` : ""}
                  <div class="card-actions" onclick="event.stopPropagation()">
                    <button
                      type="button"
                      class="icon sm"
                      aria-label="重命名"
                      title="重命名故事"
                      onclick="openRenameDialog(${s.id})"
                    >
                      ${ICONS.pencil}
                    </button>
                    <button
                      type="button"
                      class="icon sm"
                      aria-label="导出"
                      title="导出阅读稿 (.md) 或存档树 (.json)"
                      onclick="toggleExportBar(${s.id})"
                    >
                      ${ICONS.download}
                    </button>
                    <button
                      type="button"
                      class="icon sm danger-hover"
                      aria-label="删除"
                      title="删除此故事"
                      onclick="openDeleteDialog(${s.id})"
                    >
                      ${ICONS.trash}
                    </button>
                  </div>
                </div>
                ${previewHTML}
                <div class="story-card-meta">
                  <span>${turnsLabel}</span>
                  <span class="dot-sep">·</span>
                  <span>${updatedLabel}</span>
                </div>
                ${exportBarHTML}
              </div>
            </div>
          `;
        })
        .join("");
    }
