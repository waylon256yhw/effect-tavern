<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harness 两态侧边栏（卡架 ↔ 单卡工作区）与紧凑 Composer · 交互原型 (#117)</title>
  <!--
    ═══════════════════════════════════════════════════════════════════════════════
    TWO-STATE SIDEBAR (CARD GALLERY ↔ SINGLE-CARD WORKSPACE) & COMPACT COMPOSER (#117)
    ═══════════════════════════════════════════════════════════════════════════════
    1. 左栏两层架构：
       - 层级 A · 总卡片库 (Gallery / shelf)：
         * 展示客观卡片资产（卡名、简介摘要、后台运行中圆点提示）
         * 顶部搜索框：搜索卡片
         * 点击任意卡片进入该卡的「单卡工作区」
       - 层级 B · 单卡工作区 (Active Card Workspace / session)：
         * 顶部返回栏：`‹ 所有卡片` + 折叠侧边栏按钮
         * 卡头区（无多余灰底框，呼吸感排版）：
           - 大标题 + 简介摘要，点击展开整页级「卡片详情页 (CardPage)」
           - 卡级设定行：人设 (Persona) 与 写法 (Writing)
         * 故事区（朴素、同质化列表）：
           - 整行宽度的搜索框（不再与加号挤在一行）
           - 故事行只负责切换：去掉外显星标 ★ 与 ⋯ 按钮，所有标题严格左对齐；仅后台运行中的局在右侧显示小圆点
         * 底部区（重心下沉，视觉均衡）：
           - 整行宽度的「＋ 新建故事」大按钮
           - 底部栏：左侧安装级按钮（设置、主题、语言），右侧打开「当前卡的故事管理器」（内含收藏、重命名、导出、删除）
    2. 卡片详情页 (Page 级展示)：
       - 点击卡头在主舞台展开整页级 CardPage（双栏大空间，承载丰富设定、模块、规则与开场白）
  -->
  <style>
    /* ───────── 1. Tokens: aligned with packages/client/src/tokens.css ───────── */
    :root {
      color-scheme: light dark;

      --surface-0: light-dark(#f9f9f7, #0b0b0b);
      --surface-1: light-dark(#fcfcfb, #151515);
      --surface-2: light-dark(#ffffff, #1a1a19);
      --surface-3: light-dark(#ffffff, #20201f);

      --ink: light-dark(#151515, #f5f5f5);
      --ink-2: light-dark(#525252, #a3a3a3);
      --ink-3: light-dark(#8a8a8a, #6f6f6f);

      --alpha-1: light-dark(rgb(20 20 20 / 0.05), rgb(255 255 255 / 0.05));
      --alpha-2: light-dark(rgb(20 20 20 / 0.1), rgb(255 255 255 / 0.09));
      --alpha-3: light-dark(rgb(20 20 20 / 0.2), rgb(255 255 255 / 0.18));
      --alpha-4: light-dark(rgb(20 20 20 / 0.35), rgb(255 255 255 / 0.3));
      --line: var(--alpha-2);
      --line-strong: var(--alpha-3);
      --fill: var(--alpha-2);
      --fill-hover: light-dark(rgb(20 20 20 / 0.14), rgb(255 255 255 / 0.14));
      --ghost-hover: var(--alpha-1);
      --ghost-active: var(--alpha-2);

      --primary: var(--ink);
      --primary-ink: var(--surface-1);
      --danger: light-dark(#dc2626, #f87171);
      --ok: light-dark(#1f7a3f, #4ade80);
      --ok-soft: light-dark(rgb(31 122 63 / 0.22), rgb(74 222 128 / 0.25));
      --danger-soft: light-dark(rgb(220 38 38 / 0.18), rgb(248 113 113 / 0.22));
      --ok-wash: light-dark(rgb(34 197 94 / 0.12), rgb(187 247 208 / 0.09));
      --warn: light-dark(#b45309, #fbbf24);
      --warn-soft: light-dark(rgb(217 119 6 / 0.12), rgb(251 191 36 / 0.14));
      --scrim: light-dark(rgb(0 0 0 / 0.2), rgb(0 0 0 / 0.5));
      --ring: var(--alpha-4);

      --hairline: 1px;
      --shadow-1:
        0 1px 2px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 2px 8px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-2:
        0 2px 4px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 6px 16px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-3:
        0 4px 8px light-dark(rgb(0 0 0 / 0.06), rgb(0 0 0 / 0.5)),
        0 12px 28px -2px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-pop:
        inset 0 0 0 1px light-dark(transparent, rgb(255 255 255 / 0.1)),
        0 0 0 1px light-dark(var(--line), transparent),
        0 8px 24px light-dark(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.65)),
        0 2px 6px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.45));
      --shadow-composer:
        0 4px 20px light-dark(rgb(0 0 0 / 0.035), rgb(0 0 0 / 0.4)),
        inset 0 0 0 1px var(--line);
      --shadow-composer-focus:
        0 4px 24px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.65)),
        inset 0 0 0 1px var(--line-strong);

      --radius-sm: 4px;
      --radius: 8px;
      --radius-card: calc(var(--radius) + 4px);
      --radius-composer: 14px;
      --radius-dialog: 16px;
      --radius-pill: 999px;

      --control: 32px;
      --control-sm: 24px;
      --control-lg: 38px;
      --icon: 20px;
      --icon-sm: 16px;

      --font-sans:
        system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --text-caption: 0.6875rem;
      --text-footnote: 0.75rem;
      --text-body: 0.875rem;
      --text-heading: 0.9375rem;
      --text-prose: 1rem;
      --text-field: var(--text-body);
      --text-title: 1.25rem;
      --leading-tight: 1.25;
      --leading-body: 1.45;
      --leading-prose: 1.75;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --line-prose: calc(var(--text-prose) * var(--leading-prose));
      --gap-turn: calc(var(--line-prose) * 0.75);
      --gap-item: calc(var(--line-prose) * 0.5);
      --measure: 42rem;
      --topbar: 48px;
      --fade: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --dur-1: 60ms;
      --dur-2: 120ms;
      --dur-3: 200ms;
      --dur-4: 300ms;
      --dur-5: 450ms;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-pulse: cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root[data-theme="light"] {
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
    }
    @media (resolution >= 2x) {
      :root {
        --hairline: 0.5px;
      }
    }

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      color: var(--ink);
      background: var(--surface-0);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
    }
    button {
      cursor: pointer;
      user-select: none;
    }
    button:disabled {
      opacity: 0.38;
      cursor: default;
    }
    mark {
      background: var(--warn-soft);
      color: var(--ink);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ───────── 2. Shared Primitives (.icon, .chip, .input-box, .busy-dot) ───────── */
    .icon {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      flex: none;
      position: relative;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .icon:active:not(:disabled) {
      background: var(--ghost-active);
    }
    .icon[aria-pressed="true"] {
      background: var(--fill);
      color: var(--ink);
    }
    .icon svg {
      width: var(--icon);
      height: var(--icon);
    }
    .icon.sm {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: var(--radius);
    }
    .icon.sm svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }
    .icon .dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      box-shadow: 0 0 0 1.5px var(--surface-1);
    }

    .chip {
      height: var(--control-sm);
      padding: 0 10px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    button.chip:hover:not(:disabled) {
      background: var(--fill);
      color: var(--ink);
    }
    .chip.primary {
      background: var(--primary);
      color: var(--primary-ink);
    }
    .chip.danger {
      background: var(--danger);
      color: #fff;
    }
    .chip svg {
      width: 12px;
      height: 12px;
      color: var(--ink-3);
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: var(--control);
      padding: 0 var(--space-2);
      border-radius: var(--radius);
      background: var(--alpha-1);
      flex: 1;
      min-width: 0;
      transition: box-shadow var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
    }
    .input-box:focus-within {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .input-box svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
      color: var(--ink-3);
      flex: none;
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      outline: none;
      font-size: var(--text-field);
    }
    .input-box input::placeholder {
      color: var(--ink-3);
    }

    .busy-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      display: inline-block;
      flex: none;
    }
    @media (prefers-reduced-motion: no-preference) {
      .busy-dot {
        animation: pulseDot 1.4s var(--ease-pulse) infinite;
      }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.82); }
    }

    /* ───────── 3. Stage Container (Desktop vs Mobile Viewport Switcher) ───────── */
    .viewport-host {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .viewport-host[data-device="mobile"] {
      padding: var(--space-4) var(--space-4) 68px;
      align-items: center;
      background:
        radial-gradient(circle at 50% 20%, var(--alpha-1), transparent 70%),
        var(--surface-0);
    }
    .phone-frame {
      width: 390px;
      height: min(812px, 100%);
      border-radius: 36px;
      background: var(--surface-1);
      box-shadow:
        0 0 0 8px light-dark(#e5e5e2, #262625),
        var(--shadow-3);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ───────── 4. Outer Harness Grid (Sidebar | Stage) ───────── */
    .harness {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 16.5rem minmax(0, 1fr);
      gap: var(--space-5);
      padding: var(--space-5) var(--space-5) calc(var(--space-5) + 48px);
      transition: grid-template-columns var(--dur-3) var(--ease), gap var(--dur-3) var(--ease);
    }
    .harness[data-collapsed="true"] {
      grid-template-columns: 0rem minmax(0, 1fr);
      gap: 0;
    }
    .harness[data-collapsed="true"] > .sidebar-card {
      opacity: 0;
      pointer-events: none;
      padding-inline: 0;
    }

    /* ───────── 5. Two-State Left Sidebar (Gallery ↔ Single-Card Workspace) ───────── */
    .sidebar-card {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity var(--dur-2) var(--ease);
    }
    .sidebar {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: var(--space-4);
      gap: var(--space-4);
    }

    .side-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex: none;
    }
    .back-shelf-btn {
      height: var(--control-sm);
      padding: 0 var(--space-2) 0 4px;
      margin-left: -4px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: var(--text-footnote);
      font-weight: 500;
      color: var(--ink-2);
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .back-shelf-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .back-shelf-btn svg {
      width: 14px;
      height: 14px;
      color: var(--ink-3);
    }

    /* State A: Card Gallery List */
    .shelf-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin-inline: calc(-1 * var(--space-1));
      padding-inline: var(--space-1);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }
    .shelf-scroll:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }
    .shelf-card {
      width: 100%;
      text-align: left;
      padding: var(--space-3);
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background var(--dur-2) var(--ease), box-shadow var(--dur-2) var(--ease);
    }
    .shelf-card:hover {
      background: var(--fill);
    }
    .shelf-card[aria-current="true"] {
      background: var(--fill);
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .shelf-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .shelf-card-title {
      font-size: var(--text-heading);
      font-weight: 600;
      color: var(--ink);
    }
    .shelf-card-right {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-3);
    }
    .shelf-card-right svg {
      width: 14px;
      height: 14px;
    }
    .shelf-card-desc {
      margin: 0;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* State B: Active Card Workspace Header — Simple, low-density Card Title button (summary & settings live in CardPage) */
    .cardhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      padding: var(--space-2) var(--space-2);
      border-radius: var(--radius-card);
      text-align: left;
      transition: background var(--dur-2) var(--ease);
    }
    .cardhead:hover {
      background: var(--ghost-hover);
    }
    .cardhead[aria-current="page"] {
      background: var(--fill);
    }
    .cardhead .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      min-width: 0;
    }
    .cardhead h1 {
      margin: 0;
      font-size: var(--text-title);
      font-weight: 650;
      line-height: var(--leading-tight);
      letter-spacing: -0.02em;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cardhead .enter {
      flex: none;
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--alpha-1);
      color: var(--ink-3);
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease), translate var(--dur-2) var(--ease);
    }
    .cardhead .enter svg {
      width: 12px;
      height: 12px;
    }
    .cardhead:hover .enter,
    .cardhead[aria-current="page"] .enter {
      background: var(--alpha-2);
      color: var(--ink);
      translate: 1px 0;
    }

    /* Stories Section: full-width search + uniform, plain story list */
    .stories-sec {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .story-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .story-item {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      transition: background var(--dur-2) var(--ease);
    }
    .story-item:hover {
      background: var(--ghost-hover);
    }
    .story-item[aria-current="true"] {
      background: var(--fill);
    }
    .story-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-height: var(--control);
      padding: 0 var(--space-2);
      text-align: left;
      width: 100%;
    }
    .story-name {
      font-size: var(--text-body);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 1;
    }
    .story-item[aria-current="true"] .story-name {
      font-weight: 600;
    }
    .story-name.unnamed {
      color: var(--ink-2);
    }

    .story-hit {
      padding: 0 var(--space-2) 6px;
      font-size: var(--text-caption);
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    .story-hit .turn-tag {
      font-family: var(--font-mono);
      color: var(--ink-2);
      margin-right: 4px;
    }

    /* Bottom Action Area: Prominent "New Story" Button + Footer */
    .side-bottom {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      flex: none;
      margin-top: auto;
    }
    .new-story-btn {
      width: 100%;
      height: var(--control-lg);
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      background: var(--alpha-1);
      color: var(--ink);
      font-size: var(--text-body);
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      transition: background var(--dur-2) var(--ease);
    }
    .new-story-btn:hover {
      background: var(--fill);
    }
    .new-story-btn svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
      color: var(--ink-2);
    }

    .side-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
    }
    .side-foot-left {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* ───────── 6. Main Stage (Reader + Glance | Opening Picker | Page-level CardPage | Inspector) ───────── */
    .stage {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-5);
      position: relative;
    }
    .stage[data-view="reader"] {
      grid-template-columns: minmax(0, 1fr) 19rem;
    }

    /* ───────── 7. Reader Column & Clean Story-Level Strip ───────── */
    .reader-card {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .story-strip {
      height: calc(var(--control) + var(--space-1));
      padding: var(--space-1) var(--space-4) 0;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: none;
      min-width: 0;
    }
    .strip-story-name {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .strip-story-name.unnamed {
      color: var(--ink-2);
      font-weight: 500;
    }
    .strip-tools {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex: none;
    }

    /* Reader Scroll & Turns */
    .reader-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--space-4) var(--space-6) var(--fade);
      display: flex;
      flex-direction: column;
      gap: var(--gap-turn);
      mask-image: linear-gradient(to bottom, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
    }
    .reader-main {
      max-width: var(--measure);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--gap-turn);
    }
    .turn-sec {
      display: flex;
      flex-direction: column;
      gap: var(--gap-item);
    }
    .spoke {
      align-self: flex-end;
      max-width: 82%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .said {
      padding: 8px 13px;
      border-radius: 14px 14px 4px 14px;
      background: var(--fill);
      color: var(--ink);
      font-size: var(--text-prose);
      line-height: var(--leading-body);
    }
    .prose {
      font-size: var(--text-prose);
      line-height: var(--leading-prose);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: var(--gap-item);
    }
    .prose p {
      margin: 0;
    }
    .turn-foot {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--ink-3);
      font-size: var(--text-footnote);
    }
    .record-pill {
      height: var(--control-sm);
      padding: 0 8px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-caption);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .record-pill svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }
    .dots {
      display: inline-flex;
      gap: 3.5px;
    }
    .dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink-3);
      animation: pulseDot 1.2s var(--ease-pulse) infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    .cursor {
      display: inline-block;
      vertical-align: text-bottom;
      width: 2px;
      height: 1.05em;
      margin-left: 2px;
      background: var(--ink-2);
      animation: blink 1s steps(2, jump-none) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ───────── 8. Compact Composer + Input Helper Attachments above it ───────── */
    .composer-wrap {
      padding: 0 var(--space-3) calc(var(--space-4) + var(--safe-bottom));
      flex: none;
    }
    .composer-stack {
      max-width: var(--measure);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .helper-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      padding: 0 var(--space-1);
    }
    .helper-bar .chip.glyph {
      min-width: 3.2em;
      justify-content: center;
      font-size: var(--text-body);
      letter-spacing: 0.15em;
      text-indent: 0.15em;
      color: var(--ink);
    }
    .helper-bar .sep {
      width: 1px;
      height: 12px;
      background: var(--line);
      margin: 0 2px;
    }
    .composer-box {
      width: 100%;
      border-radius: var(--radius-composer);
      background: var(--surface-3);
      box-shadow: var(--shadow-composer);
      padding: var(--space-1);
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
      transition: box-shadow var(--dur-3) var(--ease);
    }
    .composer-box:focus-within {
      box-shadow: var(--shadow-composer-focus);
    }
    .composer-attach {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-1) var(--space-1) var(--space-2);
      border-radius: var(--radius);
      background: var(--alpha-1);
    }
    .composer-attach .attach-tag {
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-2);
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--fill);
      flex: none;
    }
    .composer-attach input {
      flex: 1;
      min-width: 0;
      outline: none;
      font-size: var(--text-prose);
      color: var(--ink);
    }
    .composer-attach input::placeholder {
      color: var(--ink-3);
    }
    .composer-body.compact {
      padding: 2px var(--space-1);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    .composer-body.compact textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      outline: none;
      font-size: var(--text-prose);
      line-height: 1.5;
      min-height: calc(1.5 * var(--text-prose) + 2 * var(--space-1));
      padding: var(--space-1);
    }
    .send-btn {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: var(--primary-ink);
      display: grid;
      place-items: center;
      flex: none;
    }
    .send-btn.stop {
      background: var(--fill);
      color: var(--ink);
    }
    .send-btn svg {
      width: var(--icon);
      height: var(--icon);
    }

    /* ───────── 9. Right Glance Card (Status & Record) ───────── */
    .glance-card {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      overflow-y: auto;
    }
    .glance-sec {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .glance-sec h2 {
      margin: 0;
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink-2);
    }
    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 0;
    }
    .meter-top {
      display: flex;
      justify-content: space-between;
      font-size: var(--text-footnote);
    }
    .meter-top .label {
      font-weight: 600;
    }
    .meter-top .val {
      font-family: var(--font-mono);
      color: var(--ink-2);
    }
    .meter-track {
      height: 6px;
      border-radius: 3px;
      background: var(--alpha-2);
      position: relative;
      overflow: hidden;
    }
    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--ink);
      border-radius: 3px;
    }
    .clue-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-2);
      padding: 7px 9px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-size: var(--text-footnote);
      color: var(--ink-2);
    }
    .clue-item button {
      flex: none;
      color: var(--ink-3);
    }
    .clue-item button:hover,
    .clue-item button[aria-pressed="true"] {
      color: var(--ink);
    }
    .clue-item button svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }

    /* ───────── 10. Full-Stage Views: New-Story Opening Picker, Full-Page Card Dossier & Inspector ───────── */
    .stage-surface {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stage-surface-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
    }

    /* Shared hover-only scrollbar + fade mask (matches inspector.css / card.css .wscroll) */
    .wscroll {
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color var(--dur-2) var(--ease);
      mask-image: linear-gradient(
        to bottom,
        transparent,
        #000 16px,
        #000 calc(100% - 16px),
        transparent
      );
    }
    .wscroll:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    /* Route 1: "New Story" Guide Sheet (Strips out card metadata; dedicated to 40-50 Opening Selection + Persona Pick) */
    .newstory-sheet {
      width: 100%;
      max-width: 58rem;
      height: min(29rem, 100%);
      display: grid;
      grid-template-columns: minmax(0, 10fr) minmax(0, 13fr);
      border-radius: var(--radius-dialog);
      background: var(--surface-2);
      box-shadow: var(--shadow-2);
      overflow: hidden;
    }
    .phone-frame .newstory-sheet {
      grid-template-columns: minmax(0, 1fr);
      height: auto;
    }
    .newstory-side {
      padding: var(--space-5);
      box-shadow: inset calc(-1 * var(--hairline)) 0 0 var(--line);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      min-height: 0;
    }
    .phone-frame .newstory-side {
      box-shadow: inset 0 calc(-1 * var(--hairline)) 0 var(--line);
      max-height: 15rem;
    }
    .newstory-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      flex: none;
    }
    .newstory-title-left {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }
    .newstory-title-left h1 {
      margin: 0;
      font-size: var(--text-title);
      font-weight: 650;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Built-in Persona Selector in the New Story step */
    .newstory-persona-box {
      flex: none;
      padding: 10px 12px;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .newstory-persona-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--text-footnote);
    }
    .newstory-persona-top .lbl {
      color: var(--ink-3);
      font-weight: 500;
    }
    .newstory-persona-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .persona-pill {
      height: var(--control-sm);
      padding: 0 9px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 500;
      transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }
    .persona-pill:hover {
      background: var(--fill);
      color: var(--ink);
    }
    .persona-pill[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
      font-weight: 600;
    }
    .newstory-persona-bio {
      margin: 0;
      font-size: var(--text-caption);
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 40-50 Openings Directory on Left Pane (Matches production .version row anatomy: .below + .first + .tag) */
    .opening-dir-head {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .opening-tag-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .opening-tag-filter {
      flex: none;
      height: 22px;
      padding: 0 8px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-caption);
      font-weight: 500;
    }
    .opening-tag-filter:hover {
      background: var(--fill);
      color: var(--ink);
    }
    .opening-tag-filter[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
      font-weight: 600;
    }

    .opening-dir-list {
      flex: 1;
      min-height: 0;
      margin-inline: -4px;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    /* Production .version row (used both in left directory and in bottom upward [popover] .versions) */
    .version {
      display: flex;
      width: 100%;
      align-items: center;
      gap: var(--space-2);
      min-height: var(--control);
      padding: 4px var(--space-2);
      border-radius: var(--radius);
      text-align: left;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      flex: none;
    }
    .version:hover,
    .version:focus-visible {
      background: var(--ghost-hover);
      color: var(--ink);
      outline: none;
    }
    .version[aria-current="true"] {
      background: var(--active-row);
      color: var(--ink);
      font-weight: 600;
    }
    .version .below {
      flex: none;
      width: 1.75em;
      font-family: var(--font-mono);
      font-size: var(--text-caption);
      color: var(--ink-3);
      font-variant-numeric: tabular-nums;
    }
    .version[aria-current="true"] .below {
      color: var(--ink);
    }
    .version .first {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .version .tag {
      flex: none;
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--alpha-1);
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--ink-2);
    }

    /* Right Column of New Story Sheet: Production .opening (.well > .wscroll + .foot with .siblings + .versions popover) */
    .newstory-opening {
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 0;
    }
    .newstory-opening .well {
      flex: 1;
      min-height: 0;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .phone-frame .newstory-opening .well {
      height: 15rem;
    }
    .newstory-opening .well .wscroll {
      flex: 1;
      min-height: 0;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      font-size: var(--text-prose);
      line-height: var(--leading-prose);
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .newstory-opening .well .wscroll p {
      margin: 0;
      white-space: pre-line;
    }
    .newstory-opening .foot {
      flex: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
    }
    /* Production .siblings stepper + upward popover trigger */
    .siblings {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-variant-numeric: tabular-nums;
    }
    .siblings .step-icon {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: 6px;
      display: inline-grid;
      place-items: center;
      color: var(--ink-2);
    }
    .siblings .step-icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .siblings .step-icon:disabled {
      opacity: 0.32;
      cursor: default;
    }
    .siblings .step-icon svg {
      width: 13px;
      height: 13px;
    }
    .siblings .count {
      height: var(--control-sm);
      padding: 0 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--text-footnote);
      font-weight: 550;
      color: var(--ink);
      white-space: nowrap;
    }
    .siblings .count:hover,
    .siblings .count[aria-expanded="true"] {
      background: var(--surface-3);
      box-shadow: var(--shadow-1);
    }
    .siblings .count svg {
      width: 11px;
      height: 11px;
      color: var(--ink-3);
    }
    /* Upward Popover Menu (.versions) matching production card.css */
    .versions-popover {
      position: absolute;
      left: 0;
      bottom: calc(100% + 8px);
      z-index: 30;
      width: min(25rem, calc(100vw - 32px));
      max-height: 16rem;
      overflow-y: auto;
      padding: var(--space-1);
      border-radius: var(--radius-card);
      background: var(--surface-3);
      color: var(--ink);
      box-shadow: var(--shadow-pop), inset 0 0 0 var(--hairline) var(--line);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .est.mono {
      font-family: var(--font-mono);
      font-size: var(--text-footnote);
      color: var(--ink-3);
      white-space: nowrap;
    }
    .begin-btn {
      margin-left: auto;
      height: var(--control);
      padding: 0 18px;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: var(--primary-ink);
      box-shadow: var(--shadow-1);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .begin-btn:hover {
      opacity: 0.88;
    }
    .begin-btn svg {
      width: 15px;
      height: 15px;
    }

    /* Route 2: Full-Page Card Dossier (Top Card Header Click → Entire Page Hierarchy for Card Settings & Prompts) */
    .dossier-layout {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 15.5rem minmax(0, 1fr);
      overflow: hidden;
    }
    .dossier-rail {
      padding: var(--space-5);
      box-shadow: inset calc(-1 * var(--hairline)) 0 0 var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-4);
      overflow-y: auto;
    }
    .dossier-brand h1 {
      margin: 0;
      font-size: var(--text-title);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .dossier-brand p {
      margin: var(--space-2) 0 0;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      line-height: 1.55;
    }
    .dossier-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: var(--space-4);
    }
    .dossier-nav-btn {
      height: var(--control);
      padding: 0 10px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-body);
      color: var(--ink-2);
      text-align: left;
      transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }
    .dossier-nav-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .dossier-nav-btn[aria-current="true"] {
      background: var(--active-row);
      color: var(--ink);
      font-weight: 600;
    }
    .dossier-nav-btn .badge {
      font-size: var(--text-caption);
      font-family: var(--font-mono);
      color: var(--ink-3);
    }
    .dossier-specs {
      margin: 0;
      padding-top: var(--space-3);
      box-shadow: inset 0 var(--hairline) 0 var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: var(--text-caption);
    }
    .dossier-specs .row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .dossier-specs dt { color: var(--ink-3); }
    .dossier-specs dd { margin: 0; color: var(--ink-2); font-weight: 500; }

    .dossier-main {
      min-width: 0;
      min-height: 0;
      overflow-y: auto;
      padding: var(--space-6) var(--space-7);
    }
    .dossier-content {
      max-width: 46rem;
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }
    .dossier-sec {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .dossier-sec-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .dossier-sec-head h2 {
      margin: 0;
      font-size: var(--text-heading);
      font-weight: 600;
    }
    .dossier-sec-head .tag {
      font-size: var(--text-caption);
      font-family: var(--font-mono);
      color: var(--ink-3);
    }
    .dossier-block {
      padding: var(--space-4);
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .dossier-block h3 {
      margin: 0;
      font-size: var(--text-body);
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .dossier-block p {
      margin: 0;
      font-size: var(--text-body);
      line-height: 1.65;
      color: var(--ink-2);
    }
    .dossier-prompt {
      margin: 0;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius);
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      font-family: var(--font-mono);
      font-size: var(--text-footnote);
      line-height: 1.65;
      color: var(--ink-2);
      white-space: pre-wrap;
    }
    .dossier-kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .inspect-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 18rem minmax(0, 1fr);
      gap: var(--space-4);
      padding: var(--space-4);
    }
    .inspect-pane {
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      font-size: var(--text-footnote);
    }
    .inspect-step {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--surface-2);
      font-family: var(--font-mono);
    }

    /* ───────── 11. Mobile Topbar, Sidebar Drawer & Session Sheet ───────── */
    .mobile-topbar {
      height: var(--topbar);
      padding: 0 var(--space-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      flex: none;
    }
    .mobile-title-btn {
      flex: 1;
      min-width: 0;
      height: var(--control);
      padding: 0 var(--space-2);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
    }
    .mobile-title-btn:hover {
      background: var(--ghost-hover);
    }
    .mobile-title-btn .c-name {
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .mobile-title-btn .s-name {
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mobile-title-btn svg {
      width: 12px;
      height: 12px;
      color: var(--ink-3);
      flex: none;
    }

    .mobile-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: var(--scrim);
      display: flex;
    }
    .mobile-drawer {
      width: 276px;
      max-width: 84%;
      height: 100%;
      background: var(--surface-1);
      box-shadow: var(--shadow-3);
      display: flex;
      flex-direction: column;
    }
    .mobile-sheet {
      margin-top: auto;
      width: 100%;
      max-height: 82%;
      border-radius: var(--radius-dialog) var(--radius-dialog) 0 0;
      background: var(--surface-1);
      box-shadow: var(--shadow-3);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      overflow-y: auto;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sheet-head h3 {
      margin: 0;
      font-size: var(--text-heading);
      font-weight: 600;
    }

    /* ───────── 12. Modal Sheets (Current Card's Story Manager, Persona Picker) ───────── */
    dialog.modal-sheet {
      border: 0;
      padding: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-2);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      width: min(32rem, calc(100vw - 32px));
      max-height: 80vh;
    }
    dialog.modal-sheet::backdrop {
      background: var(--scrim);
    }
    .modal-inner {
      display: flex;
      flex-direction: column;
      max-height: 80vh;
    }
    .modal-head {
      padding: var(--space-4) var(--space-5) var(--space-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .modal-head h3 {
      margin: 0;
      font-size: var(--text-heading);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-body {
      padding: var(--space-2) var(--space-5) var(--space-4);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .modal-foot {
      padding: var(--space-2) var(--space-5) var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--text-footnote);
    }

    /* Story Manager Card Rows (Matches production manager.tsx) */
    .mgr-toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding-bottom: var(--space-1);
    }
    .mgr-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      transition: background var(--dur-2) var(--ease);
    }
    .mgr-row[aria-current="true"] {
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .mgr-row-top {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .mgr-star {
      width: var(--control-sm);
      height: var(--control-sm);
      display: inline-grid;
      place-items: center;
      color: var(--ink-3);
      border-radius: var(--radius-sm);
    }
    .mgr-star[aria-pressed="true"] {
      color: var(--ink);
    }
    .mgr-star svg {
      width: 14px;
      height: 14px;
    }
    .mgr-title {
      flex: 1;
      min-width: 0;
      text-align: left;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mgr-title.unnamed {
      font-weight: 400;
      color: var(--ink-2);
    }
    .mgr-actions {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .mgr-preview {
      margin: 0;
      padding-left: 24px;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mgr-meta {
      padding-left: 24px;
      font-size: var(--text-caption);
      color: var(--ink-3);
      font-family: var(--font-mono);
    }

    .cleanup-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-size: var(--text-footnote);
    }
    .cleanup-row .c-tag {
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--fill);
      color: var(--ink-2);
      font-size: var(--text-caption);
    }

    /* ───────── 13. Prototype Control Dock & Toast ───────── */
    .proto-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      translate: -50% 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-caption);
      white-space: nowrap;
      max-width: calc(100vw - 16px);
      overflow-x: auto;
    }
    .proto-dock button {
      height: var(--control-sm);
      padding: 0 9px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-weight: 500;
      transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }
    .proto-dock button:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .proto-dock button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
    }
    .proto-dock .sep {
      width: 1px;
      height: 14px;
      background: var(--line);
      margin: 0 2px;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      translate: -50% -12px;
      z-index: 80;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: var(--ink);
      color: var(--surface-1);
      font-size: var(--text-footnote);
      font-weight: 500;
      box-shadow: var(--shadow-2);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-2) var(--ease), translate var(--dur-2) var(--ease);
    }
    .toast[data-show="true"] {
      opacity: 1;
      translate: -50% 0;
    }
  </style>
</head>

    const WUXIA_EXTRA_SEEDS = [

    function getCardOpenings(c) {
      if (c._cachedOpenings) return c._cachedOpenings;
      const list = [];
      const targetCount = c.id === "wuxia" ? 45 : c.id === "yandao" ? 28 : c.id === "ri" ? 18 : 14;
      for (let i = 0; i < targetCount; i++) {
        if (c.id === "wuxia") {
          const seed = WUXIA_EXTRA_SEEDS[i % WUXIA_EXTRA_SEEDS.length];
          const suffix = i >= WUXIA_EXTRA_SEEDS.length ? `（第 ${Math.floor(i / WUXIA_EXTRA_SEEDS.length) + 1} 幕变体 · 苦竹岭第 ${(i % 9) + 1} 桩旧事）` : "";
          list.push({
            idx: i,
            firstLine: seed.first + (i >= WUXIA_EXTRA_SEEDS.length ? ` [${i + 1}]` : ""),
            text: `${seed.first}${suffix}\n\n${seed.rest}`,
            tag: seed.tag,
            tokens: seed.tokens + ((i * 17) % 90),
          });
        } else {
          const baseText = c.openings[i % c.openings.length];
          const first = baseText.split(/[。！？\n]/)[0] + "。";
          const tags =
            c.id === "yandao"
              ? ["起点 = 平静", "起点 = 血案", "局势 = 7", "路线 = 夜渡", "路线 = 县衙"]
              : c.id === "ri"
                ? ["好感度 = 60", "好感度 = 75", "地点 = 教室", "地点 = 镰仓", "天气 = 梅雨"]
                : ["电力 = 85%", "电力 = 40%", "舱段 = B区", "信标 = 静默"];
          list.push({
            idx: i,
            firstLine: i === 0 ? first : `${first.replace(/。$/, "")}（分线 ${String(i + 1).padStart(2, "0")}）。`,
            text:
              i === 0
                ? baseText
                : `${baseText}\n\n【开场分线 ${String(i + 1).padStart(2, "0")} · 初始设定：${tags[i % tags.length]}】`,
            tag: tags[i % tags.length],
            tokens: 310 + ((i * 23) % 120),
          });
        }
      }
      c._cachedOpenings = list;
      return list;
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function highlightMark(text, q) {
      if (!q.trim()) return escapeHtml(text);
      const needle = q.trim();
      const idx = text.toLowerCase().indexOf(needle.toLowerCase());
      if (idx < 0) return escapeHtml(text);
      return (
        escapeHtml(text.slice(0, idx)) +
        `<mark>${escapeHtml(text.slice(idx, idx + needle.length))}</mark>` +
        escapeHtml(text.slice(idx + needle.length))
      );
    }
    function storyMatches(s, q) {
      const t = q.trim().toLowerCase();
      if (!t) return { match: true, snippet: null };
      const titleHit = (s.title || "New story").toLowerCase().includes(t);
      const bodyHit = s.hitText && s.hitText.toLowerCase().includes(t);
      return {
        match: titleHit || bodyHit,
        snippet: bodyHit ? s.hitText : null,
      };
    }

                onclick="openCardStoryManager()"

          </div>

    // ───────── 6. Render Main Stage Views (Reader / Full-Page CardPage / Inspector) ─────────
    function renderReaderStageHTML(isMobile = false) {
      const s = currentStory();
      const c = getCard(activeCardId);
      const b = isStoryBusy(s);

      const stripHTML = isMobile
        ? `

              ${ICONS.caretDown}
            </button>
            <button type="button" class="icon" aria-label="状态表" onclick="showToast('手机端拉起 Status 状态表 Sheet')">
              ${ICONS.status}
              <i class="dot"></i>
            </button>
          </header>
        `
        : `
          <header class="story-strip">
            ${
              sidebarCollapsed
                ? `<button type="button" class="icon sm" title="展开侧边栏" onclick="toggleSidebarCollapse()">${ICONS.sidebar}</button>`

            }

              ${escapeHtml(s.title ?? "New story")}
            </span>

              <button type="button" class="icon sm" title="Timeline 时间线" aria-label="时间线" onclick="showToast('打开 Timeline 时间线页')">

              </button>
              <button type="button" class="icon sm" title="Inspector 检查器" aria-label="检查器" onclick="setStageView('inspect')">
                ${ICONS.probe}
              </button>
            </div>
          </header>
        `;

      const draftHTML = b
        ? `
          <section class="turn-sec">
            <div class="spoke">
              <div class="said">我顺着竹林石阶走入亭中，将油布包裹的旧短剑轻轻放在石桌上。</div>
            </div>
            <div class="prose">
              <p>裴青舟停下擦拭乌木剑鞘的动作，山风穿亭而过，吹动他袖口洗得发白的青布。他的视线在那方油布上停了片刻，指节微不可察地收紧。<span class="cursor"></span></p>
            </div>
            <footer class="turn-foot">
              <span class="record-pill">
                ${ICONS.record}
                <span class="dots"><span></span><span></span><span></span></span>
              </span>
            </footer>
          </section>
        `
        : "";

      const helperBarHTML = showHelperBar
        ? `
          <div class="helper-bar" role="toolbar" aria-label="输入助手">
            <button type="button" class="chip glyph" onclick="insertHelperText('「', '」')" title="插入直角引号">「」</button>
            <button type="button" class="chip glyph" onclick="insertHelperText('『', '』')" title="插入双直角引号">『』</button>
            <button type="button" class="chip glyph" onclick="insertHelperText('“', '”')" title="插入双引号">“”</button>
            <button type="button" class="chip glyph" onclick="insertHelperText('（', '）')" title="插入圆括号">（）</button>
            <span class="sep"></span>
            ${
              c.id !== "yandao"
                ? `<button type="button" class="chip" onclick="insertHelperText('⦅', '⦆')" title="角色心里的话，不说出口">心声</button>
                   <button type="button" class="chip" onclick="openNoteAttach()" title="给叙事者的话，不计入正文">+ 场外指导</button>`
                : ""
            }
            <button type="button" class="chip" onclick="insertSnippet('继续。', true)" title="顺着写下去">继续</button>
            <button type="button" class="chip" onclick="insertSnippet('推进剧情到下一个场景。', true)" title="引入新事件，或切到下一幕">推进剧情</button>
          </div>
        `
        : "";

      const noteAttachHTML =
        showNoteAttach && c.id !== "yandao"
          ? `
            <div class="composer-attach">
              <span class="attach-tag">致叙述者</span>
              <input
                type="text"
                placeholder="给叙述者的场外指导…"
                value="${escapeHtml(noteDraftText)}"
                oninput="noteDraftText = this.value"
              />
              <button type="button" class="icon sm" aria-label="移除场外指导" onclick="closeNoteAttach()">
                ${ICONS.close}
              </button>
            </div>
          `
          : "";

      const readerCard = `
        <div class="reader-card">
          ${stripHTML}
          <div class="reader-scroll">
            <div class="reader-main">
              <section class="turn-sec">
                <div class="prose">
                  <p>${escapeHtml(c.openings[0])}</p>
                </div>
                <footer class="turn-foot">
                  <span class="record-pill">${ICONS.record}</span>
                </footer>
              </section>
              <section class="turn-sec">
                <div class="spoke">
                  <div class="said">${escapeHtml(s.hitText || "我解下腰间那柄旧短剑放在石桌上：「我是替李鹤来送还故物的。」")}</div>
                </div>
                <div class="prose">
                  <p>雨后的苦竹林里雾气未散，竹叶上的水珠顺着亭檐一滴滴落在青石板上。裴青舟按着乌木剑鞘站在三步开外，目光静静地落在你腰间的旧短剑上：「三年前他在太湖渡口与唐门死战，此剑怎会流落到关外？」</p>
                </div>
                <footer class="turn-foot">
                  <span class="record-pill">${ICONS.record}</span>
                  <span>‹ 1/2 ›</span>
                </footer>
              </section>
              ${draftHTML}
            </div>
          </div>
          <div class="composer-wrap">
            <div class="composer-stack">
              ${helperBarHTML}
              <div class="composer-box">

                    class="icon sm"
                    aria-label="输入助手"
                    aria-pressed="${showHelperBar ? "true" : "false"}"
                    title="展开/收起输入助手附件"

                    b
                      ? `<button type="button" class="send-btn stop" aria-label="停止" onclick="stopStoryTurn(${s.id})">${ICONS.stop}</button>`

      if (isMobile) return readerCard;

      const glanceCard = `
        <aside class="glance-card">
          <section class="glance-sec">
            <h2>状态</h2>
            <div class="meter-row">
              <div class="meter-top">
                <span class="label">戒心</span>
                <span class="val">6 / 10 (-1)</span>
              </div>
              <div class="meter-track">
                <div class="meter-fill" style="width: 60%"></div>
              </div>
            </div>
            <div class="meter-row">
              <div class="meter-top">
                <span class="label">关系阶段</span>
                <span class="val">试探来意</span>
              </div>
              <div class="meter-track">
                <div class="meter-fill" style="width: 40%"></div>
              </div>
            </div>
          </section>
          <section class="glance-sec">
            <h2>记录与线索</h2>
            ${c.clues
              .map(
                (cl) => `
                <div class="clue-item">
                  <span>${escapeHtml(cl.hook)}</span>
                  <button
                    type="button"
                    aria-pressed="${pinnedByCard[c.id] === cl.hook ? "true" : "false"}"
                    title="钉选线索（下一轮发消息时携带）"
                    onclick="toggleCluePin('${c.id}', '${escapeHtml(cl.hook)}')"
                  >
                    ${ICONS.pin}
                  </button>
                </div>
              `
              )
              .join("")}
          </section>
        </aside>
      `;

      return readerCard + glanceCard;
    }

    // Route 1 (Bottom "＋ 新建故事" button): Pure Opening & Persona Guide — built for 40~50 openings!
    // Strips out card metadata (which lives in CardPage) and focuses 100% on:
    //   1. Card/Story Persona selection
    //   2. High-capacity 40~50 Opening Directory (.version: 01 + firstLine + .tag) + search/tag filter
    //   3. Production .well > .wscroll prose preview + .siblings (‹ 01 / 45 ▴ › + upward .versions popover) + Begin
    function renderNewStoryStageHTML(isMobile = false) {
      const c = getCard(activeCardId);
      const allOpenings = getCardOpenings(c);
      if (stageOpeningIdx >= allOpenings.length) stageOpeningIdx = 0;
      const currentOp = allOpenings[stageOpeningIdx] || allOpenings[0];

      const pid = personaByCard[c.id];
      const activePersona = PERSONAS.find((p) => p.id === pid);
      const pName = activePersona?.name ?? "卡片默认";
      const pBio = activePersona ? activePersona.bio : (c.character?.defaultPersona || "使用卡片默认来客设定");

      // Derive distinct tags for quick filtering across 45 openings
      const uniqueTags = Array.from(new Set(allOpenings.map((o) => o.tag)));
      const q = openingSearchQuery.trim().toLowerCase();
      const filteredOpenings = allOpenings.filter((o) => {
        if (openingTagFilter !== "all" && o.tag !== openingTagFilter) return false;
        if (!q) return true;
        return (
          o.firstLine.toLowerCase().includes(q) ||
          o.tag.toLowerCase().includes(q) ||
          String(o.idx + 1).padStart(2, "0").includes(q)
        );
      });

      const personaPillsHTML =
        c.id === "yandao"
          ? `<span style="font-size:var(--text-footnote); color:var(--ink-2);">无主角模式（导演指令通道，无需绑定玩家人设）</span>`
          : `
            <div class="newstory-persona-pills">
              <button
                type="button"
                class="persona-pill"
                aria-pressed="${pid === undefined ? "true" : "false"}"
                onclick="selectPersonaForCard('${c.id}', undefined)"
              >
                卡片默认
              </button>
              ${PERSONAS.map(
                (p) => `
                <button
                  type="button"
                  class="persona-pill"
                  aria-pressed="${pid === p.id ? "true" : "false"}"
                  onclick="selectPersonaForCard('${c.id}', '${p.id}')"
                >
                  ${escapeHtml(p.name)}
                </button>
              `
              ).join("")}
            </div>
            <p class="newstory-persona-bio" title="${escapeHtml(pBio)}">${escapeHtml(pBio)}</p>
          `;

      const tagFiltersHTML = [
        `<button type="button" class="opening-tag-filter" aria-pressed="${openingTagFilter === "all" ? "true" : "false"}" onclick="setOpeningTagFilter('all')">全部 (${allOpenings.length})</button>`,
        ...uniqueTags.map(
          (tag) => `
            <button
              type="button"
              class="opening-tag-filter"
              aria-pressed="${openingTagFilter === tag ? "true" : "false"}"
              onclick="setOpeningTagFilter('${escapeHtml(tag)}')"
            >
              ${escapeHtml(tag)}
            </button>
          `
        ),
      ].join("");

      const dirRowsHTML = filteredOpenings
        .map(
          (o) => `
          <button
            type="button"
            class="version"
            aria-current="${o.idx === stageOpeningIdx ? "true" : "false"}"
            onclick="selectOpeningIdx(${o.idx})"
          >
            <span class="below">${String(o.idx + 1).padStart(2, "0")}</span>
            <span class="first">${highlightMark(o.firstLine, openingSearchQuery)}</span>
            <span class="tag">${escapeHtml(o.tag)}</span>
          </button>
        `
        )
        .join("");

      const popoverRowsHTML = allOpenings
        .map(
          (o) => `
          <button
            type="button"
            role="menuitem"
            class="version"
            aria-current="${o.idx === stageOpeningIdx ? "true" : "false"}"
            onclick="selectOpeningIdx(${o.idx}); openingPopoverOpen = false; renderAll();"
          >
            <span class="below">${String(o.idx + 1).padStart(2, "0")}</span>
            <span class="first">${escapeHtml(o.firstLine)}</span>
            <span class="tag">${escapeHtml(o.tag)}</span>
          </button>
        `
        )
        .join("");

      return `
        <div class="stage-surface">
          <div class="stage-surface-body">
            <article class="newstory-sheet" aria-label="新建故事与开场选择">
              <!-- Left Column: Built-in Persona Picker + High-Capacity 45-Opening Directory -->
              <section class="newstory-side">
                <div class="newstory-title-row">
                  <div class="newstory-title-left">
                    <button type="button" class="icon sm" title="返回阅读器" aria-label="返回阅读器" onclick="setStageView('reader')">
                      ${ICONS.back}
                    </button>
                    <h1>新建故事 · ${escapeHtml(c.title)}</h1>
                  </div>
                  <span class="est mono">${allOpenings.length} 个开场</span>
                </div>

                <!-- Step 1: Built-in Persona Selection -->
                <div class="newstory-persona-box">
                  <div class="newstory-persona-top">
                    <span class="lbl">上场人设</span>
                    ${
                      c.id !== "yandao"
                        ? `<button type="button" style="font-size:var(--text-caption); color:var(--ink-2);" onclick="openPersonaModal()">详情 ▸</button>`
                        : ""
                    }
                  </div>
                  ${personaPillsHTML}
                </div>

                <!-- Step 2: 40-50 Openings Searchable & Filterable Directory -->
                <div class="opening-dir-head">
                  <div class="input-box">
                    ${ICONS.search}
                    <input
                      id="opening-search-input"
                      type="search"
                      placeholder="筛选 ${allOpenings.length} 个开场（首句 / 序号 / 状态标签）…"
                      value="${escapeHtml(openingSearchQuery)}"
                      oninput="onOpeningSearchInput(this.value)"
                    />
                  </div>
                  <div class="opening-tag-bar" role="toolbar" aria-label="按初始状态标签筛选">
                    ${tagFiltersHTML}
                  </div>
                </div>

                <div class="opening-dir-list wscroll" role="listbox" aria-label="开场列表">
                  ${dirRowsHTML || `<div style="padding:12px; color:var(--ink-3); font-size:var(--text-footnote);">无匹配的开场</div>`}
                </div>
              </section>

              <!-- Right Column: Production Opening Prose Well (.well > .wscroll) + Footer (.siblings + ~tokens + Begin) -->
              <section class="newstory-opening" aria-label="开场正文预览">
                <div class="well">
                  <div class="wscroll">
                    <p>${escapeHtml(currentOp.text)}</p>
                  </div>
                </div>

                <footer class="foot">
                  <span class="siblings">
                    <button
                      type="button"
                      class="step-icon"
                      aria-label="上一个开场"
                      ${stageOpeningIdx === 0 ? "disabled" : ""}
                      onclick="selectOpeningIdx(${stageOpeningIdx - 1})"
                    >
                      ${ICONS.caretLeft}
                    </button>
                    <button
                      type="button"
                      class="count"
                      aria-expanded="${openingPopoverOpen ? "true" : "false"}"
                      aria-label="展开开场列表"
                      onclick="toggleOpeningPopover()"
                    >
                      <span>${stageOpeningIdx + 1} / ${allOpenings.length}</span>
                      ${ICONS.caretUp}
                    </button>
                    ${
                      openingPopoverOpen
                        ? `<div class="versions-popover" role="menu">${popoverRowsHTML}</div>`
                        : ""
                    }
                    <button
                      type="button"
                      class="step-icon"
                      aria-label="下一个开场"
                      ${stageOpeningIdx === allOpenings.length - 1 ? "disabled" : ""}
                      onclick="selectOpeningIdx(${stageOpeningIdx + 1})"
                    >
                      ${ICONS.caretRight}
                    </button>
                  </span>

                  <span class="chip" style="height:24px; font-size:var(--text-caption);">${escapeHtml(currentOp.tag)}</span>
                  <span class="est mono">~${currentOp.tokens} tokens</span>

                  <button type="button" class="begin-btn" onclick="beginNewStoryFromCard('${c.id}')">
                    <span>以此开场开始</span>
                    ${ICONS.arrowRight}
                  </button>
                </footer>
              </section>
            </article>
          </div>
        </div>
      `;
    }

    // Route 2 (Top Card Header Click): Full-Page Card Dossier (Background, Character, Lorebook, Rules, Prompts)
    function renderCardPageStageHTML() {
      const c = getCard(activeCardId);
      const pid = personaByCard[c.id];
      const activePersona = PERSONAS.find((p) => p.id === pid);
      const pName = activePersona?.name ?? "卡片默认";

      let mainTabHTML = "";
      if (dossierTab === "character") {
        mainTabHTML = `
          <div class="dossier-content">
            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>世界背景设定 (World Frame)</h2>
                <span class="tag">card.frame · 常驻 Head</span>
              </div>
              <div class="dossier-block">
                <p>${escapeHtml(c.background || c.summary)}</p>
              </div>
            </section>

            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>Character 角色设定</h2>
                <span class="tag">card.character</span>
              </div>
              <div class="dossier-block">
                <h3>
                  <span>${escapeHtml(c.character?.name || c.title)}</span>
                  <span class="chip">${escapeHtml(c.character?.role || "")}</span>
                </h3>
                <p><strong>性格与行为准则：</strong>${escapeHtml(c.character?.traits || "")}</p>
                <p><strong>人物小传与暗线：</strong>${escapeHtml(c.character?.bio || "")}</p>
              </div>
            </section>

            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>来客 / 玩家人设位 (Persona Slot)</h2>

              </div>
              <div class="dossier-kv-grid">
                <div class="dossier-block">
                  <h3><span>卡片默认人设</span><span class="tag">fallback</span></h3>
                  <p>${escapeHtml(c.character?.defaultPersona || "未指定默认人设")}</p>
                </div>
                <div class="dossier-block">
                  <h3><span>当前生效人设：${escapeHtml(pName)}</span><span class="tag">active</span></h3>
                  <p>${escapeHtml(activePersona ? activePersona.bio : (c.character?.defaultPersona || "使用卡片默认设定"))}</p>
                </div>
              </div>
            </section>
          </div>
        `;
      } else if (dossierTab === "lore") {
        mainTabHTML = `
          <div class="dossier-content">
            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>世界书与设定词条 (Lorebook)</h2>
                <span class="tag">${escapeHtml(c.lore)} · lookup 节点按关键词与深度召回</span>
              </div>
              ${(c.loreEntries || [])
                .map(
                  (entry) => `
                  <div class="dossier-block">
                    <h3>
                      <span>${escapeHtml(entry.title)}</span>
                      <span class="chip" style="font-family:var(--font-mono)">${escapeHtml(entry.depth)} · 触发词: ${escapeHtml(entry.keys)}</span>
                    </h3>
                    <p>${escapeHtml(entry.body)}</p>
                  </div>
                `
                )
                .join("")}
            </section>
          </div>
        `;
      } else if (dossierTab === "rules") {
        mainTabHTML = `
          <div class="dossier-content">
            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>状态表与检定规则 (Status & Decide Rules)</h2>
                <span class="tag">${escapeHtml(c.rules)}</span>
              </div>
              ${(c.ruleDetails || [])
                .map(
                  (r) => `
                  <div class="dossier-block">
                    <h3><span>${escapeHtml(r.name)}</span></h3>
                    <p>${escapeHtml(r.desc)}</p>
                  </div>
                `
                )
                .join("")}
            </section>
          </div>
        `;
      } else if (dossierTab === "prompts") {
        mainTabHTML = `
          <div class="dossier-content">
            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>叙事文风与笔触设定 (Narrate Frame Prompt)</h2>
                <span class="tag">stage: narrate</span>
              </div>
              <pre class="dossier-prompt">${escapeHtml(c.prompts?.frame || "")}</pre>
            </section>

            <section class="dossier-sec">
              <div class="dossier-sec-head">
                <h2>角色禁令与视角边界 (Character & Stance Guard)</h2>
                <span class="tag">stage: narrate + check · ${(c.writingAll || []).join(" / ")}</span>

              </div>

      return `
        <div class="stage-surface">
          <header class="story-strip">
            ${
              sidebarCollapsed
                ? `<button type="button" class="icon sm" title="展开侧边栏" onclick="toggleSidebarCollapse()">${ICONS.sidebar}</button>`
                : ""
            }
            <button type="button" class="icon sm" title="返回阅读器" onclick="setStageView('reader')">
              ${ICONS.back}
            </button>
            <span class="strip-story-name">${escapeHtml(c.title)} · 卡片设定档案</span>
            <div class="strip-tools">
              <button type="button" class="chip" onclick="openNewStoryPicker('${c.id}')">
                ${ICONS.plus} <span>挑开场新建故事</span>

          </header>
          <div class="dossier-layout">
            <aside class="dossier-rail">
