<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>骨架原型之一：三层立体空间、正负空间反转与自适应正文 (#117)</title>
  <!--
    骨架原型方向说明（#117）：
    1. 三层立体空间：底层副空间（顶部全局壳层条 + 左侧双层导航）→ 中层实体主卡片（阅读器与各全幅功能页吃满主舞台）→ 上层临时挂载卡（右侧读数与指标按需窄幅滑出，底层主舞台背景虚化聚焦）。
    2. 正负空间反转与宽度重置：左栏收起后不留图标轨；触碰屏幕左缘时，左栏由底层负空间反转为上层正空间悬浮卡；点击左上角入口可在原位落锁回底层负空间。主卡片左缘支持有界阻尼拖拽与向左阶梯顿挫闭合；任何收起动作都会清空临时拉拽宽度，重开时始终回到居中的默认宽度。
    3. 正文与输入框宽度解耦：底部输入框保持紧凑的独立宽度上限，上方正文随主卡片宽度自适应舒展并跟手重排。
  -->
  <style>
    /* ───────── 1. Tokens (Exact match with packages/client/src/tokens.css) ───────── */
    :root {
      color-scheme: light dark;

      --surface-0: light-dark(#f3f2ee, #0a0a0a);
      --surface-1: light-dark(#fcfcfb, #141414);
      --surface-2: light-dark(#ffffff, #1a1a19);
      --surface-3: light-dark(#ffffff, #20201f);

      --ink: light-dark(#151515, #f5f5f5);
      --ink-2: light-dark(#525252, #a3a3a3);
      --ink-3: light-dark(#8a8a8a, #6f6f6f);

      --alpha-1: light-dark(rgb(20 20 20 / 0.05), rgb(255 255 255 / 0.05));
      --alpha-2: light-dark(rgb(20 20 20 / 0.1), rgb(255 255 255 / 0.09));
      --alpha-3: light-dark(rgb(20 20 20 / 0.2), rgb(255 255 255 / 0.18));
      --alpha-4: light-dark(rgb(20 20 20 / 0.35), rgb(255 255 255 / 0.3));

      --line: var(--alpha-2);
      --line-strong: var(--alpha-3);
      --fill: var(--alpha-2);
      --ghost-hover: var(--alpha-1);
      --ghost-active: var(--alpha-2);

      --primary: var(--ink);
      --primary-ink: var(--surface-1);
      --danger: light-dark(#dc2626, #f87171);
      --ok: light-dark(#1f7a3f, #4ade80);
      --warn-soft: light-dark(rgb(217 119 6 / 0.14), rgb(251 191 36 / 0.16));
      --scrim: light-dark(rgb(243 242 238 / 0.52), rgb(10 10 10 / 0.56));
      --peek-dim: light-dark(rgb(15 15 15 / 0.14), rgb(0 0 0 / 0.42));
      --ring: var(--alpha-4);

      --hairline: 1px;
      --shadow-1:
        0 1px 2px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 2px 8px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-2:
        0 2px 4px light-dark(rgb(0 0 0 / 0.04), rgb(0 0 0 / 0.45)),
        0 8px 24px light-dark(rgb(0 0 0 / 0.07), rgb(0 0 0 / 0.5)),
        inset 0 0 0 var(--hairline) var(--line);
      --shadow-pop:
        inset 0 0 0 1px light-dark(transparent, rgb(255 255 255 / 0.1)),
        0 0 0 1px light-dark(var(--line), transparent),
        0 14px 36px light-dark(rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.72)),
        0 3px 10px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.5));
      --shadow-composer:
        0 4px 20px light-dark(rgb(0 0 0 / 0.035), rgb(0 0 0 / 0.4)),
        inset 0 0 0 1px var(--line);

      --radius-sm: 4px;
      --radius: 8px;
      --radius-card: 12px;
      --radius-composer: 14px;
      --radius-dialog: 14px;
      --radius-pill: 999px;

      --control: 32px;
      --control-sm: 26px;
      --icon: 18px;
      --icon-sm: 15px;

      --font-sans:
        system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

      --text-caption: 0.6875rem;
      --text-footnote: 0.75rem;
      --text-body: 0.875rem;
      --text-heading: 0.9375rem;
      --text-prose: 1rem;
      --text-title: 1.2rem;

      --leading-tight: 1.25;
      --leading-body: 1.45;
      --leading-prose: 1.75;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;

      --side-w: 260px;
      --mount-w: 18.5rem;
      --shell-top: 38px;
      --topbar: 44px;
      --fade: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --dur-2: 140ms;
      --dur-3: 230ms;
      --dur-4: 280ms;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-pulse: cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    @media (resolution >= 2x) {
      :root { --hairline: 0.5px; }
    }
    @media (prefers-reduced-motion: reduce) {
      :root {
        --dur-2: 0ms;
        --dur-3: 0ms;
        --dur-4: 0ms;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      color: var(--ink);
      background: var(--surface-0);
      display: flex;
      flex-direction: column;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
    }
    button {
      cursor: pointer;
      user-select: none;
    }
    button:disabled {
      opacity: 0.38;
      cursor: default;
    }
    mark {
      background: var(--warn-soft);
      color: var(--ink);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ───────── 2. Shared Primitives (.icon, .chip, .input-box, .busy-dot) ───────── */
    .icon {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      flex: none;
      position: relative;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .icon:active:not(:disabled) {
      background: var(--ghost-active);
    }
    .icon svg {
      width: var(--icon);
      height: var(--icon);
    }
    .icon.sm {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: 6px;
    }
    .icon.sm svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }

    .chip {
      height: var(--control-sm);
      padding: 0 10px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      flex: none;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    button.chip:hover:not(:disabled) {
      background: var(--fill);
      color: var(--ink);
    }
    button.chip svg {
      width: 14px;
      height: 14px;
      color: var(--ink-3);
    }
    button.chip[data-active="true"] {
      background: var(--ink);
      color: var(--surface-1);
    }
    button.chip[data-active="true"] svg {
      color: var(--surface-1);
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: 30px;
      padding: 0 var(--space-2);
      border-radius: var(--radius);
      background: var(--alpha-1);
      width: 100%;
      flex: none;
      transition: box-shadow var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
    }
    .input-box:focus-within {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 var(--hairline) var(--line-strong);
    }
    .input-box svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
      color: var(--ink-3);
      flex: none;
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      outline: none;
      font-size: var(--text-footnote);
    }
    .input-box input::placeholder {
      color: var(--ink-3);
    }

    .busy-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
      display: inline-block;
      flex: none;
    }
    @media (prefers-reduced-motion: no-preference) {
      .busy-dot {
        animation: pulseDot 1.4s var(--ease-pulse) infinite;
      }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.28; transform: scale(0.82); }
    }

    .scroller {
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
      transition: scrollbar-color var(--dur-2) var(--ease);
    }
    .scroller:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    /* ───────── 3. Viewport Host (Supports Native Responsive + Preset Width Simulation) ───────── */
    .viewport-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: stretch;
      overflow: hidden;
      position: relative;
    }
    .viewport-frame {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--surface-0);
      transition: width var(--dur-3) var(--ease);
      position: relative;
      overflow: hidden;
    }
    .viewport-stage[data-sim="1312"] .viewport-frame {
      width: 1312px;
      max-width: 100%;
      box-shadow: 0 0 0 1px var(--line);
    }
    .viewport-stage[data-sim="1280"] .viewport-frame {
      width: 1280px;
      max-width: 100%;
      box-shadow: 0 0 0 1px var(--line);
    }
    .viewport-stage[data-sim="1152"] .viewport-frame {
      width: 1152px;
      max-width: 100%;
      box-shadow: 0 0 0 1px var(--line);
    }
    .viewport-stage[data-sim="390"] {
      align-items: center;
      padding: var(--space-3) var(--space-3) 56px;
    }
    .viewport-stage[data-sim="390"] .viewport-frame {
      width: 390px;
      height: min(812px, 100%);
      border-radius: 32px;
      background: var(--surface-1);
      box-shadow:
        0 0 0 6px light-dark(#e4e4e0, #252524),
        var(--shadow-2);
    }

    /* ───────── 4. Linear-Style Shell Top Strip (.shell-top, 38px in --surface-0) ───────── */
    .shell-top {
      height: var(--shell-top);
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
      background: var(--surface-0);
      position: relative;
      z-index: 30;
      user-select: none;
    }
    .shell-tab {
      height: 24px;
      padding: 0 9px;
      border-radius: 6px;
      background: var(--alpha-1);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      color: var(--ink);
      font-size: var(--text-footnote);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 18rem;
    }
    .shell-tab .card-badge {
      color: var(--ink-2);
    }
    .shell-tab .tab-sep {
      color: var(--ink-3);
    }
    .shell-tab .tab-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ───────── 5. Canvas & Linear Figure-Ground Inversion (Z-0 Negative ↔ Z-2 Positive) ───────── */
    .canvas {
      flex: 1;
      min-width: 0;
      min-height: 0;
      position: relative;
      display: flex;
      padding: 0 8px 44px 0;
      background: var(--surface-0);
    }
    .canvas[data-resizing="true"] {
      user-select: none;
      cursor: col-resize;
    }

    .left-edge-sensor {
      position: absolute;
      top: 0;
      bottom: 44px;
      left: 0;
      width: 10px;
      z-index: 25;
      display: none;
    }
    .canvas[data-left-collapsed="true"][data-left-peek="false"] .left-edge-sensor {
      display: block;
    }

    .sidebar-space {
      position: absolute;
      top: 0;
      bottom: 44px;
      left: 0;
      width: var(--side-w);
      z-index: 1;
      background: transparent;
      border-radius: 0 var(--radius-dialog) var(--radius-dialog) 0;
      box-shadow: none;
      translate: 0 0;
      opacity: 1;
      overflow: hidden;
      transition:
        translate var(--dur-3) var(--ease),
        opacity var(--dur-3) var(--ease),
        background var(--dur-3) var(--ease),
        box-shadow var(--dur-3) var(--ease);
    }
    .canvas[data-left-collapsed="true"][data-left-peek="false"] .sidebar-space {
      translate: -76px 0;
      opacity: 0;
      pointer-events: none;
    }
    .canvas[data-left-collapsed="true"][data-left-peek="true"] .sidebar-space {
      z-index: 20;
      translate: 0 0;
      opacity: 1;
      pointer-events: auto;
      background: var(--surface-1);
      box-shadow: var(--shadow-pop);
    }

    .sidebar-inner {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .side-top {
      height: 34px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
    }
    .back-shelf-btn {
      height: 24px;
      padding: 0 8px 0 4px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--text-footnote);
      font-weight: 500;
      color: var(--ink-2);
      transition: opacity var(--dur-2) var(--ease), background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .back-shelf-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .back-shelf-btn svg {
      width: 13px;
      height: 13px;
      color: var(--ink-3);
    }
    .sidebar-inner[data-layer="shelf"] .back-shelf-btn {
      opacity: 0;
      pointer-events: none;
    }
    .shelf-layer-label {
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-3);
      letter-spacing: 0.02em;
      padding-left: 2px;
    }
    .sidebar-inner[data-layer="workspace"] .shelf-layer-label {
      display: none;
    }

    /* Sliding Mid-Section (.side-mid > .side-track > .pane-shelf + .pane-workspace) */
    .side-mid {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }
    .side-track {
      width: 200%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      transition: transform var(--dur-3) var(--ease);
    }
    .sidebar-inner[data-layer="shelf"] .side-track {
      transform: translateX(0%);
    }
    .sidebar-inner[data-layer="workspace"] .side-track {
      transform: translateX(-50%);
    }

    .side-pane {
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: 2px 12px var(--space-2);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    /* Layer A (Shelf): Card Search + Card List */
    .shelf-list {
      flex: 1;
      min-height: 0;
      list-style: none;
      margin: 0 -4px;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .shelf-item {
      width: 100%;
      text-align: left;
      padding: 6px 8px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: background var(--dur-2) var(--ease);
    }
    .shelf-item:hover {
      background: var(--ghost-hover);
    }
    .shelf-item[aria-current="true"] {
      background: var(--fill);
    }
    .shelf-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-width: 0;
    }
    .shelf-item-title {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shelf-item-summary {
      margin: 0;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Layer B (Workspace): Card Head + Story Search + Story List + Bottom "＋ 新建故事" */
    .cardhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      width: 100%;
      padding: 5px 8px;
      border-radius: 6px;
      text-align: left;
      flex: none;
      transition: background var(--dur-2) var(--ease);
    }
    .cardhead:hover {
      background: var(--ghost-hover);
    }
    .cardhead[aria-current="page"] {
      background: var(--fill);
    }
    .cardhead h1 {
      margin: 0;
      font-size: var(--text-title);
      font-weight: 650;
      line-height: var(--leading-tight);
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cardhead .enter {
      flex: none;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: var(--alpha-1);
      color: var(--ink-3);
      display: inline-grid;
      place-items: center;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .cardhead .enter svg {
      width: 12px;
      height: 12px;
    }
    .cardhead[aria-current="page"] .enter {
      background: var(--alpha-2);
      color: var(--ink);
    }

    .story-list {
      flex: 1;
      min-height: 0;
      list-style: none;
      margin: 0 -4px;
      padding: 0 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .story-row {
      width: 100%;
      min-height: 29px;
      padding: 0 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      text-align: left;
      transition: background var(--dur-2) var(--ease);
    }
    .story-row:hover {
      background: var(--ghost-hover);
    }
    .story-row[aria-current="true"] {
      background: var(--fill);
    }
    .story-name {
      flex: 1;
      min-width: 0;
      font-size: var(--text-body);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story-row[aria-current="true"] .story-name {
      font-weight: 600;
    }
    .story-name.unnamed {
      color: var(--ink-2);
    }

    .new-story-btn {
      flex: none;
      width: 100%;
      height: 30px;
      padding: 0 var(--space-3);
      border-radius: 6px;
      background: var(--alpha-1);
      color: var(--ink);
      font-size: var(--text-footnote);
      font-weight: 550;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background var(--dur-2) var(--ease);
    }
    .new-story-btn:hover {
      background: var(--fill);
    }
    .new-story-btn[aria-current="page"] {
      background: var(--ink);
      color: var(--surface-1);
    }
    .new-story-btn svg {
      width: 14px;
      height: 14px;
    }

    /* Shared Footer (.side-foot) */
    .side-foot {
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex: none;
    }
    .side-foot-left {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .sidebar-inner[data-layer="shelf"] .mgr-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* ───────── 6. Z-1 Main Entity Card (.stage & .stage-card) + Damped Left-Edge Resizer ───────── */
    .stage {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      margin-left: var(--side-w);
      position: relative;
      z-index: 2;
      display: flex;
      transition: margin-left var(--dur-3) var(--ease);
    }
    .canvas[data-resizing="true"]:not([data-snap-animating="true"]) .stage {
      transition: none;
    }
    .canvas[data-left-collapsed="true"] .stage {
      margin-left: 8px;
    }

    .stage-resizer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -5px;
      width: 10px;
      z-index: 10;
      cursor: col-resize;
    }
    .canvas[data-left-collapsed="true"] .stage-resizer {
      display: none;
    }

    .stage-card {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      position: relative;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .peek-scrim {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: var(--peek-dim);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-3) var(--ease);
    }
    .canvas[data-left-collapsed="true"][data-left-peek="true"] .peek-scrim {
      opacity: 1;
    }

    /* ───────── 7. Stage Strip (Clean Header Inside Main Entity Card) ───────── */
    .strip {
      height: var(--topbar);
      padding: 0 var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: none;
      min-width: 0;
      box-shadow: inset 0 calc(-1 * var(--hairline)) 0 var(--line);
    }
    .strip-crumb {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: var(--text-body);
      margin-right: 4px;
    }
    .strip-crumb .c-title {
      color: var(--ink-2);
      font-weight: 500;
      white-space: nowrap;
      flex: none;
    }
    .strip-crumb .sep {
      color: var(--ink-3);
      flex: none;
    }
    .strip-crumb .s-title {
      color: var(--ink);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .strip-crumb .s-title.unnamed {
      color: var(--ink-2);
      font-weight: 500;
    }
    .strip-page-title {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .strip-right {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }

    /* ───────── 8. Reader Column: Fluid Responsive Prose Width Decoupled from Composer ───────── */
    .reader-scroll {
      flex: 1;
      min-height: 0;
      padding: var(--space-5) var(--space-6) var(--fade);
      mask-image: linear-gradient(to bottom, transparent, #000 var(--fade), #000 calc(100% - var(--fade)), transparent);
    }
    /*
     * Fluid Prose Column:
     * Scales smoothly with the Stage Card's available width (76% of stage card, between 42rem=672px and 62rem=992px),
     * so collapsing or narrowing the sidebar genuinely expands the reading measure and shows more text per line!
     */
    .reader-main {
      max-width: clamp(42rem, 76%, 62rem);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      contain: layout style;
      overflow-wrap: anywhere;
    }
    .turn-sec {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      overflow-anchor: auto;
    }
    .spoke {
      align-self: flex-end;
      max-width: 78%;
    }
    .said {
      padding: 8px 13px;
      border-radius: 14px 14px 4px 14px;
      background: var(--fill);
      color: var(--ink);
      font-size: var(--text-prose);
      line-height: var(--leading-body);
      line-break: strict;
    }
    .prose {
      font-size: var(--text-prose);
      line-height: var(--leading-prose);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      line-break: strict;
      white-space: pre-wrap;
    }
    .prose p { margin: 0; }
    .turn-foot {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--ink-3);
      font-size: var(--text-footnote);
    }
    .record-pill {
      height: var(--control-sm);
      padding: 0 7px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .record-pill svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }

    .composer-slot {
      padding: 0 var(--space-6) calc(var(--space-4) + var(--safe-bottom));
      flex: none;
    }
    /* Composer has its own ergonomic width cap (42rem..50rem = 672px..800px) so it never bottlenecks prose above! */
    .composer-box {
      max-width: clamp(42rem, 62%, 50rem);
      width: 100%;
      margin: 0 auto;
      height: 42px;
      padding: 0 var(--space-1);
      border-radius: var(--radius-composer);
      background: var(--surface-3);
      box-shadow: var(--shadow-composer);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }
    .composer-box input {
      flex: 1;
      min-width: 0;
      outline: none;
      padding: 0 var(--space-1);
      font-size: var(--text-body);
    }
    .composer-box input::placeholder {
      color: var(--ink-3);
    }
    .send-btn {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: var(--primary-ink);
      display: inline-grid;
      place-items: center;
      flex: none;
    }
    .send-btn svg {
      width: var(--icon);
      height: var(--icon);
    }

    /* ───────── 9. Z-2 Mounted Right Card (.mount-scrim + .mount-drawer, Provider-style Slide-Out) ───────── */
    .mount-scrim {
      position: absolute;
      inset: 0;
      z-index: 6;
      background: var(--scrim);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-3) var(--ease);
    }
    .mount-scrim[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .mount-drawer {
      position: absolute;
      inset: var(--space-3) var(--space-3) var(--space-3) auto;
      z-index: 7;
      width: min(var(--mount-w), calc(100% - 2 * var(--space-3)));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: var(--radius-dialog);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      translate: calc(100% + var(--space-4)) 0;
      visibility: hidden;
      transition:
        translate var(--dur-3) var(--ease),
        visibility var(--dur-3) allow-discrete;
    }
    .mount-drawer[data-open="true"] {
      translate: 0 0;
      visibility: visible;
    }

    .mount-head {
      flex: none;
      height: 48px;
      padding: 0 var(--space-3) 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      box-shadow: inset 0 calc(-1 * var(--hairline)) 0 var(--line);
    }
    .mount-tabs {
      display: inline-flex;
      padding: 2px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      gap: 2px;
    }
    .mount-tab {
      height: 24px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: var(--text-footnote);
      font-weight: 550;
      color: var(--ink-2);
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .mount-tab[aria-selected="true"] {
      background: var(--surface-2);
      color: var(--ink);
      box-shadow: var(--shadow-1);
    }
    .mount-body {
      flex: 1;
      min-height: 0;
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }
    .glance-sec {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .glance-sec h2 {
      margin: 0;
      font-size: var(--text-footnote);
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--ink-3);
      text-transform: uppercase;
    }
    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 4px 0;
    }
    .meter-top {
      display: flex;
      justify-content: space-between;
      font-size: var(--text-footnote);
    }
    .meter-top .label { font-weight: 600; }
    .meter-top .val {
      font-family: var(--font-mono);
      color: var(--ink-2);
    }
    .meter-track {
      height: 6px;
      border-radius: 3px;
      background: var(--alpha-2);
      overflow: hidden;
      position: relative;
    }
    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--ink);
      border-radius: 3px;
    }
    .note-row {
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-size: var(--text-footnote);
      color: var(--ink-2);
      line-height: 1.45;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-2);
    }
    .metric-box {
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-box .k {
      font-size: var(--text-caption);
      color: var(--ink-3);
    }
    .metric-box .v {
      font-family: var(--font-mono);
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
    }

    /* Placeholder Body for the Other 6 Full-Stage Views */
    .stage-placeholder {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-6);
      color: var(--ink-2);
      text-align: center;
    }
    .stage-placeholder h2 {
      margin: 0;
      font-size: var(--text-title);
      color: var(--ink);
      font-weight: 600;
    }
    .stage-placeholder p {
      margin: 0;
      max-width: 28rem;
      font-size: var(--text-body);
      color: var(--ink-3);
    }

    /* ───────── 10. Mobile (< 72rem or 390px Frame): Topbar, Drawer (<dialog>) & Sheet (<dialog>) ───────── */
    .mobile-topbar {
      display: none;
      height: var(--topbar);
      padding: 0 var(--space-2);
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      flex: none;
    }
    .mobile-crumb-btn {
      flex: 1;
      min-width: 0;
      height: var(--control);
      padding: 0 var(--space-2);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: var(--text-body);
    }
    .mobile-crumb-btn:hover {
      background: var(--ghost-hover);
    }
    .mobile-crumb-btn .c-name {
      color: var(--ink-2);
      font-weight: 500;
      white-space: nowrap;
    }
    .mobile-crumb-btn .s-name {
      color: var(--ink);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mobile-crumb-btn svg {
      width: 12px;
      height: 12px;
      color: var(--ink-3);
      flex: none;
    }

    dialog.drawer {
      margin: 0;
      padding: 0;
      border: 0;
      width: min(17rem, 84vw);
      height: 100dvh;
      max-height: 100dvh;
      background: var(--surface-1);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      transform: translateX(-100%);
      transition:
        transform var(--dur-3) var(--ease),
        overlay var(--dur-3) allow-discrete,
        display var(--dur-3) allow-discrete;
    }
    dialog.drawer[open] {
      display: flex;
      transform: translateX(0);
    }
    dialog.drawer::backdrop {
      background: var(--scrim);
      opacity: 0;
      transition:
        opacity var(--dur-3) var(--ease),
        overlay var(--dur-3) allow-discrete,
        display var(--dur-3) allow-discrete;
    }
    dialog.drawer[open]::backdrop {
      opacity: 1;
    }
    @starting-style {
      dialog.drawer[open] { transform: translateX(-100%); }
      dialog.drawer[open]::backdrop { opacity: 0; }
    }

    dialog.sheet {
      margin: auto auto 0;
      padding: 0;
      border: 0;
      width: min(26rem, 100vw);
      border-radius: var(--radius-dialog) var(--radius-dialog) 0 0;
      background: var(--surface-2);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      transform: translateY(100%);
      transition:
        transform var(--dur-3) var(--ease),
        overlay var(--dur-3) allow-discrete,
        display var(--dur-3) allow-discrete;
    }
    dialog.sheet[open] {
      display: flex;
      flex-direction: column;
      transform: translateY(0);
    }
    dialog.sheet::backdrop {
      background: var(--scrim);
      opacity: 0;
      transition:
        opacity var(--dur-3) var(--ease),
        overlay var(--dur-3) allow-discrete,
        display var(--dur-3) allow-discrete;
    }
    dialog.sheet[open]::backdrop {
      opacity: 1;
    }
    @starting-style {
      dialog.sheet[open] { transform: translateY(100%); }
      dialog.sheet[open]::backdrop { opacity: 0; }
    }
    .sheet-head {
      height: var(--topbar);
      padding: 0 var(--space-3) 0 var(--space-4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 var(--hairline) 0 var(--line);
    }
    .sheet-head h2 {
      margin: 0;
      font-size: var(--text-heading);
      font-weight: 600;
    }
    .sheet-body {
      padding: var(--space-3) var(--space-4) calc(var(--space-4) + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .sheet-row {
      height: var(--control);
      padding: 0 var(--space-3);
      border-radius: var(--radius);
      background: var(--alpha-1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--text-body);
    }
    .sheet-row:hover {
      background: var(--fill);
    }
    .sheet-row .lbl {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-weight: 500;
    }
    .sheet-row .lbl svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
      color: var(--ink-2);
    }
    .sheet-row .val {
      color: var(--ink-2);
      font-size: var(--text-footnote);
    }

    /* Responsive Breakpoint (< 72rem = 1152px) or Simulated 390px Mode */
    @media (max-width: 71.99rem) {
      .shell-top,
      .sidebar-space,
      .left-edge-sensor,
      .stage-resizer {
        display: none !important;
      }
      .canvas {
        padding: 0 0 44px;
      }
      .stage {
        margin-left: 0 !important;
      }
      .stage-card {
        border-radius: 0;
        box-shadow: none;
      }
      .stage[data-stage="reader"] .strip {
        display: none;
      }
      .mobile-topbar {
        display: flex;
      }
      .reader-scroll {
        padding-inline: var(--space-4);
      }
      .reader-main,
      .composer-box {
        max-width: 100%;
      }
      .composer-slot {
        padding-inline: var(--space-3);
      }
    }
    .viewport-stage[data-sim="390"] .shell-top,
    .viewport-stage[data-sim="390"] .sidebar-space,
    .viewport-stage[data-sim="390"] .left-edge-sensor,
    .viewport-stage[data-sim="390"] .stage-resizer {
      display: none !important;
    }
    .viewport-stage[data-sim="390"] .canvas {
      padding: 0;
    }
    .viewport-stage[data-sim="390"] .stage {
      margin-left: 0 !important;
    }
    .viewport-stage[data-sim="390"] .stage-card {
      border-radius: 0;
      box-shadow: none;
    }
    .viewport-stage[data-sim="390"] .stage[data-stage="reader"] .strip {
      display: none;
    }
    .viewport-stage[data-sim="390"] .mobile-topbar {
      display: flex;
    }
    .viewport-stage[data-sim="390"] .reader-scroll {
      padding-inline: var(--space-4);
    }
    .viewport-stage[data-sim="390"] .reader-main,
    .viewport-stage[data-sim="390"] .composer-box {
      max-width: 100%;
    }
    .viewport-stage[data-sim="390"] .composer-slot {
      padding-inline: var(--space-3);
    }

    /* ───────── 11. Prototype Control Bar ───────── */
    .proto-bar {
      position: fixed;
      bottom: 8px;
      left: 50%;
      translate: -50% 0;
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-caption);
      max-width: calc(100vw - 16px);
      overflow-x: auto;
      white-space: nowrap;
    }
    .proto-bar button {
      height: 22px;
      padding: 0 8px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-weight: 500;
    }
    .proto-bar button:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .proto-bar button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
    }
    .proto-bar .sep {
      width: 1px;
      height: 12px;
      background: var(--line);
      margin: 0 2px;
    }
    .proto-readout {
      font-family: var(--font-mono);
      color: var(--ink-3);
      padding: 0 6px;
    }
  </style>
</head>
<body>
  <div id="viewport-stage" class="viewport-stage" data-sim="auto">
    <div id="viewport-frame" class="viewport-frame">
      <!-- Mobile Topbar (< 72rem or 390px mode) -->
      <header class="mobile-topbar">
        <button type="button" class="icon" aria-label="打开抽屉" onclick="openMobileDrawer()">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16ZM216,184H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
        </button>
        <button type="button" class="mobile-crumb-btn" id="mobile-crumb-btn" onclick="openMobileSheet()">
          <span class="c-name" id="m-card-name"></span>
          <span style="color:var(--ink-3)">›</span>
          <span class="s-name" id="m-story-name"></span>
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
        </button>
        <button type="button" class="icon" aria-label="状态与指标" onclick="toggleRightMount()">
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M224,200h-8V40a8,8,0,0,0-8-8H152a8,8,0,0,0-8,8V80H96a8,8,0,0,0-8,8v40H48a8,8,0,0,0-8,8v64H32a8,8,0,0,0,0,16H224a8,8,0,0,0,0-16ZM160,48h40V200H160ZM104,96h40V200H104ZM56,144H88v56H56Z"/></svg>
        </button>
      </header>

      <!-- Desktop Shell Top Strip (.shell-top, 38px in --surface-0, Linear Style) -->
      <header class="shell-top" id="shell-top">
        <button
          type="button"
          class="icon sm"
          id="left-toggle-btn"
          aria-label="切换导航侧栏"
          onclick="onLeftToggleClick()"
        >
          <svg viewBox="0 0 256 256" fill="currentColor"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40ZM40,56H80V200H40ZM216,200H96V56H216Z"/></svg>
        </button>

        <button type="button" class="shell-tab" id="shell-tab" onclick="backToReader()">
          <span class="card-badge" id="shell-tab-card">竹林</span>
          <span class="tab-sep">›</span>
          <span class="tab-title" id="shell-tab-title">短剑与孤坟</span>
        </button>
      </header>

      <!-- Desktop Canvas: Z-0/Z-2 Left Sidebar Space + Z-1 Main Entity Card (+ Z-2 Mounted Right Drawer) -->
      <div id="canvas" class="canvas" data-left-collapsed="false" data-left-peek="false">
        <div id="left-edge-sensor" class="left-edge-sensor"></div>

        <!-- Left Sidebar: Z-0 Negative Space when Docked, flips to Z-2 Positive Space when Peeking! -->
        <aside id="sidebar-space" class="sidebar-space" aria-label="导航侧栏">
          <div id="desktop-sidebar-host" style="height:100%;"></div>
        </aside>

        <!-- Z-1: Main Entity Card -->
        <div id="stage" class="stage" data-stage="reader">
          <div id="stage-resizer" class="stage-resizer"></div>

          <section class="stage-card" aria-label="主舞台">
            <header id="stage-strip" class="strip"></header>
            <div id="stage-body" style="flex:1; min-height:0; display:flex; flex-direction:column;"></div>

            <div class="peek-scrim" aria-hidden="true"></div>

            <!-- Z-2: Backdrop Blur Scrim & Narrow Mounted Right Card (Status & Metrics) -->
            <div id="mount-scrim" class="mount-scrim" data-open="false" onclick="closeRightMount()"></div>
            <aside id="mount-drawer" class="mount-drawer" data-open="false" aria-label="局内读数与指标">
              <div class="mount-head">
                <div class="mount-tabs" role="tablist">
                  <button
                    type="button"
                    class="mount-tab"
                    id="tab-status"
                    role="tab"
                    aria-selected="true"
                    onclick="setMountTab('status')"
                  >
                    状态 Status
                  </button>
                  <button
                    type="button"
                    class="mount-tab"
                    id="tab-metrics"
                    role="tab"
                    aria-selected="false"
                    onclick="setMountTab('metrics')"
                  >
                    指标 Metrics
                  </button>
                </div>

    const SIDE_DEFAULT = 260;
    const SIDE_MIN = 200;
    const SIDE_MAX = 320;

    const SNAP_OPEN_X = 136;   // Pulling right past 136px while closed smoothly glides open

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function highlightMark(text, q) {
      if (!q.trim()) return escapeHtml(text);
      const needle = q.trim();
      const idx = text.toLowerCase().indexOf(needle.toLowerCase());
      if (idx < 0) return escapeHtml(text);
      return (
        escapeHtml(text.slice(0, idx)) +
        `<mark>${escapeHtml(text.slice(idx, idx + needle.length))}</mark>` +
        escapeHtml(text.slice(idx + needle.length))
      );
    }

    function getCard(id) {
      return DATA.cards.find((c) => c.id === id) || DATA.cards[0];

      return DATA.stories.stories.find((s) => s.id === id) || null;

        .filter((s) => s.card === cardId)

      return DATA.personas.find((p) => p.id === pid)?.name ?? "卡片默认";

    function updateSidebarInstance(prefix) {
      const inner = document.getElementById(`${prefix}-inner`);
      if (!inner) return;
      inner.setAttribute("data-layer", sidebarLayer);

      const paneShelf = document.getElementById(`${prefix}-pane-shelf`);
      const paneWorkspace = document.getElementById(`${prefix}-pane-workspace`);
      if (sidebarLayer === "shelf") {
        paneShelf.removeAttribute("inert");
        paneWorkspace.setAttribute("inert", "");
      } else {
        paneShelf.setAttribute("inert", "");
        paneWorkspace.removeAttribute("inert");
      }

      const otherBusy = DATA.stories.stories.some((s) => s.card !== workspaceCardId && s.busy !== null);
      document.getElementById(`${prefix}-other-busy-slot`).innerHTML = otherBusy
        ? `<i class="busy-dot" aria-label="其他卡片有进行中的局"></i>`
        : "";

      const cInput = document.getElementById(`${prefix}-card-search`);
      if (cInput && cInput.value !== cardQuery) cInput.value = cardQuery;
      const sInput = document.getElementById(`${prefix}-story-search`);
      if (sInput && sInput.value !== storyQuery) sInput.value = storyQuery;

      const cq = cardQuery.trim().toLowerCase();
      const filteredCards = DATA.cards.filter(
        (c) => !cq || c.title.toLowerCase().includes(cq) || (c.summary && c.summary.toLowerCase().includes(cq))

    let resetSideVarTimer = 0;

    /**
     * Collapses the sidebar and clears any temporary resize width memory back to SIDE_DEFAULT (260px).
     * Delays updating CSS --side-w by 180ms so the underlying Z-0 sidebar doesn't jump width mid-slide,
     * while immediately committing SIDE_DEFAULT if Peek or Expand happens before 180ms.
     */
    function collapseSidebarAndResetWidth() {
      leftCollapsed = true;
      leftPeek = false;
      sideWidth = SIDE_DEFAULT;
      localStorage.setItem("et-skeleton-left-collapsed", "true");
      localStorage.setItem("et-skeleton-side-w", String(SIDE_DEFAULT));
      clearTimeout(resetSideVarTimer);
      resetSideVarTimer = setTimeout(() => {
        document.documentElement.style.setProperty("--side-w", `${SIDE_DEFAULT}px`);
      }, 180);
      syncCanvasAttributes();
    }

    function expandSidebarAtDefaultWidth() {
      clearTimeout(resetSideVarTimer);
      leftCollapsed = false;
      leftPeek = false;
      sideWidth = SIDE_DEFAULT;
      document.documentElement.style.setProperty("--side-w", `${SIDE_DEFAULT}px`);
      localStorage.setItem("et-skeleton-left-collapsed", "false");
      localStorage.setItem("et-skeleton-side-w", String(SIDE_DEFAULT));
      syncCanvasAttributes();
    }

    // ───────── 6. Left-Edge Peek & Figure-Ground Inversion (Linear 00:17–00:25) ─────────
    (function initLinearChoreography() {
      const toggleBtn = document.getElementById("left-toggle-btn");
      const sensor = document.getElementById("left-edge-sensor");
      const sidebar = document.getElementById("sidebar-space");
      let peekCloseTimer = null;

      function openPeek() {
        clearTimeout(peekCloseTimer);
        if (!leftCollapsed) return;
        // Always ensure Positive-Space Peek opens at the centered default width (SIDE_DEFAULT = 260px)
        clearTimeout(resetSideVarTimer);
        sideWidth = SIDE_DEFAULT;
        document.documentElement.style.setProperty("--side-w", `${SIDE_DEFAULT}px`);
        if (!leftPeek) {
          leftPeek = true;
          syncCanvasAttributes();
        }
      }

      function scheduleClosePeek(delayMs = 90) {
        clearTimeout(peekCloseTimer);
        peekCloseTimer = setTimeout(() => {
          if (leftPeek) {
            leftPeek = false;
            syncCanvasAttributes();
          }
        }, delayMs);
      }

      sensor.addEventListener("pointerenter", () => {
        if (leftCollapsed) {
          openPeek();
        }
      });

      sidebar.addEventListener("pointerenter", () => {
        clearTimeout(peekCloseTimer);
      });
      sidebar.addEventListener("pointerleave", (e) => {
        if (!leftCollapsed || !leftPeek) return;
        if (toggleBtn.contains(e.relatedTarget)) return;
        scheduleClosePeek(90);
      });
      toggleBtn.addEventListener("pointerenter", () => {
        if (leftCollapsed && leftPeek) {
          clearTimeout(peekCloseTimer);
        }
      });
      toggleBtn.addEventListener("pointerleave", (e) => {
        if (!leftCollapsed || !leftPeek) return;
        if (sidebar.contains(e.relatedTarget)) return;
        scheduleClosePeek(90);
      });

      window.addEventListener("keydown", (e) => {
        if (e.key === "[" && !["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) {
          e.preventDefault();
          onLeftToggleClick();
        }
      });
    })();

    function onLeftToggleClick() {
      if (!leftCollapsed) {
        collapseSidebarAndResetWidth();
      } else {
        expandSidebarAtDefaultWidth();
      }
    }

    // ───────── 7. Buttery Damped Resize + Step Detent Collapse + Click-to-Collapse ─────────
    (function initResizer() {
      const resizer = document.getElementById("stage-resizer");
      const canvas = document.getElementById("canvas");

      let pointerDown = false;
      let hasMoved = false;
      let downX = 0;
      let targetW = sideWidth;
      let renderedW = sideWidth;
      let rafId = 0;
      let snapTimer = 0;

      function triggerSnapAnimation() {
        clearTimeout(snapTimer);
        canvas.setAttribute("data-snap-animating", "true");
        snapTimer = setTimeout(() => {
          canvas.removeAttribute("data-snap-animating");
          updateMeasureReadout();
        }, 240);
      }

      function tickLerp() {
        if (!pointerDown) {
          rafId = 0;
          return;
        }
        if (!leftCollapsed && !canvas.hasAttribute("data-snap-animating")) {
          const diff = targetW - renderedW;
          if (Math.abs(diff) > 0.25) {
            renderedW += diff * 0.36;
            document.documentElement.style.setProperty("--side-w", `${renderedW.toFixed(1)}px`);
            updateMeasureReadout();
          } else if (renderedW !== targetW) {
            renderedW = targetW;
            document.documentElement.style.setProperty("--side-w", `${Math.round(renderedW)}px`);
            updateMeasureReadout();
          }
        }
        rafId = requestAnimationFrame(tickLerp);
      }

      resizer.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.preventDefault();
        clearTimeout(resetSideVarTimer);
        pointerDown = true;
        hasMoved = false;
        downX = e.clientX;
        targetW = sideWidth;
        renderedW = sideWidth;
        resizer.setPointerCapture(e.pointerId);
        canvas.setAttribute("data-resizing", "true");
        if (!rafId) rafId = requestAnimationFrame(tickLerp);
      });

      resizer.addEventListener("pointermove", (e) => {
        if (!pointerDown) return;
        if (!hasMoved && Math.abs(e.clientX - downX) < 4) return;
        hasMoved = true;

        const frameRect = document.getElementById("viewport-frame").getBoundingClientRect();
        const x = e.clientX - frameRect.left;

        if (!leftCollapsed) {
          // Case A: Pulling left past SNAP_CLOSE_X (96px) -> Break detent, glide shut, and clear width memory!
          if (x < SNAP_CLOSE_X) {
            targetW = SIDE_DEFAULT;
            renderedW = SIDE_DEFAULT;
            triggerSnapAnimation();
            collapseSidebarAndResetWidth();
            return;
          }

          // Case B: Step Detent Zone [SNAP_CLOSE_X (96px) .. SIDE_MIN (200px)] -> High-friction resistance
          if (x < SIDE_MIN) {
            const pullUnder = SIDE_MIN - x; // 0 .. 104px
            targetW = SIDE_MIN - pullUnder * 0.17; // Compresses slowly before snapping shut at 96px
            return;
          }

          // Case C: Over-pulling right past SIDE_MAX (320px) -> Soft rubber-band resistance
          if (x > SIDE_MAX) {
            const pullOver = x - SIDE_MAX;
            targetW = SIDE_MAX + Math.min(14, pullOver * 0.12);
            sideWidth = SIDE_MAX;
            return;
          }

          // Case D: Normal resizable zone [200px .. 320px] -> Buttery lerp tracking
          targetW = x;
          sideWidth = Math.round(x);
        } else {
          // Currently collapsed during a continuous drag: pulling right past SNAP_OPEN_X (136px) glides open to SIDE_DEFAULT!
          if (x >= SNAP_OPEN_X) {
            clearTimeout(resetSideVarTimer);
            leftCollapsed = false;
            leftPeek = false;
            sideWidth = Math.round(Math.max(SIDE_DEFAULT, Math.min(SIDE_MAX, x)));
            targetW = sideWidth;
            renderedW = sideWidth;
            document.documentElement.style.setProperty("--side-w", `${sideWidth}px`);
            localStorage.setItem("et-skeleton-left-collapsed", "false");
            localStorage.setItem("et-skeleton-side-w", String(sideWidth));
            triggerSnapAnimation();
            syncCanvasAttributes();
          }
        }
      });

      const endPointer = () => {
        if (!pointerDown) return;
        pointerDown = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
        canvas.removeAttribute("data-resizing");

        // Linear "Click to collapse": Clicking the border without dragging directly collapses the sidebar
        // AND clears any temporary resize width memory back to SIDE_DEFAULT (260px)!
        if (!hasMoved) {
          collapseSidebarAndResetWidth();
          return;
        }

        if (!leftCollapsed) {
          sideWidth = Math.round(Math.max(SIDE_MIN, Math.min(SIDE_MAX, targetW)));
          targetW = sideWidth;
          renderedW = sideWidth;
          triggerSnapAnimation();
          document.documentElement.style.setProperty("--side-w", `${sideWidth}px`);
          localStorage.setItem("et-skeleton-side-w", String(sideWidth));
        }
        updateMeasureReadout();
      };

      resizer.addEventListener("pointerup", endPointer);
      resizer.addEventListener("pointercancel", endPointer);
    })();

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && rightMountOpen && !document.querySelector("dialog[open]")) {
        closeRightMount();
      }
    });

    // ───────── 8. Actions & Navigation Rules ─────────
    function goToShelf() {
      sidebarLayer = "shelf";
      renderAll();
    }

    function selectCardFromShelf(cardId) {
      workspaceCardId = cardId;
      storyQuery = "";
      sidebarLayer = "workspace";
      const cardStories = getCardStories(cardId);
      if (cardStories.length > 0) {
        if (!cardStories.some((s) => s.id === currentStoryId)) {
          currentStoryId = cardStories[0].id;
          DATA.stories.current = currentStoryId;
        }
        stageView = "reader";
      } else {
        stageView = "new-story";
      }
      renderAll();
    }

    function selectStory(storyId) {
      const s = getStory(storyId);
      if (!s) return;
      currentStoryId = s.id;
      DATA.stories.current = s.id;
      workspaceCardId = s.card;
      stageView = "reader";
      if (leftCollapsed && leftPeek) {
        leftPeek = false;
      }
      closeMobileDrawer();
      renderAll();
    }

    function openCardDetails() {
      stageView = "card";
      if (leftCollapsed && leftPeek) {
        leftPeek = false;
      }
      closeMobileDrawer();
      renderAll();
    }

    function openNewStoryPage() {
      stageView = "new-story";
      if (leftCollapsed && leftPeek) {
        leftPeek = false;
      }
      closeMobileDrawer();
      renderAll();
    }

    function openStagePage(view) {
      stageView = view;
      if (leftCollapsed && leftPeek) {
        leftPeek = false;
      }
      closeMobileDrawer();
      const sheet = document.getElementById("mobile-sheet");
      if (sheet.open) sheet.close();
      renderAll();
    }

    function backToReader() {
      if (currentStoryId !== null) {
        stageView = "reader";
        renderAll();
      }
    }

    function cyclePersona(cardId) {
      const cur = DATA.player.persona[cardId];
      const next = cur === "yuanke" ? "shaonian" : cur === "shaonian" ? undefined : "yuanke";
      if (next) DATA.player.persona[cardId] = next;
      else delete DATA.player.persona[cardId];
      renderStageAndMount();
    }

    function createAndStartStory(cardId) {
      const nextId = Math.max(0, ...DATA.stories.stories.map((s) => s.id)) + 1;
      DATA.stories.stories.unshift({
        id: nextId,
        card: cardId,
        title: null,
        starred: false,
        busy: null,
        turns: 0,
        updated: Date.now(),
      });
      currentStoryId = nextId;
      DATA.stories.current = nextId;
      workspaceCardId = cardId;
      sidebarLayer = "workspace";
      stageView = "reader";
      renderAll();
    }

    function onCardSearch(val) {
      cardQuery = val;
      updateSidebarInstance("desk");
      updateSidebarInstance("mob");
    }

    function onStorySearch(val) {
      storyQuery = val;
      updateSidebarInstance("desk");
      updateSidebarInstance("mob");
    }

    function toggleRightMount() {
      if (stageView !== "reader") {
        stageView = "reader";
        rightMountOpen = true;
      } else {
        rightMountOpen = !rightMountOpen;
      }
      renderAll();
    }

    function closeRightMount() {
      if (!rightMountOpen) return;
      rightMountOpen = false;
      renderAll();
    }

    function setMountTab(tab) {
      mountTab = tab;
      renderStageAndMount();
    }

    function toggleTheme() {
      const root = document.documentElement;
      const isDark =
        root.getAttribute("data-theme") === "dark" ||
        (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
      root.setAttribute("data-theme", isDark ? "light" : "dark");
    }

    // ───────── 9. Mobile Drawer & Sheet (<dialog>) ─────────
    function openMobileDrawer() {
      const d = document.getElementById("mobile-drawer");
      if (!d.open) d.showModal();
    }
    function closeMobileDrawer() {
      const d = document.getElementById("mobile-drawer");
      if (d.open) d.close();
    }
    function openMobileSheet() {
      const openStory = getStory(currentStoryId);
      const c = openStory ? getCard(openStory.card) : getCard(workspaceCardId);
      const personaLabel = getPersonaLabel(c.id);
      const writingLabel = getWritingChipLabel();
      document.getElementById("sheet-title").textContent = `${c.title} › ${openStory ? (openStory.title ?? "New story") : "新建故事"}`;
      document.getElementById("sheet-body").innerHTML = `
        <button type="button" class="sheet-row" onclick="document.getElementById('mobile-sheet').close(); cyclePersona('${c.id}')">
          <span class="lbl">${ICONS.user}<span>人设</span></span>
          <span class="val">${escapeHtml(personaLabel)} ›</span>
        </button>
        <button type="button" class="sheet-row" onclick="openStagePage('writing')">
          <span class="lbl">${ICONS.pen}<span>写法</span></span>
          <span class="val">${escapeHtml(writingLabel)} ›</span>
        </button>
        <button type="button" class="sheet-row" onclick="openStagePage('timeline')">
          <span class="lbl">${ICONS.tree}<span>时间线</span></span>
          <span class="val">›</span>
        </button>
        <button type="button" class="sheet-row" onclick="openStagePage('inspector')">
          <span class="lbl">${ICONS.probe}<span>检查器</span></span>
          <span class="val">›</span>
        </button>
      `;
      document.getElementById("mobile-sheet").showModal();
    }

    // ───────── 10. Prototype Verification Helpers ─────────
    function setSim(mode) {
      document.getElementById("viewport-stage").setAttribute("data-sim", mode);
      for (const m of ["auto", "1312", "1280", "1152", "390"]) {
        document.getElementById(`sim-${m}`).setAttribute("aria-pressed", String(m === mode));
      }
      setTimeout(updateMeasureReadout, 260);
    }

    function bootEmptyState() {
      currentStoryId = null;
      sidebarLayer = "shelf";
      stageView = "new-story";
      rightMountOpen = false;
      renderAll();
    }

    function updateMeasureReadout() {
      const panel = document.getElementById("reader-panel");
      const main = document.getElementById("reader-main");
      const el = document.getElementById("measure-readout");
      if (!el) return;
      const curLeft = !leftCollapsed
        ? `${Math.round(sideWidth)}px (Z-0)`
        : leftPeek
          ? `${Math.round(sideWidth)}px (Z-2 浮)`
          : "0px (收起)";
      if (panel && main) {
        const pw = Math.round(panel.getBoundingClientRect().width);
        const mw = Math.round(main.getBoundingClientRect().width);
        el.textContent = `左栏: ${curLeft} · 主卡: ${pw}px · 正文: ${mw}px`;
      } else {
        const stageCard = document.querySelector(".stage-card");
        const sw = stageCard ? Math.round(stageCard.getBoundingClientRect().width) : 0;
        el.textContent = `左栏: ${curLeft} · 主卡全幅: ${sw}px`;
      }
    }

    function renderAll() {
      updateSidebarInstance("desk");
      updateSidebarInstance("mob");
      renderStageAndMount();
    }

    mountSidebarShell(document.getElementById("desktop-sidebar-host"), "desk", false);
    mountSidebarShell(document.getElementById("mobile-sidebar-host"), "mob", true);
    renderAll();
    window.addEventListener("resize", updateMeasureReadout);
  </script>
</body>
</html>
