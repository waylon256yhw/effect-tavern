                    type="button"
                    class="dossier-nav-btn"
                    aria-current="${dossierTab === "character" ? "true" : "false"}"
                    onclick="setDossierTab('character')"
                  >
                    <span>角色与背景设定</span>
                    <span class="badge">Character</span>
                  </button>
                  <button
                    type="button"
                    class="dossier-nav-btn"
                    aria-current="${dossierTab === "lore" ? "true" : "false"}"
                    onclick="setDossierTab('lore')"
                  >
                    <span>世界书词条</span>
                    <span class="badge">${(c.loreEntries || []).length} 条</span>
                  </button>
                  <button
                    type="button"
                    class="dossier-nav-btn"
                    aria-current="${dossierTab === "rules" ? "true" : "false"}"
                    onclick="setDossierTab('rules')"
                  >
                    <span>状态与检定规则</span>
                    <span class="badge">${(c.ruleDetails || []).length} 项</span>
                  </button>
                  <button
                    type="button"
                    class="dossier-nav-btn"
                    aria-current="${dossierTab === "prompts" ? "true" : "false"}"
                    onclick="setDossierTab('prompts')"
                  >
                    <span>提示词与边界</span>
                    <span class="badge">Prompts</span>
                  </button>
                </nav>
              </div>
              <dl class="dossier-specs">
                <div class="row"><dt>输入通道</dt><dd>${escapeHtml(c.channel)}</dd></div>
                <div class="row"><dt>默认写法</dt><dd>${escapeHtml((c.writingAll || []).join(" · "))}</dd></div>
                <div class="row"><dt>预设开场</dt><dd>${c.openings.length} 个</dd></div>
                <div class="row"><dt>Head 估算</dt><dd style="font-family:var(--font-mono)">~${c.tokens} tok</dd></div>
              </dl>
            </aside>
            <div class="dossier-main">
              ${mainTabHTML}
            </div>
          </div>
        </div>
      `;
    }

    function renderInspectStageHTML() {
      const s = currentStory();
      const c = getCard(s.card);
      return `
        <div class="stage-surface">
          <header class="story-strip">
            ${
              sidebarCollapsed
                ? `<button type="button" class="icon sm" title="展开侧边栏" onclick="toggleSidebarCollapse()">${ICONS.sidebar}</button>`
                : ""
            }
            <button type="button" class="icon sm" title="返回阅读器" onclick="setStageView('reader')">
              ${ICONS.back}
            </button>
            <span class="strip-story-name">${escapeHtml(s.title ?? "New story")}</span>
            <span class="chip" style="font-family:var(--font-mono)">第 ${s.turns || 1} 轮</span>
          </header>
          <div class="inspect-grid">
            <div class="inspect-pane">
              <strong style="font-size:var(--text-caption); color:var(--ink-3);">Pipeline Calls</strong>
              <div class="inspect-step"><span>1. lookup</span><span>180ms · 0 hits</span></div>
              <div class="inspect-step"><span>2. decide</span><span>310ms · end</span></div>
              <div class="inspect-step" style="box-shadow: inset 0 0 0 1.5px var(--ink);"><span>3. narrate</span><span>1.8s · 412 tok</span></div>
              <div class="inspect-step"><span>4. check</span><span>240ms · clean</span></div>
              <div class="inspect-step"><span>5. record</span><span>490ms · ok</span></div>
            </div>
            <div class="inspect-pane">
              <strong style="font-size:var(--text-caption); color:var(--ink-3);">Narrate Request & Cache Breakpoints</strong>
              <p style="margin:0; color:var(--ink-2); font-family:var(--font-mono); line-height:1.6;">
                [Breakpoint 1 · Head 1h TTL] frame + persona (${escapeHtml(PERSONAS.find((p) => p.id === personaByCard[c.id])?.name ?? "卡片默认")}) + fiction<br/>
                [Breakpoint 2 · Folded Summary] turns 1..8 compressed<br/>
                [Breakpoint 3 · Transcript Tail] turns 9..13 cached<br/>
                [Live Turn Input] "${escapeHtml(s.hitText || "我解下腰间那柄旧短剑…")}"
              </p>
            </div>
          </div>
        </div>
      `;
    }

    // ───────── 7. Render Mobile Overlays ─────────
    function renderMobileOverlaysHTML() {
      if (mobileDrawerOpen) {
        return `
          <div class="mobile-overlay" onclick="if(event.target===this)closeMobileOverlays()">
            <aside class="mobile-drawer">
              ${renderSidebarHTML(true)}
            </aside>
          </div>
        `;
      }
      if (mobileSheetOpen) {
        const s = currentStory();
        const c = getCard(activeCardId);
        const pid = personaByCard[c.id];
        const pName = PERSONAS.find((p) => p.id === pid)?.name ?? "卡片默认";
        return `
          <div class="mobile-overlay" onclick="if(event.target===this)closeMobileOverlays()">
            <div class="mobile-sheet">
              <div class="sheet-head">
                <h3>${escapeHtml(c.title)} · ${escapeHtml(s.title ?? "New story")}</h3>
                <button type="button" class="icon sm" onclick="closeMobileOverlays()">${ICONS.close}</button>
              </div>
              <div style="display:flex; gap:6px; flex-wrap:wrap;">
                <button type="button" class="chip" onclick="closeMobileOverlays(); openCardPageInStage('${c.id}')">
                  卡片详情页
                </button>
                <button type="button" class="chip" onclick="closeMobileOverlays(); openPersonaModal()">
                  人设 · ${escapeHtml(pName)}
                </button>
                <button type="button" class="chip" onclick="closeMobileOverlays(); showToast('打开 Writing 写作页')">
                  写法 · ${escapeHtml(c.stance)}
                </button>
              </div>
              <div style="display:flex; gap:8px;">
                <button type="button" class="chip" style="flex:1; justify-content:center; height:var(--control);" onclick="closeMobileOverlays(); showToast('打开 Timeline 时间线')">
                  ${ICONS.tree} <span>时间线</span>
                </button>
                <button type="button" class="chip" style="flex:1; justify-content:center; height:var(--control);" onclick="closeMobileOverlays(); setStageView('inspect')">
                  ${ICONS.probe} <span>检查器</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }
      return "";
    }

    // ───────── 8. Master Render & Interactions ─────────
    function renderAll() {
      const host = document.getElementById("viewport");
      host.setAttribute("data-device", device);

      let stageContent = "";
      if (stageView === "card") stageContent = renderCardPageStageHTML();
      else if (stageView === "new-story") stageContent = renderNewStoryStageHTML(device === "mobile");
      else if (stageView === "inspect") stageContent = renderInspectStageHTML();
      else stageContent = renderReaderStageHTML(device === "mobile");

      if (device === "mobile") {
        host.innerHTML = `
          <div class="phone-frame">
            ${stageContent}
            ${renderMobileOverlaysHTML()}
          </div>
        `;
      } else {
        host.innerHTML = `
          <div class="harness" data-collapsed="${sidebarCollapsed ? "true" : "false"}">
            <aside class="sidebar-card" aria-label="侧边栏">
              ${renderSidebarHTML(false)}
            </aside>
            <div class="stage" data-view="${stageView}">
              ${stageContent}
            </div>
          </div>
        `;
      }

      document.getElementById("dock-desktop").setAttribute("aria-pressed", String(device === "desktop"));
      document.getElementById("dock-mobile").setAttribute("aria-pressed", String(device === "mobile"));
      document.getElementById("dock-side-shelf").setAttribute("aria-pressed", String(sidebarMode === "shelf"));
      document.getElementById("dock-side-session").setAttribute("aria-pressed", String(sidebarMode === "session"));
      document.getElementById("dock-view-reader").setAttribute("aria-pressed", String(stageView === "reader"));
      document.getElementById("dock-view-new").setAttribute("aria-pressed", String(stageView === "new-story"));
      document.getElementById("dock-view-card").setAttribute("aria-pressed", String(stageView === "card"));
      document.getElementById("dock-helpers").setAttribute("aria-pressed", String(showHelperBar));
      document.getElementById("dock-note").setAttribute("aria-pressed", String(showNoteAttach));
    }

    function setDevice(d) {
      device = d;
      renderAll();
    }
    function setSidebarMode(m) {
      sidebarMode = m;
      renderAll();
    }
    function enterCardWorkspace(cardId) {
      activeCardId = cardId;
      sidebarMode = "session";
      storySearchQuery = "";
      const cardStories = stories.filter((s) => s.card === cardId);
      if (cardStories.length > 0) {
        if (!cardStories.some((s) => s.id === activeStoryId)) {
          activeStoryId = cardStories[0].id;
        }
        stageView = "reader";
      } else {
        stageOpeningIdx = 0;
        stageView = "new-story";
      }
      renderAll();
    }
    function setStageView(v) {
      stageView = v;
      renderAll();
    }
    function openNewStoryPicker(cardId) {
      activeCardId = cardId;
      stageOpeningIdx = 0;
      openingSearchQuery = "";
      openingTagFilter = "all";
      openingPopoverOpen = false;
      stageView = "new-story";
      mobileDrawerOpen = false;
      renderAll();
    }
    function selectOpeningIdx(idx) {
      const all = getCardOpenings(getCard(activeCardId));
      if (idx < 0 || idx >= all.length) return;
      stageOpeningIdx = idx;
      renderAll();
    }
    function onOpeningSearchInput(val) {
      openingSearchQuery = val;
      renderAll();
      const inp = document.getElementById("opening-search-input");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }
    function setOpeningTagFilter(tag) {
      openingTagFilter = tag;
      renderAll();
    }
    function toggleOpeningPopover() {
      openingPopoverOpen = !openingPopoverOpen;
      renderAll();
    }
    function selectPersonaForCard(cardId, pid) {
      personaByCard[cardId] = pid;
      renderAll();
    }
    function openCardPageInStage(cardId) {
      activeCardId = cardId;
      stageView = "card";
      mobileDrawerOpen = false;
      renderAll();
    }
    function setDossierTab(tab) {
      dossierTab = tab;
      renderAll();
    }
    function toggleSidebarCollapse() {
      if (device === "mobile") {
        mobileDrawerOpen = !mobileDrawerOpen;
      } else {
        sidebarCollapsed = !sidebarCollapsed;
      }
      renderAll();
    }
    function toggleHelperBar() {
      showHelperBar = !showHelperBar;
      renderAll();
    }
    function toggleNoteAttach() {
      showNoteAttach = !showNoteAttach;
      if (showNoteAttach && !noteDraftText) {
        noteDraftText = "让裴青舟注意到剑柄末端的浅刻鹤纹，但暂时不动声色";
      }
      renderAll();
    }
    function openNoteAttach() {
      showNoteAttach = true;
      renderAll();
      const inp = document.querySelector(".composer-attach input");
      if (inp) inp.focus();
    }
    function closeNoteAttach() {
      showNoteAttach = false;
      noteDraftText = "";
      renderAll();
    }
    function insertHelperText(openGlyph, closeGlyph) {
      const box = document.getElementById("composer-input");
      if (!box) return;
      const a = box.selectionStart ?? composerDraftText.length;
      const b = box.selectionEnd ?? a;
      const inner = composerDraftText.slice(a, b);
      composerDraftText =
        composerDraftText.slice(0, a) + openGlyph + inner + closeGlyph + composerDraftText.slice(b);
      renderAll();
      const nextBox = document.getElementById("composer-input");
      if (nextBox) {
        nextBox.focus();
        nextBox.setSelectionRange(a + openGlyph.length + inner.length, a + openGlyph.length + inner.length);
      }
    }
    function insertSnippet(text, isNote) {
      if (isNote && activeCardId !== "yandao") {
        showNoteAttach = true;
        noteDraftText = text;
        renderAll();
        const inp = document.querySelector(".composer-attach input");
        if (inp) inp.focus();
      } else {
        composerDraftText = (composerDraftText ? composerDraftText + " " : "") + text;
        renderAll();
        const nextBox = document.getElementById("composer-input");
        if (nextBox) nextBox.focus();
      }
    }

    function selectStory(id) {
      activeStoryId = id;
      const s = currentStory();
      activeCardId = s.card;
      stageView = "reader";
      mobileDrawerOpen = false;
      renderAll();
    }
    function cycleOpening(total) {
      stageOpeningIdx = (stageOpeningIdx + 1) % total;
      renderAll();
    }
    function beginNewStoryFromCard(cardId) {
      const newId = Math.max(...stories.map((s) => s.id)) + 1;
      stories.unshift({
        id: newId,
        card: cardId,
        title: null,
        starred: false,
        turns: 0,
        ago: "刚刚",
        busy: null,
        hitText: "",
        hitTurn: 0,
      });
      activeCardId = cardId;
      activeStoryId = newId;
      sidebarMode = "session";
      stageView = "reader";
      showToast(`已在「${getCard(cardId).title}」下创建新故事`);
      renderAll();
    }

    function onCardSearchInput(val) {
      cardSearchQuery = val;
      renderAll();
      const inp = document.getElementById("shelf-search-input");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }
    function onStorySearchInput(val) {
      storySearchQuery = val;
      renderAll();
      const inp = document.getElementById("story-search-input");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }
    function startStoryTurn(id) {
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      busyEnabled = true;
      s.busy = "narrate";
      const c = getCard(s.card);
      if (pinnedByCard[c.id]) {
        pinnedByCard[c.id] = null;
      }
      renderAll();
    }
    function stopStoryTurn(id) {
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      s.busy = null;
      renderAll();
    }
    function toggleCluePin(cid, hook) {
      pinnedByCard[cid] = pinnedByCard[cid] === hook ? null : hook;
      renderAll();
    }

    // ───────── 9. Current Card's Story Manager (Matches production manager.tsx, scoped to activeCardId!) ─────────
    function openCardStoryManager() {
      mgrSearchQuery = "";
      mgrFilterStarred = false;
      mgrSelected = new Set();
      renderCardStoryManagerContent();
      document.getElementById("manager-dialog").showModal();
    }
    function renderCardStoryManagerContent() {
      const c = getCard(activeCardId);
      const cardStories = stories
        .filter((s) => s.card === activeCardId)
        .sort((a, b) => Number(b.starred) - Number(a.starred));
      const q = mgrSearchQuery.trim();
      const visible = cardStories.filter((s) => {
        if (mgrFilterStarred && !s.starred) return false;
        return storyMatches(s, q).match;
      });

      const el = document.getElementById("manager-content");
      el.innerHTML = `
        <div class="modal-head">
          <h3>
            <span>${escapeHtml(c.title)} · 故事管理</span>
            <span class="chip">${cardStories.length}</span>
          </h3>
          <button type="button" class="icon sm" onclick="document.getElementById('manager-dialog').close()">${ICONS.close}</button>
        </div>
        <div class="modal-body">
          <div class="mgr-toolbar">
            <div class="input-box">
              ${ICONS.search}
              <input
                id="mgr-search-input"
                type="search"
                placeholder="搜索「${escapeHtml(c.title)}」的故事与回合…"
                value="${escapeHtml(mgrSearchQuery)}"
                oninput="onMgrSearchInput(this.value)"
              />
            </div>
            <button
              type="button"
              class="chip ${!mgrFilterStarred ? "primary" : ""}"
              onclick="setMgrStarFilter(false)"
            >全部</button>
            <button
              type="button"
              class="chip ${mgrFilterStarred ? "primary" : ""}"
              onclick="setMgrStarFilter(true)"
            >收藏</button>
          </div>

          ${
            visible.length
              ? visible
                  .map((s) => {
                    const checked = mgrSelected.has(s.id);
                    const isCur = s.id === activeStoryId;
                    const b = isStoryBusy(s);
                    return `
                      <div class="mgr-row" aria-current="${isCur ? "true" : "false"}">
                        <div class="mgr-row-top">
                          <input
                            type="checkbox"
                            ${checked ? "checked" : ""}
                            ${b ? "disabled" : ""}
                            onchange="toggleMgrSelect(${s.id})"
                          />
                          <button
                            type="button"
                            class="mgr-star"
                            aria-pressed="${s.starred ? "true" : "false"}"
                            title="${s.starred ? "取消收藏" : "收藏"}"
                            onclick="toggleStarInMgr(${s.id})"
                          >
                            ${s.starred ? ICONS.starFill : ICONS.star}
                          </button>
                          <button
                            type="button"
                            class="mgr-title ${s.title === null ? "unnamed" : ""}"
                            onclick="document.getElementById('manager-dialog').close(); selectStory(${s.id})"
                          >
                            ${highlightMark(s.title ?? "New story", q)}
                          </button>
                          <div class="mgr-actions">
                            <button type="button" class="icon sm" title="重命名" onclick="renameStoryInMgr(${s.id})">
                              ${ICONS.pencil}
                            </button>
                            <button type="button" class="icon sm" title="导出 (.md / .json)" onclick="showToast('导出「${escapeHtml(s.title ?? "New story")}」')">
                              ${ICONS.export}
                            </button>
                            <button type="button" class="icon sm" title="删除" ${b ? "disabled" : ""} onclick="deleteSingleInMgr(${s.id})">
                              ${ICONS.trash}
                            </button>
                          </div>
                        </div>
                        ${
                          s.hitText
                            ? `<p class="mgr-preview">${highlightMark(s.hitText, q)}</p>`
                            : ""
                        }
                        <div class="mgr-meta">${s.turns} 轮 · ${s.ago}${b ? " · 进行中" : ""}</div>
                      </div>
                    `;
                  })
                  .join("")
              : `<div style="padding:16px; text-align:center; color:var(--ink-3); font-size:var(--text-footnote);">暂无匹配的故事</div>`
          }
        </div>
        <div class="modal-foot">
          <div style="display:flex; gap:6px;">
            <button type="button" class="chip" onclick="selectMgrPreset('unnamed')">快选未命名未收藏</button>
            ${mgrSelected.size > 0 ? `<button type="button" class="chip" onclick="selectMgrPreset('clear')">取消选择</button>` : ""}
          </div>
          <button
            type="button"
            class="chip danger"
            ${mgrSelected.size === 0 ? "disabled" : ""}
            onclick="commitMgrBatchDelete()"
          >
            删除选中 ${mgrSelected.size || ""}
          </button>
        </div>
      `;
    }
    function onMgrSearchInput(val) {
      mgrSearchQuery = val;
      renderCardStoryManagerContent();
      const inp = document.getElementById("mgr-search-input");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }
    function setMgrStarFilter(starredOnly) {
      mgrFilterStarred = starredOnly;
      renderCardStoryManagerContent();
    }
    function toggleStarInMgr(id) {
      const s = stories.find((x) => x.id === id);
      if (s) s.starred = !s.starred;
      renderCardStoryManagerContent();
      renderAll();
    }
    function renameStoryInMgr(id) {
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      const next = prompt("重命名故事（留空恢复 New story）：", s.title ?? "");
      if (next !== null) {
        s.title = next.trim() || null;
        renderCardStoryManagerContent();
        renderAll();
      }
    }
    function deleteSingleInMgr(id) {
      stories = stories.filter((s) => s.id !== id);
      mgrSelected.delete(id);
      const remaining = stories.filter((s) => s.card === activeCardId);
      if (activeStoryId === id && remaining.length) activeStoryId = remaining[0].id;
      renderCardStoryManagerContent();
      renderAll();
    }
    function toggleMgrSelect(id) {
      if (mgrSelected.has(id)) mgrSelected.delete(id);
      else mgrSelected.add(id);
      renderCardStoryManagerContent();
    }
    function selectMgrPreset(kind) {
      if (kind === "clear") mgrSelected.clear();
      if (kind === "unnamed") {
        stories
          .filter((s) => s.card === activeCardId && s.title === null && !s.starred && !isStoryBusy(s))
          .forEach((s) => mgrSelected.add(s.id));
      }
      renderCardStoryManagerContent();
    }
    function commitMgrBatchDelete() {
      const n = mgrSelected.size;
      stories = stories.filter((s) => !mgrSelected.has(s.id));
      mgrSelected.clear();
      const remaining = stories.filter((s) => s.card === activeCardId);
      if (!remaining.some((s) => s.id === activeStoryId) && remaining.length) {
        activeStoryId = remaining[0].id;
      }
      renderCardStoryManagerContent();
      renderAll();
      showToast(`已删除 ${n} 个故事`);
    }

    // ───────── 10. Persona Picker Sheet ─────────
    function openPersonaModal() {
      const cid = currentCardId();
      const c = getCard(cid);
      const curPid = personaByCard[cid];
      const el = document.getElementById("persona-content");
      el.innerHTML = `
        <div class="modal-head">
          <h3>选择人设 · ${escapeHtml(c.title)}</h3>
          <button type="button" class="icon sm" onclick="document.getElementById('persona-dialog').close()">${ICONS.close}</button>
        </div>
        <div class="modal-body">
          <button
            type="button"
            class="cleanup-row"
            style="text-align:left; justify-content:space-between;"
            onclick="pickPersonaForCard('${cid}', undefined)"
          >
            <div>
              <div style="font-weight:600">卡片默认 <span class="c-tag">随卡</span></div>
              <div style="font-size:var(--text-caption); color:var(--ink-3)">使用卡片自带的角色设定</div>
            </div>
            ${!curPid ? `<span style="width:16px;height:16px">${ICONS.check}</span>` : ""}
          </button>
          ${PERSONAS.map(
            (p) => `
              <button
                type="button"
                class="cleanup-row"
                style="text-align:left; justify-content:space-between;"
                onclick="pickPersonaForCard('${cid}', '${p.id}')"
              >
                <div>
                  <div style="font-weight:600">${escapeHtml(p.name)}</div>
                  <div style="font-size:var(--text-caption); color:var(--ink-3)">${escapeHtml(p.bio)}</div>
                </div>
                ${curPid === p.id ? `<span style="width:16px;height:16px">${ICONS.check}</span>` : ""}
              </button>
            `
          ).join("")}
        </div>
      `;
      document.getElementById("persona-dialog").showModal();
    }
    function pickPersonaForCard(cid, pid) {
      personaByCard[cid] = pid;
      document.getElementById("persona-dialog").close();
      renderAll();
    }

    // ───────── 11. Mobile Overlays & Theme ─────────
    function openMobileDrawer() {
      mobileDrawerOpen = true;
      mobileSheetOpen = false;
      renderAll();
    }
    function openMobileSheet() {
      mobileSheetOpen = true;
      mobileDrawerOpen = false;
      renderAll();
    }
    function closeMobileOverlays() {
      mobileDrawerOpen = false;
      mobileSheetOpen = false;
      renderAll();
    }
    function toggleTheme() {
      const root = document.documentElement;
      const cur = root.getAttribute("data-theme") || "light";
      root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.setAttribute("data-show", "true");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.setAttribute("data-show", "false"), 2400);
    }

    renderAll();
  </script>
</body>
</html>
