<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harness 侧边栏（卡 → 局）与局级 Strip · 交互原型 (Issue #117)</title>
  <!--
    ═══════════════════════════════════════════════════════════════════════════════
    HARNESS SIDEBAR (CARD → STORY) & STORY STRIP PROTOTYPE (ISSUE #117 / #68)
    ═══════════════════════════════════════════════════════════════════════════════
    1. 桌面两层网格 (72rem+):
       - 外层: 侧边栏 (15rem，可折叠) | 主舞台 (1fr)
       - 内层:
         * 主舞台 = 阅读器 (Reader) 时: 阅读列 (1fr) | Status/Record 右栏 (19rem)
         * 主舞台 = 卡页 (CardPage) / 检查器 (Inspector) / 设置 / 写作 时: 铺满整个主舞台 (1fr)，右栏隐藏
    2. 常驻侧边栏 (安装级):
       - 顶部: 搜索框（跨卡搜标题与正文，命中自动展开所在卡组并在行下显示 <mark> 片段）+ 清理菜单按钮 + 折叠按钮
       - 树 (卡 → 局):
         * 组头 = 折叠箭头 + 卡名（点击卡名进该卡的卡页，不建 0 轮空局；Begin 时才 POST /stories + greet）
         * 局行 = 星标在前 + 标题 (或 New story) + busy 进行中圆点 + hover/触屏常显 ⋯ 菜单（改名、星标、导出、删除）
         * 切局永远可点（working 只锁本局 composer 与版本切换）
       - 底部: 三个安装级图标（设置 ⚙、主题 ◐、语言 文）
    3. 阅读区头部 Strip (局级):
       - [展开侧栏键(仅折叠时)] + 卡名 › 局名 (ellipsis) + [人设 chip] + [叙事体位 chip (chosen()[0])] + 右侧 [Timeline ⧖] [Inspector ⌕]
       - Pin 不上 Strip：作为待发挂件放在 Composer 输入框正上方，带 ×，发出即消耗
    4. 手机 (< 72rem, 390×844):
       - Topbar 左中右: ☰ 拉出侧边栏抽屉 | 卡名 › 局名 ▾ 拉出局级 Sheet（人设、写法、Timeline、Inspector）| Status 图标拉出状态表
  -->
  <style>
    /* ───────── 1. Tokens: exact match with packages/client/src/tokens.css ───────── */
    :root {
      color-scheme: light dark;

      --surface-0: light-dark(#f9f9f7, #0b0b0b);
      --surface-1: light-dark(#fcfcfb, #151515);
      --surface-2: light-dark(#ffffff, #1a1a19);
      --surface-3: light-dark(#ffffff, #20201f);

      --ink: light-dark(#151515, #f5f5f5);
      --ink-2: light-dark(#525252, #a3a3a3);
      --ink-3: light-dark(#8a8a8a, #6f6f6f);

      --alpha-1: light-dark(rgb(20 20 20 / 0.05), rgb(255 255 255 / 0.05));
      --alpha-2: light-dark(rgb(20 20 20 / 0.1), rgb(255 255 255 / 0.09));
      --alpha-3: light-dark(rgb(20 20 20 / 0.2), rgb(255 255 255 / 0.18));
      --alpha-4: light-dark(rgb(20 20 20 / 0.35), rgb(255 255 255 / 0.3));
      --line: var(--alpha-2);
      --line-strong: var(--alpha-3);
      --fill: var(--alpha-2);
      --fill-hover: light-dark(rgb(20 20 20 / 0.14), rgb(255 255 255 / 0.14));
      --ghost-hover: var(--alpha-1);
      --ghost-active: var(--alpha-2);

      --primary: var(--ink);
      --primary-ink: var(--surface-1);
      --danger: light-dark(#dc2626, #f87171);
      --ok: light-dark(#1f7a3f, #4ade80);
      --ok-soft: light-dark(rgb(31 122 63 / 0.22), rgb(74 222 128 / 0.25));
      --danger-soft: light-dark(rgb(220 38 38 / 0.18), rgb(248 113 113 / 0.22));
      --ok-wash: light-dark(rgb(34 197 94 / 0.12), rgb(187 247 208 / 0.09));
      --warn: light-dark(#b45309, #fbbf24);
      --warn-soft: light-dark(rgb(217 119 6 / 0.12), rgb(251 191 36 / 0.14));
      --scrim: light-dark(rgb(0 0 0 / 0.22), rgb(0 0 0 / 0.55));
      --ring: var(--alpha-4);

      --hairline: 1px;
      --shadow-1:
        0 1px 2px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 2px 8px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-2:
        0 2px 4px light-dark(rgb(0 0 0 / 0.05), rgb(0 0 0 / 0.4)),
        0 6px 16px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-3:
        0 4px 8px light-dark(rgb(0 0 0 / 0.06), rgb(0 0 0 / 0.5)),
        0 12px 28px -2px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.4));
      --shadow-pop:
        inset 0 0 0 1px light-dark(transparent, rgb(255 255 255 / 0.1)),
        0 0 0 1px light-dark(var(--line), transparent),
        0 8px 24px light-dark(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.65)),
        0 2px 6px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.45));
      --shadow-composer:
        0 4px 20px light-dark(rgb(0 0 0 / 0.035), rgb(0 0 0 / 0.4)),
        inset 0 0 0 1px var(--line);
      --shadow-composer-focus:
        0 4px 24px light-dark(rgb(0 0 0 / 0.08), rgb(0 0 0 / 0.65)),
        inset 0 0 0 1px var(--line-strong);

      --radius-sm: 4px;
      --radius: 8px;
      --radius-card: calc(var(--radius) + 4px);
      --radius-composer: 14px;
      --radius-dialog: 16px;
      --radius-pill: 999px;

      --control: 32px;
      --control-sm: 24px;
      --control-lg: 38px;
      --icon: 20px;
      --icon-sm: 16px;

      --font-sans:
        system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Noto Sans SC", sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --text-caption: 0.6875rem; /* 11px */
      --text-footnote: 0.75rem; /* 12px */
      --text-body: 0.875rem; /* 14px */
      --text-heading: 0.9375rem; /* 15px */
      --text-prose: 1rem; /* 16px */
      --text-field: var(--text-body);
      --text-title: 1.25rem; /* 20px */
      --leading-tight: 1.25;
      --leading-body: 1.45;
      --leading-prose: 1.75;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 24px;
      --space-6: 32px;
      --line-prose: calc(var(--text-prose) * var(--leading-prose));
      --gap-turn: calc(var(--line-prose) * 0.75);
      --gap-item: calc(var(--line-prose) * 0.5);
      --measure: 42rem;
      --topbar: 48px;
      --fade: 24px;

      --dur-1: 60ms;
      --dur-2: 120ms;
      --dur-3: 200ms;
      --dur-4: 300ms;
      --dur-5: 450ms;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-pulse: cubic-bezier(0.4, 0, 0.2, 1);
    }
    :root[data-theme="light"] {
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
    }
    @media (resolution >= 2x) {
      :root {
        --hairline: 0.5px;
      }
    }

    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      color: var(--ink);
      background: var(--surface-0);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    button, input, textarea {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      margin: 0;
    }
    button {
      cursor: pointer;
      user-select: none;
    }
    button:disabled {
      opacity: 0.38;
      cursor: default;
    }
    mark {
      background: var(--warn-soft);
      color: var(--ink);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ───────── 2. Shared Primitives (.icon, .chip, .btn, .input-box) ───────── */
    .icon {
      width: var(--control);
      height: var(--control);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-2);
      flex: none;
      position: relative;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .icon:hover:not(:disabled) {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .icon:active:not(:disabled) {
      background: var(--ghost-active);
    }
    .icon[aria-pressed="true"] {
      background: var(--fill);
      color: var(--ink);
    }
    .icon svg {
      width: var(--icon);
      height: var(--icon);
    }
    .icon.sm {
      width: var(--control-sm);
      height: var(--control-sm);
      border-radius: 6px;
    }
    .icon.sm svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
    }
    .icon .dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 1.5px var(--surface-1);
    }

    .chip {
      height: 24px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      background: var(--fill);
      color: var(--ink-2);
      font-size: var(--text-footnote);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    button.chip:hover:not(:disabled) {
      background: var(--fill-hover);
      color: var(--ink);
    }
    .chip.primary {
      background: var(--primary);
      color: var(--primary-ink);
    }
    .chip.danger {
      background: var(--danger);
      color: #fff;
    }
    .chip svg {
      width: 12px;
      height: 12px;
      color: var(--ink-3);
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      height: var(--control);
      padding: 0 var(--space-2);
      border-radius: var(--radius);
      background: var(--alpha-1);
      box-shadow: inset 0 0 0 var(--hairline) var(--line);
      flex: 1;
      min-width: 0;
      transition: box-shadow var(--dur-2) var(--ease), background var(--dur-2) var(--ease);
    }
    .input-box:focus-within {
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .input-box svg {
      width: var(--icon-sm);
      height: var(--icon-sm);
      color: var(--ink-3);
      flex: none;
    }
    .input-box input {
      flex: 1;
      min-width: 0;
      outline: none;
      font-size: var(--text-footnote);
    }
    .input-box input::placeholder {
      color: var(--ink-3);
    }

    /* ───────── 3. Stage Container (Desktop vs Mobile Viewport Switcher) ───────── */
    .viewport-host {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: stretch;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .viewport-host[data-device="mobile"] {
      padding: var(--space-4) var(--space-4) 68px;
      align-items: center;
      background:
        radial-gradient(circle at 50% 20%, var(--alpha-1), transparent 70%),
        var(--surface-0);
    }
    .phone-frame {
      width: 390px;
      height: min(812px, 100%);
      border-radius: 36px;
      background: var(--surface-1);
      box-shadow:
        0 0 0 8px light-dark(#e5e5e2, #262625),
        var(--shadow-3);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ───────── 4. Outer Harness Grid (Sidebar | Stage) ───────── */
    .harness {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-columns: 15rem minmax(0, 1fr);
      gap: var(--space-5);
      padding: var(--space-5) var(--space-5) calc(var(--space-5) + 48px);
      transition: grid-template-columns var(--dur-3) var(--ease), gap var(--dur-3) var(--ease);
    }
    .harness[data-collapsed="true"] {
      grid-template-columns: 0rem minmax(0, 1fr);
      gap: 0;
    }
    .harness[data-collapsed="true"] > .sidebar-card {
      opacity: 0;
      pointer-events: none;
      padding-inline: 0;
      border-width: 0;
    }

    /* ───────── 5. Persistent Left Sidebar (卡 → 局 Tree) ───────── */
    .sidebar-card {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: opacity var(--dur-2) var(--ease), padding var(--dur-3) var(--ease);
    }
    .sidebar {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: var(--space-3);
      gap: var(--space-2);
    }

    /* Sidebar Top: Search + Cleanup Menu + Collapse */
    .side-top {
      display: flex;
      align-items: center;
      gap: var(--space-1);
      flex: none;
    }

    /* Sidebar Tree Scroller */
    .tree-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      margin-inline: calc(-1 * var(--space-1));
      padding-inline: var(--space-1);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      scrollbar-width: thin;
      scrollbar-color: transparent transparent;
    }
    .tree-scroll:hover {
      scrollbar-color: var(--alpha-2) transparent;
    }

    /* Card Group in Tree */
    .card-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .group-head {
      display: flex;
      align-items: center;
      height: 30px;
      border-radius: var(--radius);
      padding-right: var(--space-1);
      transition: background var(--dur-2) var(--ease);
    }
    .group-head:hover {
      background: var(--ghost-hover);
    }
    .group-head[aria-current="page"] {
      background: var(--fill);
    }
    .group-toggle {
      width: 24px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      flex: none;
      border-radius: var(--radius-sm);
    }
    .group-toggle:hover {
      color: var(--ink);
    }
    .group-toggle svg {
      width: 12px;
      height: 12px;
      transition: transform var(--dur-2) var(--ease);
    }
    .card-group[data-open="false"] .group-toggle svg {
      transform: rotate(-90deg);
    }
    .group-title {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      text-align: left;
      padding-right: var(--space-1);
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
    }
    .group-title .name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group-title .group-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: var(--text-caption);
      font-weight: 400;
      font-family: var(--font-mono);
      color: var(--ink-3);
    }
    .group-title .card-enter {
      width: 12px;
      height: 12px;
      color: var(--ink-3);
      opacity: 0;
      transition: opacity var(--dur-2) var(--ease), translate var(--dur-2) var(--ease);
    }
    .group-head:hover .card-enter,
    .group-head[aria-current="page"] .card-enter {
      opacity: 0.85;
    }
    .group-head:hover .card-enter {
      translate: 1px 0;
    }

    /* Story Rows inside a Card Group */
    .story-list {
      list-style: none;
      margin: 0;
      padding: 0 0 0 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .card-group[data-open="false"] .story-list {
      display: none;
    }
    .story-item {
      position: relative;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      transition: background var(--dur-2) var(--ease);
    }
    .story-item:hover {
      background: var(--ghost-hover);
    }
    .story-item[aria-current="true"] {
      background: var(--fill);
    }
    .story-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-1);
      min-height: 30px;
      padding: 4px 6px 4px 10px;
      text-align: left;
      width: 100%;
    }
    .story-main {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .story-star {
      width: 12px;
      height: 12px;
      color: var(--ink-2);
      flex: none;
      display: inline-flex;
    }
    .story-star svg {
      width: 12px;
      height: 12px;
    }
    .story-name {
      font-size: var(--text-footnote);
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .story-item[aria-current="true"] .story-name {
      font-weight: 600;
    }
    .story-name.unnamed {
      color: var(--ink-2);
    }
    .story-right {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 20px;
    }
    /* Busy dot: indicates an in-flight turn on the server (#116 busy: Phase | null) */
    .busy-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      display: inline-block;
      animation: pulseDot 1.4s var(--ease-pulse) infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.82); }
    }
    .story-more {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-3);
      opacity: 0;
      transition: opacity var(--dur-1) var(--ease), background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }
    .story-item:hover .story-more,
    .story-more[aria-expanded="true"],
    .viewport-host[data-device="mobile"] .story-more {
      opacity: 1;
    }
    .story-more:hover {
      background: var(--alpha-2);
      color: var(--ink);
    }
    .story-more svg {
      width: 14px;
      height: 14px;
    }

    /* Search Hit Snippet Line under Story Row */
    .story-hit {
      padding: 0 8px 5px 10px;
      font-size: var(--text-caption);
      color: var(--ink-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }
    .story-hit .turn-tag {
      font-family: var(--font-mono);
      color: var(--ink-2);
      margin-right: 4px;
    }

    .group-empty {
      padding: 2px 10px 4px 10px;
      font-size: var(--text-caption);
      color: var(--ink-3);
    }

    /* Sidebar Footer: 3 install-level icons (Settings, Theme, Language) */
    .side-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: var(--space-2);
      border-top: var(--hairline) solid var(--line);
      flex: none;
    }
    .side-foot-left {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    /* ───────── 6. Main Stage (Reader + Glance | CardPage | Inspector) ───────── */
    .stage {
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-5);
      position: relative;
    }
    .stage[data-view="reader"] {
      grid-template-columns: minmax(0, 1fr) 19rem;
    }

    /* ───────── 7. Reader Column & Story-Level Top Strip ───────── */
    .reader-card {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* The new Story-Level Strip at the top of the Reader: slim, borderless, blends into the top of the card */
    .story-strip {
      height: 36px;
      padding: 6px var(--space-4) 0;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex: none;
      min-width: 0;
    }
    .strip-crumb {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 0 1 auto;
      overflow: hidden;
    }
    .strip-card-btn {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
      padding: 2px 5px;
      margin-left: -5px;
      border-radius: var(--radius-sm);
      transition: background var(--dur-2) var(--ease), color var(--dur-2) var(--ease);
    }
    .strip-card-btn:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .strip-sep {
      color: var(--ink-3);
      font-size: var(--text-footnote);
      flex: none;
    }
    .strip-story-name {
      font-size: var(--text-body);
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .strip-story-name.unnamed {
      color: var(--ink-2);
      font-weight: 500;
    }
    .strip-chips {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }
    .strip-chips .chip {
      height: 22px;
      padding: 0 6px;
      font-size: var(--text-caption);
      max-width: 7.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .strip-tools {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      flex: none;
    }

    /* Reader Scroll & Turns */
    .reader-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: var(--space-4) var(--space-6) var(--fade);
      display: flex;
      flex-direction: column;
      gap: var(--gap-turn);
      mask-image: linear-gradient(to bottom, transparent, #000 12px, #000 calc(100% - var(--fade)), transparent);
    }
    .reader-main {
      max-width: var(--measure);
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--gap-turn);
    }
    .turn-sec {
      display: flex;
      flex-direction: column;
      gap: var(--gap-item);
    }
    .spoke {
      align-self: flex-end;
      max-width: 82%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .said {
      padding: 8px 13px;
      border-radius: 14px 14px 4px 14px;
      background: var(--fill);
      color: var(--ink);
      font-size: var(--text-prose);
      line-height: var(--leading-body);
    }
    .said.note {
      background: transparent;
      border: var(--hairline) dashed var(--line-strong);
      color: var(--ink-2);
      font-size: var(--text-footnote);
    }
    .prose {
      font-size: var(--text-prose);
      line-height: var(--leading-prose);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      gap: var(--gap-item);
    }
    .prose p {
      margin: 0;
    }
    .turn-foot {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--ink-3);
      font-size: var(--text-footnote);
    }
    .record-pill {
      height: 24px;
      padding: 0 8px;
      border-radius: var(--radius-pill);
      background: var(--alpha-1);
      color: var(--ink-2);
      font-size: var(--text-caption);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .record-pill svg {
      width: 13px;
      height: 13px;
    }
    .dots {
      display: inline-flex;
      gap: 3.5px;
    }
    .dots span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--ink-3);
      animation: pulseDot 1.2s var(--ease-pulse) infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }
    .cursor {
      display: inline-block;
      vertical-align: text-bottom;
      width: 2px;
      height: 1.05em;
      margin-left: 2px;
      background: var(--ok);
      animation: blink 1s steps(2, jump-none) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }

    /* ───────── 8. Composer + Input Helper Attachments above it ───────── */
    .composer-wrap {
      padding: 0 var(--space-6) var(--space-4);
      flex: none;
    }
    .composer-stack {
      max-width: var(--measure);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    /* Floating helper chips strip right above the composer box */
    .helper-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      padding: 0 2px;
    }
    .helper-bar .chip {
      height: 22px;
      padding: 0 7px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      box-shadow: var(--shadow-1), inset 0 0 0 var(--hairline) var(--line);
      font-size: var(--text-caption);
      color: var(--ink-2);
    }
    .helper-bar .chip:hover {
      background: var(--fill);
      color: var(--ink);
    }
    .helper-bar .chip.glyph {
      font-family: var(--font-sans);
      letter-spacing: 0.12em;
      text-indent: 0.12em;
      color: var(--ink);
    }
    .helper-bar .sep {
      width: 1px;
      height: 12px;
      background: var(--line);
      margin: 0 2px;
    }
    .composer-box {
      width: 100%;
      border-radius: var(--radius-composer);
      background: var(--surface-2);
      box-shadow: var(--shadow-composer);
      overflow: hidden;
      transition: box-shadow var(--dur-2) var(--ease);
    }
    .composer-box:focus-within {
      box-shadow: var(--shadow-composer-focus);
    }
    /* Attached tray on top of the composer box (e.g. Note to narrator / Revising turn) */
    .composer-attach {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 5px 8px 5px 12px;
      background: var(--alpha-1);
      border-bottom: var(--hairline) solid var(--line);
      font-size: var(--text-footnote);
      color: var(--ink-2);
    }
    .composer-attach .attach-tag {
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-2);
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--fill);
      flex: none;
    }
    .composer-attach input {
      flex: 1;
      min-width: 0;
      outline: none;
      font-size: var(--text-footnote);
      color: var(--ink);
    }
    .composer-attach input::placeholder {
      color: var(--ink-3);
    }
    .composer-body {
      padding: 10px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .composer-body.compact {
      padding: 6px 8px;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    .composer-body textarea {
      width: 100%;
      resize: none;
      outline: none;
      font-size: var(--text-body);
      line-height: 1.5;
      min-height: 24px;
    }
    .composer-body.compact textarea {
      flex: 1;
      min-width: 0;
      min-height: 22px;
      padding: 2px 0;
    }
    .composer-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .composer-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .send-btn {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: var(--primary-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .send-btn.stop {
      background: var(--fill);
      color: var(--ink);
    }
    .send-btn svg {
      width: 15px;
      height: 15px;
    }

    /* ───────── 9. Right Glance Card (Status & Record, only in Reader view) ───────── */
    .glance-card {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-1);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
      overflow-y: auto;
    }
    .glance-sec {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .glance-sec h2 {
      margin: 0;
      font-size: var(--text-caption);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-3);
    }
    .meter-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 6px 0;
    }
    .meter-top {
      display: flex;
      justify-content: space-between;
      font-size: var(--text-footnote);
    }
    .meter-top .label {
      font-weight: 600;
    }
    .meter-top .val {
      font-family: var(--font-mono);
      color: var(--ink-2);
    }
    .meter-track {
      height: 6px;
      border-radius: 3px;
      background: var(--alpha-2);
      position: relative;
      overflow: hidden;
    }
    .meter-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--ink);
      border-radius: 3px;
    }
    .clue-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-2);
      padding: 7px 9px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-size: var(--text-footnote);
      color: var(--ink-2);
    }
    .clue-item button {
      flex: none;
      color: var(--ink-3);
    }
    .clue-item button:hover,
    .clue-item button[aria-pressed="true"] {
      color: var(--ink);
    }
    .clue-item button svg {
      width: 14px;
      height: 14px;
    }

    /* ───────── 10. Full-Stage Views: CardPage & Inspector (Right Glance Hidden) ───────── */
    .stage-surface {
      min-width: 0;
      min-height: 0;
      height: 100%;
      border-radius: var(--radius-dialog);
      background: var(--surface-1);
      box-shadow: var(--shadow-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .stage-surface-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
    }
    /* CardSheet inside Stage (matches card.css max-width: 56rem two-column) */
    .cardsheet {
      width: 100%;
      max-width: 54rem;
      display: grid;
      grid-template-columns: minmax(0, 9fr) minmax(0, 13fr);
      min-height: 24rem;
      border-radius: var(--radius-dialog);
      background: var(--surface-2);
      box-shadow: var(--shadow-2);
      border: var(--hairline) solid var(--line);
      overflow: hidden;
    }
    .cardsheet .about {
      padding: var(--space-6);
      border-right: var(--hairline) solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .cardsheet h1 {
      margin: 0;
      font-size: var(--text-title);
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .cardsheet .summary {
      margin: var(--space-2) 0 0;
      color: var(--ink-2);
      line-height: 1.65;
    }
    .cardsheet .specs {
      margin: 0;
      padding-top: var(--space-3);
      border-top: var(--hairline) solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: var(--text-footnote);
    }
    .cardsheet .specs .row {
      display: flex;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .cardsheet .specs dt { color: var(--ink-3); }
    .cardsheet .specs dd { margin: 0; font-weight: 500; color: var(--ink-2); }
    .cardsheet .opening {
      padding: var(--space-6);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: var(--space-4);
    }
    .cardsheet .well {
      flex: 1;
      padding: var(--space-4);
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      font-size: var(--text-prose);
      line-height: var(--leading-prose);
      color: var(--ink);
      overflow-y: auto;
      max-height: 16rem;
    }
    .cardsheet .foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .begin-btn {
      height: var(--control);
      padding: 0 16px;
      border-radius: var(--radius-pill);
      background: var(--primary);
      color: var(--primary-ink);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-1);
    }
    .begin-btn svg {
      width: 15px;
      height: 15px;
    }

    /* Inspector full-stage mock */
    .inspect-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 18rem minmax(0, 1fr);
      gap: var(--space-4);
      padding: var(--space-4);
    }
    .inspect-pane {
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      font-size: var(--text-footnote);
    }
    .inspect-step {
      display: flex;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--surface-2);
      font-family: var(--font-mono);
    }

    /* ───────── 11. Mobile Topbar, Sidebar Drawer & Session Sheet ───────── */
    .mobile-topbar {
      height: var(--topbar);
      padding: 0 var(--space-2);
      border-bottom: var(--hairline) solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-1);
      flex: none;
    }
    .mobile-title-btn {
      flex: 1;
      min-width: 0;
      height: 36px;
      padding: 0 var(--space-2);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .mobile-title-btn:hover {
      background: var(--ghost-hover);
    }
    .mobile-title-btn .c-name {
      font-weight: 600;
      color: var(--ink-2);
      white-space: nowrap;
    }
    .mobile-title-btn .s-name {
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mobile-title-btn svg {
      width: 12px;
      height: 12px;
      color: var(--ink-3);
      flex: none;
    }

    /* Mobile Overlay Scrim + Left Drawer + Bottom Sheet */
    .mobile-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: var(--scrim);
      display: flex;
      animation: fadeIn var(--dur-2) var(--ease);
    }
    .mobile-drawer {
      width: 268px;
      max-width: 82%;
      height: 100%;
      background: var(--surface-1);
      box-shadow: var(--shadow-3);
      display: flex;
      flex-direction: column;
    }
    .mobile-sheet {
      margin-top: auto;
      width: 100%;
      max-height: 82%;
      border-radius: 20px 20px 0 0;
      background: var(--surface-1);
      box-shadow: var(--shadow-3);
      padding: var(--space-4);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      overflow-y: auto;
    }
    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sheet-head h3 {
      margin: 0;
      font-size: var(--text-heading);
      font-weight: 600;
    }
    .session-cardhead {
      padding: var(--space-3);
      border-radius: var(--radius-card);
      background: var(--alpha-1);
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .session-cardhead .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .session-cardhead p {
      margin: 0;
      font-size: var(--text-footnote);
      color: var(--ink-2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .session-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .session-row .lbl {
      font-size: var(--text-caption);
      font-weight: 600;
      color: var(--ink-3);
      text-transform: uppercase;
    }
    .session-chosen {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
    }

    /* ───────── 12. Floating Menus & Modal Sheets (⋯ Row Menu, Cleanup Sheet, Persona Picker) ───────── */
    .pop-menu {
      position: fixed;
      z-index: 60;
      min-width: 148px;
      padding: 4px;
      border-radius: var(--radius-card);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .pop-item {
      height: 30px;
      padding: 0 10px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--text-footnote);
      color: var(--ink);
      text-align: left;
    }
    .pop-item:hover {
      background: var(--ghost-hover);
    }
    .pop-item.danger {
      color: var(--danger);
    }
    .pop-item svg {
      width: 14px;
      height: 14px;
      color: var(--ink-3);
    }
    .pop-item.danger svg {
      color: var(--danger);
    }

    dialog.modal-sheet {
      border: 0;
      padding: 0;
      border-radius: var(--radius-dialog);
      background: var(--surface-2);
      color: var(--ink);
      box-shadow: var(--shadow-pop);
      width: min(30rem, calc(100vw - 32px));
      max-height: 78vh;
    }
    dialog.modal-sheet::backdrop {
      background: var(--scrim);
    }
    .modal-inner {
      display: flex;
      flex-direction: column;
      max-height: 78vh;
    }
    .modal-head {
      padding: var(--space-4) var(--space-5);
      border-bottom: var(--hairline) solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .modal-head h3 {
      margin: 0;
      font-size: var(--text-heading);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-body {
      padding: var(--space-3) var(--space-5);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .modal-foot {
      padding: var(--space-3) var(--space-5);
      border-top: var(--hairline) solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      font-size: var(--text-footnote);
    }
    .cleanup-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 7px 10px;
      border-radius: var(--radius);
      background: var(--alpha-1);
      font-size: var(--text-footnote);
    }
    .cleanup-row .c-tag {
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      background: var(--fill);
      color: var(--ink-2);
      font-size: var(--text-caption);
    }

    /* ───────── 13. Prototype Control Dock & Toast ───────── */
    .proto-dock {
      position: fixed;
      bottom: 12px;
      left: 50%;
      translate: -50% 0;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-radius: var(--radius-pill);
      background: var(--surface-3);
      box-shadow: var(--shadow-pop);
      font-size: var(--text-caption);
      white-space: nowrap;
      max-width: calc(100vw - 16px);
      overflow-x: auto;
    }
    .proto-dock button {
      height: 24px;
      padding: 0 9px;
      border-radius: var(--radius-pill);
      color: var(--ink-2);
      font-weight: 500;
      transition: background var(--dur-1) var(--ease), color var(--dur-1) var(--ease);
    }
    .proto-dock button:hover {
      background: var(--ghost-hover);
      color: var(--ink);
    }
    .proto-dock button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--surface-1);
    }
    .proto-dock .sep {
      width: 1px;
      height: 14px;
      background: var(--line);
      margin: 0 2px;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      translate: -50% -12px;
      z-index: 80;
      padding: 7px 14px;
      border-radius: var(--radius-pill);
      background: var(--ink);
      color: var(--surface-1);
      font-size: var(--text-footnote);
      font-weight: 500;
      box-shadow: var(--shadow-2);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-2) var(--ease), translate var(--dur-2) var(--ease);
    }
    .toast[data-show="true"] {
      opacity: 1;
      translate: -50% 0;
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Main Viewport Host (Desktop Harness or Phone 390px Frame) -->
  <div id="viewport" class="viewport-host" data-device="desktop"></div>

  <!-- Floating ⋯ Story Action Menu -->
  <div id="story-menu" class="pop-menu" hidden></div>

  <!-- Cleanup Sheet (#75 retained cleanup dialog, opened from sidebar top menu) -->
  <dialog id="cleanup-dialog" class="modal-sheet" onclick="if(event.target===this)this.close()">
    <div class="modal-inner" id="cleanup-content"></div>
  </dialog>

  <!-- Persona Picker Sheet -->
  <dialog id="persona-dialog" class="modal-sheet" onclick="if(event.target===this)this.close()">
    <div class="modal-inner" id="persona-content"></div>
  </dialog>

  <!-- Interactive Prototype Control Dock -->
  <nav class="proto-dock" aria-label="原型状态切换">
    <button type="button" id="dock-desktop" aria-pressed="true" onclick="setDevice('desktop')">桌面 (72rem+)</button>
    <button type="button" id="dock-mobile" aria-pressed="false" onclick="setDevice('mobile')">手机 (390px)</button>

    }
    function isStoryBusy(s) {
      return busyEnabled ? s.busy : null;
    }

    // ───────── 4. Helpers & Search Matching ─────────
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function highlightMark(text, q) {
      if (!q.trim()) return escapeHtml(text);
      const needle = q.trim();
      const idx = text.toLowerCase().indexOf(needle.toLowerCase());
      if (idx < 0) return escapeHtml(text);
      return (
        escapeHtml(text.slice(0, idx)) +
        `<mark>${escapeHtml(text.slice(idx, idx + needle.length))}</mark>` +
        escapeHtml(text.slice(idx + needle.length))
      );
    }
    function storyMatches(s, q) {
      const t = q.trim().toLowerCase();
      if (!t) return { match: true, snippet: null };
      const titleHit = (s.title || "New story").toLowerCase().includes(t);
      const bodyHit = s.hitText && s.hitText.toLowerCase().includes(t);
      return {
        match: titleHit || bodyHit,
        snippet: bodyHit ? s.hitText : null,
      };
    }

    // ───────── 5. Render Sidebar (Used in Desktop Left Column & Mobile Drawer) ─────────
    function renderSidebarHTML(inMobileDrawer = false) {
      const q = searchQuery.trim();
      const groupsHTML = CARDS.map((c) => {
        const cardStories = stories
          .filter((s) => s.card === c.id)
          .sort((a, b) => Number(b.starred) - Number(a.starred));

        const matchedStories = cardStories
          .map((s) => ({ s, ...storyMatches(s, q) }))
          .filter((x) => x.match);

        if (q && matchedStories.length === 0 && !c.title.toLowerCase().includes(q.toLowerCase())) {
          return "";
        }

        const isOpen = q ? true : expandedCards.has(c.id);
        const isCardPageCurrent = stageView === "card" && stageCardId === c.id;
        const hasBusyChild = cardStories.some((s) => isStoryBusy(s));

        const rowsHTML = matchedStories.length
          ? matchedStories
              .map(({ s, snippet }) => {
                const isCur = stageView !== "card" && s.id === activeStoryId;
                const b = isStoryBusy(s);
                const titleText = s.title ?? "New story";
                return `
                  <li class="story-item" aria-current="${isCur ? "true" : "false"}">
                    <div class="story-row" onclick="selectStory(${s.id})">
                      <span class="story-main">
                        ${s.starred ? `<span class="story-star" title="已收藏">${ICONS.starFill}</span>` : ""}

                          aria-label="故事操作"

                          onclick="openStoryMenu(event, ${s.id})"

                        </button>

                    ${
                      snippet
                        ? `<div class="story-hit" onclick="selectStory(${s.id})">

                          </div>`
                        : ""
                    }
                  </li>
                `;
              })
              .join("")

        return `

              <button

                aria-label="${isOpen ? "收起分组" : "展开分组"}"
                onclick="toggleCardGroup('${c.id}')"

                ${ICONS.caretDown}

              <button
                type="button"

                onclick="openCardInStage('${c.id}')"

                <span class="name">${escapeHtml(c.title)}</span>
                <span class="group-meta">
                  ${!isOpen && hasBusyChild ? `<i class="busy-dot" title="组内有进行中的局"></i>` : ""}
                  <span>${cardStories.length}</span>
                  <span class="card-enter">${ICONS.caretRight}</span>
                </span>
              </button>
            </div>
            <ul class="story-list">
              ${rowsHTML}
            </ul>
          </section>
        `;
      }).join("");

      return `
        <div class="sidebar">
          <div class="side-top">
            <div class="input-box">
              ${ICONS.search}

                [Breakpoint 2 · Folded Summary] turns 1..8 compressed<br/>
                [Breakpoint 3 · Transcript Tail] turns 9..13 cached<br/>
                [Live Turn Input] "${escapeHtml(s.hitText || "我解下腰间那柄旧短剑…")}"
              </p>
            </div>
          </div>
        </div>
      `;
    }

    // ───────── 7. Render Mobile Overlays (Drawer & Session Sheet) ─────────
    function renderMobileOverlaysHTML() {
      if (mobileDrawerOpen) {
        return `
          <div class="mobile-overlay" onclick="if(event.target===this)closeMobileOverlays()">
            <aside class="mobile-drawer">
              ${renderSidebarHTML(true)}
            </aside>
          </div>
        `;
      }
      if (mobileSheetOpen) {
        const s = currentStory();
        const c = getCard(s.card);
        const pid = personaByCard[c.id];
        const pName = PERSONAS.find((p) => p.id === pid)?.name ?? "卡片默认";
        return `
          <div class="mobile-overlay" onclick="if(event.target===this)closeMobileOverlays()">
            <div class="mobile-sheet">
              <div class="sheet-head">
                <h3>当前局设定 · ${escapeHtml(s.title ?? "New story")}</h3>
                <button type="button" class="icon sm" onclick="closeMobileOverlays()">${ICONS.close}</button>
              </div>
              <button type="button" class="session-cardhead" onclick="closeMobileOverlays(); openCardInStage('${c.id}')">
                <div class="top">
                  <span>${escapeHtml(c.title)} · 卡片页与开场</span>
                  <span style="width:14px;height:14px;display:inline-flex">${ICONS.caretRight}</span>
                </div>
                <p>${escapeHtml(c.summary)}</p>
              </button>
              <div class="session-row">
                <span class="lbl">人设 (Persona)</span>
                <button type="button" class="session-chosen" onclick="closeMobileOverlays(); openPersonaModal()">
                  <span class="chip">${escapeHtml(pName)}</span>
                  <span style="width:14px;height:14px;display:inline-flex">${ICONS.caretRight}</span>
                </button>
              </div>
              <div class="session-row">
                <span class="lbl">写作偏好 (Writing)</span>
                <button type="button" class="session-chosen" onclick="closeMobileOverlays(); showToast('打开 Writing 写作页')">
                  <span style="display:flex; gap:4px; flex-wrap:wrap;">
                    ${c.writingAll.map((w) => `<span class="chip">${escapeHtml(w)}</span>`).join("")}
                  </span>
                  <span style="width:14px;height:14px;display:inline-flex">${ICONS.caretRight}</span>
                </button>
              </div>
              <div style="display:flex; gap:8px; padding-top:4px;">
                <button type="button" class="chip" style="flex:1; justify-content:center; height:34px;" onclick="closeMobileOverlays(); showToast('打开 Timeline 时间线')">
                  ${ICONS.tree} <span>时间线 (Timeline)</span>
                </button>
                <button type="button" class="chip" style="flex:1; justify-content:center; height:34px;" onclick="closeMobileOverlays(); setStageView('inspect')">
                  ${ICONS.probe} <span>检查器 (Inspector)</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }
      return "";
    }

    // ───────── 8. Master Render & Interactions ─────────
    function renderAll() {
      const host = document.getElementById("viewport");
      host.setAttribute("data-device", device);

      let stageContent = "";
      if (stageView === "reader") stageContent = renderReaderStageHTML(device === "mobile");
      else if (stageView === "card") stageContent = renderCardStageHTML();
      else stageContent = renderInspectStageHTML();

      if (device === "mobile") {
        host.innerHTML = `
          <div class="phone-frame">
            ${stageContent}
            ${renderMobileOverlaysHTML()}
          </div>
        `;
      } else {
        host.innerHTML = `
          <div class="harness" data-collapsed="${sidebarCollapsed ? "true" : "false"}">
            <aside class="sidebar-card" aria-label="故事库侧边栏">
              ${renderSidebarHTML(false)}
            </aside>
            <div class="stage" data-view="${stageView}">
              ${stageContent}
            </div>
          </div>
        `;
      }

      // Sync dock buttons
      document.getElementById("dock-desktop").setAttribute("aria-pressed", String(device === "desktop"));
      document.getElementById("dock-mobile").setAttribute("aria-pressed", String(device === "mobile"));
      document.getElementById("dock-view-reader").setAttribute("aria-pressed", String(stageView === "reader"));
      document.getElementById("dock-view-card").setAttribute("aria-pressed", String(stageView === "card"));
      document.getElementById("dock-view-inspect").setAttribute("aria-pressed", String(stageView === "inspect"));
      document.getElementById("dock-collapse").setAttribute("aria-pressed", String(sidebarCollapsed));
      document.getElementById("dock-helpers").setAttribute("aria-pressed", String(showHelperBar));
      document.getElementById("dock-note").setAttribute("aria-pressed", String(showNoteAttach));
      document.getElementById("dock-search").setAttribute("aria-pressed", String(searchQuery === "短剑"));
      document.getElementById("dock-busy").setAttribute("aria-pressed", String(busyEnabled));
    }

    function setDevice(d) {
      device = d;
      closeStoryMenu();
      renderAll();
    }
    function setStageView(v) {
      stageView = v;
      closeStoryMenu();
      renderAll();
    }
    function toggleSidebarCollapse() {
      if (device === "mobile") {
        mobileDrawerOpen = !mobileDrawerOpen;
      } else {
        sidebarCollapsed = !sidebarCollapsed;
      }
      renderAll();
    }
    function toggleHelperBar() {
      showHelperBar = !showHelperBar;
      renderAll();
    }
    function toggleNoteAttach() {
      showNoteAttach = !showNoteAttach;
      if (showNoteAttach && !noteDraftText) {
        noteDraftText = "让裴青舟注意到剑柄末端的浅刻鹤纹，但暂时不动声色";
      }
      renderAll();
    }
    function openNoteAttach() {
      showNoteAttach = true;
      renderAll();
      const inp = document.querySelector(".composer-attach input");
      if (inp) inp.focus();
    }
    function closeNoteAttach() {
      showNoteAttach = false;
      noteDraftText = "";
      renderAll();
    }
    function insertHelperText(openGlyph, closeGlyph) {
      const box = document.getElementById("composer-input");
      if (!box) return;
      const a = box.selectionStart ?? composerDraftText.length;
      const b = box.selectionEnd ?? a;
      const inner = composerDraftText.slice(a, b);
      composerDraftText =
        composerDraftText.slice(0, a) + openGlyph + inner + closeGlyph + composerDraftText.slice(b);
      renderAll();
      const nextBox = document.getElementById("composer-input");
      if (nextBox) {
        nextBox.focus();
        nextBox.setSelectionRange(a + openGlyph.length + inner.length, a + openGlyph.length + inner.length);
      }
    }
    function insertSnippet(text, isNote) {
      if (isNote && currentCardId() !== "yandao") {
        showNoteAttach = true;
        noteDraftText = text;
        renderAll();
        const inp = document.querySelector(".composer-attach input");
        if (inp) inp.focus();
      } else {
        composerDraftText = (composerDraftText ? composerDraftText + " " : "") + text;
        renderAll();
        const nextBox = document.getElementById("composer-input");
        if (nextBox) nextBox.focus();
      }
    }
    function toggleCardGroup(cardId) {
      if (expandedCards.has(cardId)) expandedCards.delete(cardId);
      else expandedCards.add(cardId);
      renderAll();
    }
    function selectStory(id) {
      activeStoryId = id;
      const s = currentStory();
      expandedCards.add(s.card);
      stageView = "reader";
      mobileDrawerOpen = false;
      closeStoryMenu();
      const b = isStoryBusy(s);
      showToast(
        b
          ? `切换到「${s.title ?? "New story"}」：GET /turn 接回快照 (${b}) 并续流`
          : `切换到「${s.title ?? "New story"}」（后台进行中的局继续运行，不中断）`
      );
      renderAll();
    }
    function openCardInStage(cardId) {
      stageCardId = cardId;
      stageOpeningIdx = 0;
      stageView = "card";
      expandedCards.add(cardId);
      mobileDrawerOpen = false;
      closeStoryMenu();
      renderAll();
    }
    function cycleOpening(total) {
      stageOpeningIdx = (stageOpeningIdx + 1) % total;
      renderAll();
    }
    function beginNewStoryFromCard(cardId) {
      const c = getCard(cardId);
      const newId = Math.max(...stories.map((s) => s.id)) + 1;
      stories.unshift({
        id: newId,
        card: cardId,
        title: null,
        starred: false,
        turns: 0,
        ago: "刚刚",
        busy: null,
        hitText: "",
        hitTurn: 0,
      });
      activeStoryId = newId;
      expandedCards.add(cardId);
      stageView = "reader";
      showToast(`POST /stories { card: "${cardId}" } + greet(${stageOpeningIdx}) → 建局并进入阅读器`);
      renderAll();
    }

    function onSearchInput(val) {
      searchQuery = val;
      const scroller = document.getElementById("tree-scroller");
      if (!scroller) return renderAll();
      // Re-render whole sidebar except keep focus in search input
      renderAll();
      const inp = document.querySelector(".side-top input[type='search']");
      if (inp) {
        inp.focus();
        inp.setSelectionRange(val.length, val.length);
      }
    }
    function demoSearch() {
      searchQuery = searchQuery === "短剑" ? "" : "短剑";
      renderAll();
    }
    function toggleBusyDemo() {
      busyEnabled = !busyEnabled;
      renderAll();
    }
    function startStoryTurn(id) {
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      busyEnabled = true;
      s.busy = "narrate";
      const c = getCard(s.card);
      if (pinnedByCard[c.id]) {
        pinnedByCard[c.id] = null;
        showToast("已发送回合（Pin 线索已随 Input.pin 带走并消耗；可随时切去别的局）");
      } else {
        showToast("已发送回合（后台运行中，你可以随时点击左侧其他局或卡片）");
      }
      renderAll();
    }
    function stopStoryTurn(id) {
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      s.busy = null;
      showToast("POST /stop：显式停止当前回合");
      renderAll();
    }

    function togglePinDemo() {
      const cid = currentCardId();
      const c = getCard(cid);
      pinnedByCard[cid] = pinnedByCard[cid] ? null : c.clues[0].hook;
      if (stageView !== "reader") stageView = "reader";
      renderAll();
    }
    function toggleCluePin(cid, hook) {
      pinnedByCard[cid] = pinnedByCard[cid] === hook ? null : hook;
      renderAll();
    }
    function clearPin(cid) {
      pinnedByCard[cid] = null;
      renderAll();
    }

    // ───────── 9. Row ⋯ Popover Menu ─────────
    function openStoryMenu(ev, id) {
      ev.stopPropagation();
      const menu = document.getElementById("story-menu");
      if (menuStoryId === id && !menu.hidden) {
        return closeStoryMenu();
      }
      menuStoryId = id;
      const s = stories.find((x) => x.id === id);
      if (!s) return;
      const rect = ev.currentTarget.getBoundingClientRect();
      menu.innerHTML = `
        <button type="button" class="pop-item" onclick="renameStoryPrompt(${s.id})">
          ${ICONS.pencil} <span>重命名…</span>
        </button>
        <button type="button" class="pop-item" onclick="toggleStarStory(${s.id})">
          ${s.starred ? ICONS.starFill : ICONS.star} <span>${s.starred ? "取消星标" : "设为星标"}</span>
        </button>
        <button type="button" class="pop-item" onclick="exportStoryAction(${s.id})">
          ${ICONS.export} <span>导出 (.md / .json)</span>
        </button>
      `;
      menu.hidden = false;
      menu.style.top = `${Math.min(rect.bottom + 4, window.innerHeight - 150)}px`;
      menu.style.left = `${Math.min(rect.left, window.innerWidth - 165)}px`;
      renderAll();
    }
    function closeStoryMenu() {
      const menu = document.getElementById("story-menu");
      if (menu) menu.hidden = true;
      menuStoryId = null;
    }
    window.addEventListener("click", () => {
      if (menuStoryId !== null) {
        closeStoryMenu();
        renderAll();
      }
    });

    function toggleStarStory(id) {
      const s = stories.find((x) => x.id === id);
      if (s) s.starred = !s.starred;
      closeStoryMenu();
      renderAll();
    }
    function renameStoryPrompt(id) {
      const s = stories.find((x) => x.id === id);
      closeStoryMenu();
      if (!s) return;
      const next = prompt("重命名故事（留空恢复 New story）：", s.title ?? "");
      if (next !== null) {
        s.title = next.trim() || null;
        renderAll();
      }
    }
    function exportStoryAction(id) {
      const s = stories.find((x) => x.id === id);
      closeStoryMenu();
      showToast(`打开导出确认框：「${s?.title ?? "New story"}」(.md 阅读稿 / .json 完整树)`);
      renderAll();
    }
    function deleteStoryAction(id) {
      closeStoryMenu();
      stories = stories.filter((s) => s.id !== id);
      if (activeStoryId === id && stories.length) activeStoryId = stories[0].id;
      showToast("已删除故事");
      renderAll();
    }

    // ───────── 10. Cleanup Sheet (#75 retained batch cleanup) ─────────
    function openCleanupModal() {
      cleanupSelected = new Set(stories.filter((s) => s.turns === 0 || (s.title === null && !s.starred)).map((s) => s.id));
      renderCleanupModalContent();
      document.getElementById("cleanup-dialog").showModal();
    }
    function renderCleanupModalContent() {
      const el = document.getElementById("cleanup-content");
      const emptyCount = stories.filter((s) => s.turns === 0).length;
      const unnamedCount = stories.filter((s) => s.title === null && !s.starred).length;
      el.innerHTML = `
        <div class="modal-head">
          <h3>批量清理故事 <span class="chip">${stories.length}</span></h3>
          <button type="button" class="icon sm" onclick="document.getElementById('cleanup-dialog').close()">${ICONS.close}</button>
        </div>
        <div class="modal-body">
          <div style="display:flex; align-items:center; gap:6px; padding-bottom:4px;">
            <span style="font-size:var(--text-caption); color:var(--ink-3);">快选：</span>
            <button type="button" class="chip" onclick="selectCleanupPreset('empty')">空档 (${emptyCount})</button>
            <button type="button" class="chip" onclick="selectCleanupPreset('unnamed')">未命名未收藏 (${unnamedCount})</button>
            <button type="button" class="chip" onclick="selectCleanupPreset('clear')">清空</button>
          </div>
          ${stories
            .map((s) => {
              const c = getCard(s.card);
              const checked = cleanupSelected.has(s.id);
              return `
                <label class="cleanup-row" style="cursor:pointer">
                  <input type="checkbox" ${checked ? "checked" : ""} onchange="toggleCleanupRow(${s.id})" />
                  <span class="c-tag">${escapeHtml(c.title)}</span>
                  <span style="flex:1; font-weight:${s.title ? 500 : 400}; color:${s.title ? "var(--ink)" : "var(--ink-2)"}">
                    ${escapeHtml(s.title ?? "New story")}
                  </span>
                  <span style="font-size:var(--text-caption); color:var(--ink-3); font-family:var(--font-mono);">
                    ${s.turns} 轮 · ${s.ago}
                  </span>
                </label>
              `;
            })
            .join("")}
        </div>
        <div class="modal-foot">
          <span style="color:var(--ink-3)">保留 #75 的批量清理 Sheet，从侧栏顶部唤起</span>
          <button
            type="button"
            class="chip danger"
            ${cleanupSelected.size === 0 ? "disabled" : ""}
            onclick="commitCleanupDelete()"
          >
            删除选中 ${cleanupSelected.size || ""}
          </button>
        </div>
      `;
    }
    function selectCleanupPreset(kind) {
      if (kind === "clear") cleanupSelected.clear();
      if (kind === "empty") stories.filter((s) => s.turns === 0).forEach((s) => cleanupSelected.add(s.id));
      if (kind === "unnamed") stories.filter((s) => s.title === null && !s.starred).forEach((s) => cleanupSelected.add(s.id));
      renderCleanupModalContent();
    }
    function toggleCleanupRow(id) {
      if (cleanupSelected.has(id)) cleanupSelected.delete(id);
      else cleanupSelected.add(id);
      renderCleanupModalContent();
    }
    function commitCleanupDelete() {
      const n = cleanupSelected.size;
      stories = stories.filter((s) => !cleanupSelected.has(s.id));
      if (!stories.some((s) => s.id === activeStoryId) && stories.length) {
        activeStoryId = stories[0].id;
      }
      document.getElementById("cleanup-dialog").close();
      showToast(`已批量清理 ${n} 个故事`);
      renderAll();
    }

    // ───────── 11. Persona Picker Sheet ─────────
    function openPersonaModal() {
      const cid = currentCardId();
      const c = getCard(cid);
      const curPid = personaByCard[cid];
      const el = document.getElementById("persona-content");
      el.innerHTML = `
        <div class="modal-head">
          <h3>选择人设 · ${escapeHtml(c.title)}</h3>
          <button type="button" class="icon sm" onclick="document.getElementById('persona-dialog').close()">${ICONS.close}</button>
        </div>
        <div class="modal-body">
          <button
            type="button"
            class="cleanup-row"
            style="text-align:left; justify-content:space-between;"
            onclick="pickPersonaForCard('${cid}', undefined)"
          >
            <div>
              <div style="font-weight:600">卡片默认 <span class="c-tag">随卡</span></div>
              <div style="font-size:var(--text-caption); color:var(--ink-3)">使用卡片自带的角色设定</div>
            </div>
            ${!curPid ? `<span style="width:16px;height:16px">${ICONS.check}</span>` : ""}
          </button>
          ${PERSONAS.map(
            (p) => `
              <button
                type="button"
                class="cleanup-row"
                style="text-align:left; justify-content:space-between;"
                onclick="pickPersonaForCard('${cid}', '${p.id}')"
              >
                <div>
                  <div style="font-weight:600">${escapeHtml(p.name)}</div>
                  <div style="font-size:var(--text-caption); color:var(--ink-3)">${escapeHtml(p.bio)}</div>
                </div>
                ${curPid === p.id ? `<span style="width:16px;height:16px">${ICONS.check}</span>` : ""}
              </button>
            `
          ).join("")}
        </div>
      `;
      document.getElementById("persona-dialog").showModal();
    }
    function pickPersonaForCard(cid, pid) {
      personaByCard[cid] = pid;
      document.getElementById("persona-dialog").close();
      showToast(`已切换「${getCard(cid).title}」人设（下一轮请求立即生效）`);
      renderAll();
    }

    // ───────── 12. Mobile Overlays & Theme ─────────
    function openMobileDrawer() {
      mobileDrawerOpen = true;
      mobileSheetOpen = false;
      renderAll();
    }
    function openMobileSheet() {
      mobileSheetOpen = true;
      mobileDrawerOpen = false;
      renderAll();
    }
    function closeMobileOverlays() {
      mobileDrawerOpen = false;
      mobileSheetOpen = false;
      renderAll();
    }
    function toggleTheme() {
      const root = document.documentElement;
      const cur = root.getAttribute("data-theme") || "light";
      root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    }

    let toastTimer = null;
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.setAttribute("data-show", "true");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.setAttribute("data-show", "false"), 2400);
    }

    renderAll();
  </script>
</body>
</html>
