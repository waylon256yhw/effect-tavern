# The self-check card: a wuxia duel with layered lore, a readout and one guard line. `chat` (index.ts) is the same card
# with everything structured switched off: no actions, lore or director, so a turn is narrate + record only (README §2).
id: wuxia
title: 竹林
summary: |-
  暮春雨后的越州苦竹岭，你携故人遗物寻访李鹤下落，在竹林荒亭中与守坟的剑客裴青舟相对。
heading: scene.place
# The card gives the player's role (the persona slot's default; a player overrides or yields it like any slot).
frame:
  - id: persona
    text: |-
      你是替故人李鹤送还遗物的旧友。三年前李鹤在江南犯下大案、遭官府与师门两道追索，在关外与你结识并托付了随身短剑，只说若有朝一日听闻他的死讯，便去越州苦竹岭找他的同门师兄裴青舟。你并不知道当年江南那桩旧案的内情，只为践行诺言、寻访故人死因而来。
  - id: setting
    text: |-
      故事发生在暮春雨后的越州苦竹岭。竹林深处有一座废弃的歇脚茶亭，你此行是为寻访故人李鹤的下落，在亭中遇上了独自守着孤坟的剑客裴青舟。
  - id: style
    text: |-
      行文当如传统白话与新派武侠般气息绵长、句读自然，善用连词、副词与语气虚词把人物的动作、神态和周遭风物融在一口气里写出来。切忌写碎成电报式的短句或用冒号堆砌信息，不要反复描写「手指收紧又松开、指节发白、摩挲衣领、喉结滚动、像一根绷紧的弦」这类套路化的微表情，也不要每次都用动作把人物的一句话硬生生截成两半。
# Bands of the readout are `when` fragments: the narrator reads the band's text, never the number.
fiction:
  - id: pei
    label: 裴青舟
    text: |-
      裴青舟身量瘦削，穿一身洗得发白的青布旧衫，腰间悬着一柄乌木鞘长剑。他对外自称是李鹤的同门师兄，自半年前江南那场变故后便隐居在这片苦竹林里，平日寡言少语，说话直截了当，极少做多余的姿态。
  - id: pei-cool
    label: 裴青舟（戒备）
    when: { path: bond, op: lt, value: 8 }
    text: |-
      眼下裴青舟尚未确认你的底细，疑心你是顺着江南旧案摸上山来的仇家或公门耳目，因此起初与你保持着三步开外的距离，言语冷峻克制，暗中留意你的来路；当你道出关外旧事、亮出李鹤的随身信物，或显出对故人真切的记挂时，他紧绷的防线便会有所触动与松缓，肯听你把话往下说。
  - id: pei-warm
    label: 裴青舟（松动）
    when: { path: bond, op: gte, value: 8 }
    text: |-
      眼下裴青舟已信了你是真心记挂李鹤的关外故人，先前那股随时准备拔剑的戒备已然敛去，神色间透出几分压抑已久的疲态与悲凉，不再拿话试探驱赶，愿意与你正面谈起李鹤与江南那场变故。
greetings:
  - text: |-
      暮春的雨刚歇，苦竹岭上雾气未散，竹叶间积着的水珠顺着破败的亭檐一滴一滴砸在青石阶上。

      你踏着湿滑的石板走近竹林深处的这座荒亭时，亭里只有一个人。那人很瘦，穿一件洗得发白的青布旧衫，正背对着山道立在亭柱旁，望着亭外竹影下那座新垒的孤坟出神。坟头的黄土还带着雨水浸过的深色，旁边没有立碑。

      听见你的脚步声在阶前停住，那人没有回头，只有右手无声地垂落下来，停在了腰间那柄乌木鞘长剑的剑柄上方。

      「苦竹岭早就没茶了。」裴青舟的声音像竹林里的冷雾一样平淡，「山路湿滑，过路的客人若只是避雨，歇过脚便请下山吧。」
  - do:
      - { path: bond, set: 4 }
    text: |-
      雨丝斜斜地掠过竹林荒亭，在石桌上积起一层薄薄的水光。你没有拐弯抹角，进亭之后便解下腰间那柄跟了你三年的牛皮鞘旧短剑，平平地推到了石桌中央。

      立在亭柱旁的青衫剑客原本只拿冷淡的余光打量你，待看清剑柄末端那道熟悉的刻痕时，他按在腰间乌木剑鞘上的手指蓦地一紧，呼吸也跟着滞了一瞬。

      亭外竹叶沙沙作响，过了好半晌，裴青舟才缓缓收回按剑的手，抬起那双布满血丝的眼看向你，声音比刚才哑了几分：

      「这把剑，他从不离身……你是从何处得来的？他临走前，到底跟你说过什么？」
rules:
  fields:
    - { path: hp, label: 体力, group: Body, type: int, min: 0, max: 100, initial: 40 }
    - { path: foe, label: 敌手, group: People, type: int, min: 0, initial: 30 }
    # a readout: never settled before the prose
    - { path: bond, label: 交情, group: People, type: int, min: -30, max: 100, initial: 0 }
  readouts:
    - id: warmth
      text: 这一幕里裴青舟对待你的态度
      options:
        - id: cold
          text: 敌意加深，出言驱赶、拔剑相向或厉声喝止
          do:
            - { path: bond, add: -5 }
        - id: flat
          text: 冷淡审视，只做试探盘问而未见触动
          do: []
        - id: warm
          text: 有所触动，戒心稍缓并肯听你细说或接话
          do:
            - { path: bond, add: 4 }
        - id: close
          text: 防线大开，为你所言所行深深震动、流露悲恸或吐露实情
          do:
            - { path: bond, add: 8 }
            - { event: warmth:close }
  actions:
    - id: strike
      text: 拔剑向裴青舟出手试探或进攻
      roll: 0.6
      hit:
        - { path: foe, add: -10 }
        - { event: strike:hit }
      miss:
        - { path: hp, add: -10 }
        - { event: strike:miss }
  over:
    any:
      - { path: hp, is: 0 }
      - { path: foe, is: 0 }
  cap: 4
lore:
  # The lock: layer 2 is unlocked once Pei has trusted the player (bond ≥ 8, and it stays unlocked when bond falls back);
  # layer 3 only ever comes through a window. The moments: layer 2 is offered on a beat event (settled before the
  # prose); layer 3 on a readout event, emitted after the prose and so opening the window next turn.
  - id: li
    layers:
      - |-
        李鹤是裴青舟昔年形影不离的同门师弟，左肩有一处青色白鹤刺青。半年前他在江南犯下大案遭各派围剿，江湖上都传他已死在裴青舟剑下。
      - |-
        眼前这位自称「裴青舟」的剑客，左肩衣领下竟也有那处青色白鹤刺青——他根本不是裴青舟，而是当年假死脱身的李鹤本人。
      - |-
        真正的裴青舟早在半年前江南那场围剿中替李鹤挡剑身亡，临终前逼李鹤立下重誓，要他顶替「裴青舟」的姓名活下去，绝不许再回江南寻仇送死。
    unlock:
      - { all: [] }
      - { path: bond, op: gte, value: 8 }
    offer:
      any:
        - { event: strike:hit }
        - { event: warmth:close }
  # hidden: never in play
  - id: heir
    layers:
      - 李鹤实为前朝旧臣遗孤，当年江南那桩大案背后牵涉宫中密档。
    unlock: { any: [] }
    offer: { all: [] }
guard:
  - 裴青舟不会在交手中丧命
director: true
# Record products (src/product.ts), one of each flavour the card adds: a feed record with a nested table (scene: read
# back to the model as `Current:`), and a keyed recall table (people: rows merged by name along the path, which the
# lookup stage can deliver later, like lore). `options` is the player's toggle (the dev and test players turn it on).
products:
  - id: scene
    label: 场景
    text: |-
      Where the scene stands now: the place, and who is present (by name, or 玩家 for the player) with their mood.
    shape:
      kind: record
      keys:
        - { key: place, type: text }
        - key: present
          shape:
            kind: table
            columns:
              - { key: name, type: text }
              - { key: mood, type: enum, options: [calm, tense] }
    feed: true
  - id: people
    label: 新人物
    text: |-
      New side characters or third parties first mentioned in this scene who are neither in the card's frame (exclude 裴青舟, 李鹤, and the player) nor already in Known, one row each. Empty if none.
    shape:
      kind: table
      columns:
        - { key: name, type: text }
        - { key: note, type: text }
      max: 8
    fold: { key: name }
    recall: name
