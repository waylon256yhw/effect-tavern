packages:
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@solidjs/diagnostics":
    skills: true
  "@solidjs/web":
    skills: true
  solid-js:
    skills: true
# ponytail: temporary, lets the ai-sdk pins pass ~/.npmrc's min-release-age=7; drop once the pins are a week old.
minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - ai
