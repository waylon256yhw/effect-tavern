packages:
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  "@effect/platform-node-shared": 4.0.6
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@copilotkit/aimock":
    skills: true
  "@solidjs/diagnostics":
    skills: true
  "@solidjs/web":
    skills: true
  solid-js:
    skills: true
# ponytail: temporary, lets the ai-sdk pins pass ~/.npmrc's min-release-age=7; drop once the pins are a week old.
minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - ai
  - "@lobehub/icons-static-svg"
  - "@copilotkit/aimock"
  - "@x18n/builtins@0.1.3"
  - "@x18n/cli@0.1.3"
  - "@x18n/core@0.1.3"
  - "@x18n/node@0.1.3"
  - "@x18n/ui@0.1.3"
