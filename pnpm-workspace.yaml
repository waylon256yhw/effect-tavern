packages:
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  "@copilotkit/aimock":
    skills: true
  "@solidjs/diagnostics":
    skills: true
  "@solidjs/web":
    skills: true
  "@x18n/cli":
    skills: true
  solid-js:
    skills: true
# temporary: lets fresh pins pass minimumReleaseAge; drop once a week old.
minimumReleaseAgeExclude:
  - vite-plus@1.6.0
  - "@voidzero-dev/vite-plus-core@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.6.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.6.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.6.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.6.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.6.0"
  - effect@4.1.4
  - "@effect/platform-bun@4.1.4"
  - "@effect/platform-node-shared@4.1.4"
  - "@copilotkit/aimock@1.48.0"
